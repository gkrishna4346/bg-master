<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullet Chamber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<script>
  // Pick the theme before the page paints: saved choice, else the device setting.
  (function () {
    let t = null;
    try { t = localStorage.getItem('bc-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* ============================================================
     BULLET CHAMBER: one file, six apps.
     Theme: edit these variables to recolor everything.
     ============================================================ */
  /* The screen is cut diagonally into two sides.
     Light theme: LEFT = light steel, RIGHT = dark gunmetal.
     Dark theme:  LEFT = dark gunmetal, RIGHT = light steel.
     The logo, menu and theme switch take the OPPOSITE side's colors
     so they stand out from the side they sit on. */
  :root {
    --brass: #C9A24A;       /* cartridges / accent / seam */
    --brass-hi: #E2BF6A;    /* active cartridge */
    --spin-ms: 1500;        /* spin length (read by JS) */
    --seam-top: 57%;        /* where the diagonal cut meets the top edge */
    --seam-bottom: 43%;     /* ...and the bottom edge */
    --display: 'Oswald', 'Arial Narrow', sans-serif;
  }
  /* LIGHT side colors */
  html[data-theme="light"] .L, html[data-theme="dark"] .R {
    --bg: #CDD2D6;
    --page: repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, rgba(0,0,0,.035) 1px 2px, transparent 2px 4px),
            linear-gradient(100deg, rgba(255,255,255,0) 20%, rgba(255,255,255,.28) 45%, rgba(255,255,255,0) 70%),
            linear-gradient(180deg, #D5DADE, #BFC5CA);
    --glass: rgba(238,240,242,.95);  /* logo pill */
    --panel: #EEF0F2;       /* menu tabs */
    --line: #B9C0C6;        /* tab borders */
    --edge: rgba(58,65,72,.14);
    --shadow: rgba(22,25,28,.22);
    --ink: #3A4148;         /* text */
    --metal: #3A4148;       /* cylinder: dark gunmetal on a light pill */
    --hole: #16191C;        /* chamber holes */
  }
  /* DARK side colors */
  html[data-theme="dark"] .L, html[data-theme="light"] .R {
    --bg: #16191C;
    --page: radial-gradient(1000px 700px at 8% 4%, #2A3036 0%, #1B1F23 45%, #131619 100%);
    --glass: rgba(38,43,48,.95);
    --panel: #2A3036;
    --line: #444C54;
    --edge: rgba(231,234,237,.12);
    --shadow: rgba(0,0,0,.5);
    --ink: #E7EAED;
    --metal: #C4CAD0;       /* cylinder: light polished steel on a dark pill */
    --hole: #101214;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body { font-family: var(--display); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  /* ---------- Split background ---------- */
  .side { position: fixed; inset: 0; z-index: -2; background: var(--page), var(--bg); }
  .side.R { clip-path: polygon(var(--seam-top) 0, 100% 0, 100% 100%, var(--seam-bottom) 100%); }
  .seam { position: fixed; inset: 0; z-index: -1; background: var(--brass); pointer-events: none;
          clip-path: polygon(calc(var(--seam-top) - 2px) 0, calc(var(--seam-top) + 2px) 0, calc(var(--seam-bottom) + 2px) 100%, calc(var(--seam-bottom) - 2px) 100%); }
  .stage { color: var(--ink); }

  /* ---------- Floating logo ---------- */
  .logo { position: fixed; top: 20px; left: 20px; z-index: 10; display: flex; align-items: center; gap: 14px;
          padding: 8px 20px 8px 8px; border: 0; border-radius: 999px; cursor: pointer; text-align: left; color: var(--ink);
          background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
          box-shadow: 0 10px 30px var(--shadow), 0 0 0 1px var(--edge); }
  .logo:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  /* ---------- Light / dark switch ---------- */
  .theme { position: fixed; top: 28px; right: 28px; z-index: 10; display: flex; gap: 4px; padding: 4px; border-radius: 999px;
           background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
           box-shadow: 0 4px 14px var(--shadow), 0 0 0 1px var(--edge); }
  .theme button { width: 48px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .theme button svg { width: 20px; height: 20px; }
  .theme button[aria-pressed="true"] { background: var(--brass); color: #16191C; }
  .theme button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .theme .sep { width: 1px; margin: 6px 2px; background: var(--line); }
  .snd[aria-pressed="true"] .off, .snd[aria-pressed="false"] .on { display: none; }
  .logo svg { width: 116px; height: 116px; flex: none; display: block; }
  .logo-name { font-weight: 700; font-size: 26px; letter-spacing: .03em; line-height: 1; display: block; }
  .logo-sub { font-weight: 500; font-size: 14px; letter-spacing: .06em; display: block; margin-top: 7px; opacity: .85; }

  /* ---------- Left edge dock (the six apps) ---------- */
  .dock { position: fixed; left: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; z-index: 5; padding: 8px 0; }
  .dk { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); background: var(--panel);
        border: 1px solid var(--line); border-left: 0; border-radius: 0 22px 22px 0;
        height: 36px; padding: 0 7px 0 10px; transform: translateX(-4px); opacity: .85; box-shadow: 0 2px 10px rgba(22,25,28,.14);
        cursor: pointer; transition: transform .22s ease, height .22s ease, opacity .22s, padding .22s, box-shadow .22s; }
  .dk .ico { width: 24px; height: 24px; flex: none; transition: width .22s, height .22s; }
  .dk .ico svg { width: 100%; height: 100%; display: block; }
  .dk .ico text { font-size: 15px; transition: font-size .22s; }
  .dk .lbl { max-width: 0; overflow: hidden; white-space: nowrap; font-weight: 500; font-size: 17px; letter-spacing: .03em; opacity: 0; transition: max-width .25s ease, opacity .2s; }
  .dk:hover, .dk:focus-visible, .dk.peek { transform: none; opacity: 1; height: 58px; padding: 0 18px 0 14px; box-shadow: 0 8px 24px rgba(22,25,28,.24); outline: none; }
  .dk:hover .ico, .dk:focus-visible .ico, .dk.peek .ico { width: 42px; height: 42px; }
  .dk:hover .lbl, .dk:focus-visible .lbl, .dk.peek .lbl { max-width: 220px; opacity: 1; }
  .dk[aria-current="page"] { border: 2px solid var(--brass); border-left: 0; opacity: 1; }
  .dk[aria-current="page"] .case { fill: var(--brass-hi); }
  @media (prefers-reduced-motion: reduce) { .dk, .dk * { transition: none !important; } }

  /* ---------- Body: left blank on purpose ---------- */
  .stage { min-height: 100vh; }
  .app-panel { min-height: 100vh; }

  /* ---------- Chamber SVG ---------- */
  .blur { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .spinning .blur { opacity: .5; transition: opacity .15s ease; }
  .tick { transform-box: view-box; transform-origin: 200px 26px; }
  .tick.click { animation: tick .35s ease; }
  @keyframes tick { 50% { transform: scale(1.5); } }
  .case { fill: var(--brass); transition: fill .2s; }
  .round.on .case { fill: var(--brass-hi); }
</style>
</head>
<body>

<!-- Split background: left side, right side, brass seam -->
<div class="side L" aria-hidden="true"></div>
<div class="side R" aria-hidden="true"></div>
<div class="seam" aria-hidden="true"></div>

<button class="logo R" id="logo" type="button" aria-label="Bullet Chamber: spin and go home">
  <svg viewBox="0 0 400 400" id="logoSvg" aria-hidden="true"></svg>
  <span>
    <span class="logo-name">Bullet Chamber</span>
    <span class="logo-sub">Six Apps · One Chamber</span>
  </span>
</button>

<div class="theme L" role="group" aria-label="Theme and sound">
  <button type="button" data-set="light" aria-label="Light theme" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button type="button" data-set="dark" aria-label="Dark theme" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="snd" id="snd" aria-label="Spin sound" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off" d="m16 9 6 6M22 9l-6 6"/></svg></button>
</div>

<nav class="dock R" id="dock" aria-label="Apps"></nav>

<!-- BODY: blank. Each app gets its own panel; only the open one shows. -->
<main class="stage L">
  <div class="app-panel" data-app="1" hidden><!-- APP 1 goes here --></div>
  <div class="app-panel" data-app="2" hidden><!-- APP 2 goes here --></div>
  <div class="app-panel" data-app="3" hidden><!-- APP 3 goes here --></div>
  <div class="app-panel" data-app="4" hidden><!-- APP 4 goes here --></div>
  <div class="app-panel" data-app="5" hidden><!-- APP 5 goes here --></div>
  <div class="app-panel" data-app="6" hidden><!-- APP 6 goes here --></div>
</main>

<script>
/* ============================================================
   APPS: edit this list. Order = bullet order, top bullet first,
   then clockwise. Same order as the left menu, top to bottom.
   - name: shown in the left menu.
   - url:  if set, the app loads inside its panel (iframe).
   - init(panel): optional, runs once the first time the app opens.
   ============================================================ */
const APPS = [
  { name: 'App 1', url: '' },
  { name: 'App 2', url: '' },
  { name: 'App 3', url: '' },
  { name: 'App 4', url: '' },
  { name: 'App 5', url: '' },
  { name: 'App 6', url: '' },
];

/* ---------------- Chamber drawing ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const C = 200;
const pos = (deg, r) => [C + r * Math.cos(deg * Math.PI / 180), C + r * Math.sin(deg * Math.PI / 180)];
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function buildChamber(svg) {
  const defs = el('defs', {}, svg);
  const mask = el('mask', { id: 'flutes' }, defs);
  el('rect', { x: 0, y: 0, width: 400, height: 400, fill: '#fff' }, mask);
  for (let i = 0; i < 6; i++) { const [x, y] = pos(-60 + i * 60, 164); el('circle', { cx: x, cy: y, r: 24, fill: '#000' }, mask); }
  const g = el('radialGradient', { id: 'sheen', cx: '35%', cy: '28%', r: '75%' }, defs);
  el('stop', { offset: '0%', 'stop-color': '#fff', 'stop-opacity': '.25' }, g);
  el('stop', { offset: '55%', 'stop-color': '#fff', 'stop-opacity': '0' }, g);

  el('circle', { cx: C, cy: C, r: 186, fill: 'none', stroke: 'var(--metal)', 'stroke-opacity': '.45', 'stroke-width': 7, 'stroke-dasharray': '4 18', 'stroke-linecap': 'round' }, svg);
  const tick = el('path', { class: 'tick', d: 'M182,6 L218,6 L200,34 Z', fill: 'var(--brass)' }, svg);

  const cyl = el('g', { class: 'cyl' }, svg);
  el('circle', { cx: C, cy: C, r: 158, fill: 'var(--metal)', mask: 'url(#flutes)' }, cyl);
  const rounds = [], nums = [];
  APPS.forEach((app, i) => {
    const [x, y] = pos(-90 + i * 60, 96);
    const r = el('g', { class: 'round' }, cyl);
    el('circle', { cx: x, cy: y, r: 44, fill: 'var(--hole)' }, r);
    el('circle', { class: 'case', cx: x, cy: y, r: 38 }, r);
    const t = el('text', { class: 'num', x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: 'var(--hole)', 'font-family': 'Oswald, Arial Narrow, sans-serif', 'font-weight': 700, 'font-size': 52 }, r);
    t.textContent = i + 1;
    t._cx = x; t._cy = y;   // the bullet's own center: numbers turn around this point
    rounds.push(r); nums.push(t);
  });
  el('circle', { cx: C, cy: C, r: 22, fill: 'var(--hole)', 'fill-opacity': '.6' }, cyl);
  el('circle', { cx: C, cy: C, r: 7, fill: 'var(--metal)' }, cyl);

  el('circle', { class: 'blur', cx: C, cy: C, r: 96, fill: 'none', stroke: 'var(--brass)', 'stroke-width': 80 }, svg);
  el('circle', { cx: C, cy: C, r: 158, fill: 'url(#sheen)', mask: 'url(#flutes)', 'pointer-events': 'none' }, svg);
  return { svg, cyl, tick, rounds, nums, angle: 0 };
}

/* ---------------- Spin mechanics ---------------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPIN_MS = reduceMotion ? 0 : parseInt(getComputedStyle(document.documentElement).getPropertyValue('--spin-ms')) || 1500;
const OVERSHOOT = 6;   // degrees past the target before clicking back into place

// Put the cylinder at angle a. Each number counter-rotates around its own
// bullet's center, so it stays upright and exactly inside its chamber.
function setAngle(ch, a) {
  ch.cyl.setAttribute('transform', `rotate(${a} 200 200)`);
  ch.nums.forEach(n => n.setAttribute('transform', `rotate(${-a} ${n._cx} ${n._cy})`));
}

const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

/* ---------------- Spin sound ("griii") ----------------
   Made in code with Web Audio, no sound files. One short metallic click
   each time the cylinder passes a notch, so it buzzes at full speed and
   slows to separate clicks as it comes to rest. */
const SOUND = {
  notchDeg: 30,     // a click every 30° of rotation (smaller = denser "griii")
  volume: 0.5,      // 0 to 1
};
let soundOn = true;
try { soundOn = localStorage.getItem('bc-sound') !== 'off'; } catch (e) {}
let actx = null, noise = null, out = null;

// Shared pieces: a noise buffer for the strike, and a limiter so the
// overlapping metal rings at full speed never distort.
function setupAudio(ctx) {
  actx = ctx;
  noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.25), ctx.sampleRate);
  const d = noise.getChannelData(0);
  for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
  out = ctx.createDynamicsCompressor();
  out.threshold.value = -14; out.knee.value = 6; out.ratio.value = 8;
  out.attack.value = 0.002; out.release.value = 0.08;
  out.connect(ctx.destination);
}

function audio() {
  if (!soundOn) return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    setupAudio(new AC());
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

// Envelope helper: silent → peak in `att` s → fades out over `dec` s.
function env(g, when, peak, att, dec) {
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), when + att);
  g.gain.exponentialRampToValueAtTime(0.0001, when + att + dec);
}

// One steel ratchet click at time `when`. `strength` 0..1 (faster = a bit louder).
// Three layers: a sharp steel tick, a short "clink" of the cylinder body,
// and a brief metallic ring at uneven pitches (like a struck steel part).
function click(ac, when, strength) {
  const v = SOUND.volume * (0.55 + 0.45 * strength);

  // 1. sharp tick: very short, bright noise
  const tick = ac.createBufferSource(); tick.buffer = noise;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4500;
  const tg = ac.createGain(); env(tg, when, v * 1.0, 0.0005, 0.006);
  tick.connect(hp).connect(tg).connect(out);
  tick.start(when, Math.random() * 0.2, 0.012);

  // 2. body clink: gives the weight of a steel cylinder (not hollow plastic)
  const body = ac.createBufferSource(); body.buffer = noise;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 950; bp.Q.value = 5;
  const bg = ac.createGain(); env(bg, when, v * 1.4, 0.001, 0.018);
  body.connect(bp).connect(bg).connect(out);
  body.start(when, Math.random() * 0.2, 0.025);

  // 3. metal ring: inharmonic partials, each fading at its own speed
  const base = 1650 * (1 + (Math.random() - 0.5) * 0.03);
  [[1, 0.30, 0.070], [2.76, 0.20, 0.045], [5.40, 0.12, 0.025]].forEach(([ratio, amp, dec]) => {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = base * ratio;
    const og = ac.createGain(); env(og, when, v * amp, 0.001, dec);
    o.connect(og).connect(out);
    o.start(when); o.stop(when + dec + 0.01);
  });
}

// Schedule every notch click for a spin of `travel` degrees over `mainMs`
// (easeOut motion). Times are exact, not per-frame.
function playSpin(travel, mainMs, totalMs) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + 0.01;
  const n = Math.floor(travel / SOUND.notchDeg);
  let prev = 0;
  for (let k = 1; k <= n; k++) {
    const p = 1 - Math.cbrt(1 - (k * SOUND.notchDeg) / travel);   // inverse of easeOut
    const gap = p - prev; prev = p;
    const strength = Math.min(1, 0.012 / Math.max(gap, 0.0001));   // tight gaps = fast = louder
    click(ac, t0 + p * mainMs / 1000, strength);
  }
}

// Spin so round i lands at the top. i = null: spin and re-lock where it is.
function spin(ch, i) {
  return new Promise(resolve => {
    const from = ch.angle;
    const target = i == null ? from % 360 : -i * 60;
    const delta = ((target - from) % 360 + 360) % 360;
    const to = from + 720 + delta;
    ch.angle = to;
    const finish = () => {
      setAngle(ch, to);
      ch.svg.classList.remove('spinning');
      ch.tick.classList.remove('click'); void ch.tick.getBBox(); ch.tick.classList.add('click');
      resolve();
    };
    if (!SPIN_MS) { finish(); return; }
    ch.svg.classList.add('spinning');
    const main = SPIN_MS * 0.82, settle = SPIN_MS - main, t0 = performance.now();
    playSpin(to + OVERSHOOT - from, main, SPIN_MS);
    const frame = now => {
      const t = now - t0;
      if (t < main) {
        setAngle(ch, from + (to + OVERSHOOT - from) * easeOut(t / main));
        if (t > SPIN_MS * 0.45) ch.svg.classList.remove('spinning');
        requestAnimationFrame(frame);
      } else if (t < SPIN_MS) {
        setAngle(ch, to + OVERSHOOT * (1 - easeInOut((t - main) / settle)));
        requestAnimationFrame(frame);
      } else finish();
    };
    requestAnimationFrame(frame);
  });
}

/* ---------------- Build UI ---------------- */
const chamber = buildChamber(document.getElementById('logoSvg'));
const dock = document.getElementById('dock');
const tabs = APPS.map((app, i) => {
  const a = document.createElement('a');
  a.className = 'dk'; a.href = `#/app-${i + 1}`;
  a.innerHTML = `<span class="ico"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="var(--hole)"/><circle class="case" cx="24" cy="24" r="19"/><text x="24" y="25" text-anchor="middle" dominant-baseline="central" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="24" fill="var(--hole)">${i + 1}</text></svg></span><span class="lbl"></span>`;
  a.querySelector('.lbl').textContent = app.name;
  a.addEventListener('click', e => { e.preventDefault(); launch(i); });
  dock.appendChild(a);
  return a;
});

/* ---------------- Routing (#/app-3 etc.) ---------------- */
const panels = [...document.querySelectorAll('.app-panel')];
const started = new Set();
let busy = false;

function mountApp(i) {
  if (started.has(i)) return;
  started.add(i);
  const app = APPS[i], panel = panels[i];
  if (app.url) {
    const f = document.createElement('iframe');
    f.src = app.url; f.title = app.name;
    f.style.cssText = 'width:100%;height:100vh;border:0;display:block';
    panel.appendChild(f);
  }
  if (typeof app.init === 'function') app.init(panel);
}

function render() {
  const m = location.hash.match(/^#\/app-(\d)$/);
  const i = m ? +m[1] - 1 : -1;
  const ok = i >= 0 && i < APPS.length;
  panels.forEach((p, k) => p.hidden = k !== i);
  tabs.forEach((t, k) => k === i ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  chamber.rounds.forEach((r, k) => r.classList.toggle('on', k === i));
  if (ok) mountApp(i);
  document.title = ok ? `${APPS[i].name} · Bullet Chamber` : 'Bullet Chamber';
}

async function launch(i) {
  if (busy) return;
  busy = true;
  await spin(chamber, i);
  busy = false;
  location.hash = `#/app-${i + 1}`;
}

document.getElementById('logo').addEventListener('click', async () => {
  if (busy) return;
  busy = true;
  await spin(chamber, null);
  busy = false;
  if (location.hash) { history.pushState(null, '', location.pathname + location.search); render(); }
});

/* ---------------- Light / dark theme ---------------- */
// Remembers the choice in this browser; with no choice, follows the device setting.
const themeBtns = [...document.querySelectorAll('.theme button[data-set]')];

/* ---------------- Sound on/off ---------------- */
const sndBtn = document.getElementById('snd');
sndBtn.setAttribute('aria-pressed', String(soundOn));
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  sndBtn.setAttribute('aria-pressed', String(soundOn));
  try { localStorage.setItem('bc-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  if (soundOn) { const ac = audio(); if (ac) click(ac, ac.currentTime + 0.01, 1); }   // a little click to confirm
});
// (The starting theme is set by the small script in <head>, before the page paints.)
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
function showTheme() {
  const t = document.documentElement.dataset.theme;
  themeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.set === t)));
}
function setTheme(t, remember) {
  document.documentElement.dataset.theme = t;
  if (remember) { try { localStorage.setItem('bc-theme', t); } catch (e) {} }
  showTheme();
}
themeBtns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.set, true)));
darkQuery.addEventListener?.('change', e => {
  let saved = null; try { saved = localStorage.getItem('bc-theme'); } catch (err) {}
  if (!saved) setTheme(e.matches ? 'dark' : 'light', false);
});
showTheme();

window.addEventListener('hashchange', render);
window.addEventListener('popstate', render);
render();
</script>
</body>
</html>
