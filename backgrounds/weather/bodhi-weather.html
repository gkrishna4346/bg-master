  const statueImg = new Image();
  statueImg.src = STATUE_SRC;
  const PHOTO_W = 108;                                   // width in statue units
  let photo = null;                                     // { day, snow, lamp, w, h }
  function buildPhoto() {
    const iw = statueImg.naturalWidth, ih = statueImg.naturalHeight;
    if (!iw) { photo = null; return; }
    const mk = () => { const c = document.createElement('canvas'); c.width = iw; c.height = ih; return c; };
    // snow settles on surfaces that face up: the top edge of every part of the silhouette
    const top = mk(), tx2 = top.getContext('2d');
    tx2.drawImage(statueImg, 0, 0);
    tx2.globalCompositeOperation = 'destination-out';
    tx2.drawImage(statueImg, 0, Math.round(ih * 0.032));
    tx2.globalCompositeOperation = 'source-in';
    tx2.fillStyle = '#f4f7fb';
    tx2.fillRect(0, 0, iw, ih);
    const snow = mk(), sx2 = snow.getContext('2d');
    sx2.drawImage(statueImg, 0, 0);
    sx2.filter = 'blur(1.2px)';
    sx2.globalAlpha = 1;
    sx2.drawImage(top, 0, -1);
    sx2.drawImage(top, 0, 1);
    sx2.drawImage(top, 0, 2);
    sx2.filter = 'none';
    sx2.globalAlpha = 1;
    sx2.globalCompositeOperation = 'destination-in';
    sx2.drawImage(statueImg, 0, 0);
    // warm lamp light from below: the statue's own carved shading, tinted warm and strongest near the base
    const lamp = mk(), lx2 = lamp.getContext('2d');
    lx2.filter = 'brightness(2.8) contrast(1.15)';
    lx2.drawImage(statueImg, 0, 0);
    lx2.filter = 'none';
    lx2.globalCompositeOperation = 'multiply';
    const lg = lx2.createLinearGradient(0, ih, 0, 0);
    lg.addColorStop(0, 'rgb(255,170,90)');
    lg.addColorStop(0.45, 'rgb(170,90,40)');
    lg.addColorStop(1, 'rgb(60,30,14)');
    lx2.fillStyle = lg;
    lx2.fillRect(0, 0, iw, ih);
    lx2.globalCompositeOperation = 'destination-in';
    lx2.drawImage(statueImg, 0, 0);
    photo = { day: statueImg, snow, lamp, w: PHOTO_W, h: PHOTO_W * ih / iw };
  }
  function photoRect() {
    const u = LY.fs, w = photo.w * u, h = photo.h * u;
    return { x: LY.bx - w / 2, y: LY.seatY + 2.5 * u - h, w, h };
  }

  /* ---------- Ground layers (green and snowy) ---------- */
  function renderGround(snowy) {
    const R = seeded(seed);
    const hl = hills(R);
    const far = layer(), near = layer();

    let x = far.x;
    let g = x.createLinearGradient(0, H * 0.45, 0, H * 0.7);
    g.addColorStop(0, snowy ? '#e9eff4' : '#86ab84');
    g.addColorStop(1, snowy ? '#cfdbe4' : '#6d9a69');
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 8) x.lineTo(px, hl.far(px));
    x.lineTo(W, H); x.closePath(); x.fill();
    for (let i = 0; i < W * 0.9; i++) {
      const px = R() * W, py = hl.far(px) + R() * H * 0.06;
      x.fillStyle = snowy ? `rgba(70,95,90,${0.25 + R() * 0.3})` : `rgba(45,85,45,${0.25 + R() * 0.35})`;
      x.beginPath(); x.ellipse(px, py, (1.5 + R() * 3) * S, (1.2 + R() * 2.4) * S, 0, 0, TAU); x.fill();
    }
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = snowy ? 'rgba(200,215,230,0.35)' : 'rgba(175,205,220,0.42)';
    x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'source-over';

    x = near.x;
    g = x.createLinearGradient(0, H * 0.55, 0, H * 0.78);
    g.addColorStop(0, snowy ? '#f3f7fa' : '#77a94f');
    g.addColorStop(1, snowy ? '#d9e3eb' : '#558c38');
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 8) x.lineTo(px, hl.mid(px));
    x.lineTo(W, H); x.closePath(); x.fill();
    const trees = [];
    for (let px = R() * 30; px < W; px += (18 + R() * 46) * S) trees.push({ px, kind: R() < 0.45 ? 'con' : 'round', h: (30 + R() * 34) * S, dy: R() * H * 0.03 });
    trees.sort((a, b) => a.dy - b.dy);
    for (const t of trees) {
      const by = hl.mid(t.px) + t.dy + 4;
      if (t.kind === 'con') drawConifer(x, t.px, by, t.h, snowy);
      else drawRoundTree(x, t.px, by, t.h, snowy, R);
    }

    x.save();
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = snowy ? 'rgba(205,218,230,0.3)' : 'rgba(165,195,200,0.3)';
    x.fillRect(0, 0, W, H);
    x.restore();

    g = x.createLinearGradient(0, H * 0.72, 0, H);
    g.addColorStop(0, snowy ? '#f8fbfd' : '#82b44c');
    g.addColorStop(0.4, snowy ? '#eef3f7' : '#679d38');
    g.addColorStop(1, snowy ? '#d7e1ea' : '#3e7626');
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 8) x.lineTo(px, hl.meadow(px));
    x.lineTo(W, H); x.closePath(); x.fill();
    const strokes = Math.round(W * H * 0.004);
    x.lineCap = 'round';
    for (let i = 0; i < strokes; i++) {
      const px = R() * W, top = hl.meadow(px), py = top + R() * (H - top);
      const depth = (py - top) / (H - top);
      if (snowy) {
        x.fillStyle = R() < 0.5 ? 'rgba(160,180,200,0.18)' : 'rgba(255,255,255,0.6)';
        x.fillRect(px, py, 1 + depth * 1.5, 1);
      } else {
        const len = (2 + depth * 8) * S;
        x.strokeStyle = pick(['#6e9c40', '#5a8a32', '#86b356', '#4b7a2a', '#9cc25e']);
        x.lineWidth = 0.5 + depth;
        x.beginPath(); x.moveTo(px, py); x.lineTo(px + (R() - 0.5) * len * 0.5, py - len); x.stroke();
      }
    }

    // worn earth around the shrine
    x.save();
    x.translate(LY.bx + 20 * LY.fs, LY.groundY + 4);
    x.scale(1, 0.24);
    const eg = x.createRadialGradient(0, 0, 10, 0, 0, 280 * LY.fs);
    eg.addColorStop(0, snowy ? 'rgba(205,215,225,0.6)' : 'rgba(156,134,96,0.7)');
    eg.addColorStop(0.6, snowy ? 'rgba(205,215,225,0.3)' : 'rgba(156,134,96,0.35)');
    eg.addColorStop(1, 'rgba(156,134,96,0)');
    x.fillStyle = eg;
    x.fillRect(-300 * LY.fs, -300 * LY.fs, 600 * LY.fs, 600 * LY.fs);
    x.restore();

    // soft shadow of the crown on the ground
    x.save();
    x.translate(LY.tx + LY.spread * 0.1, LY.groundY + 6 * LY.ts);
    x.scale(1, 0.12);
    const cg = x.createRadialGradient(0, 0, 0, 0, 0, LY.spread * 1.15);
    cg.addColorStop(0, snowy ? 'rgba(90,110,140,0.32)' : 'rgba(20,35,10,0.38)');
    cg.addColorStop(0.7, snowy ? 'rgba(90,110,140,0.16)' : 'rgba(20,35,10,0.18)');
    cg.addColorStop(1, 'rgba(20,35,10,0)');
    x.fillStyle = cg;
    x.fillRect(-LY.spread * 1.2, -LY.spread * 1.2, LY.spread * 2.4, LY.spread * 2.4);
    x.restore();

    drawTrunk(x, seeded(seed + 3), snowy);
    drawShrine(x, snowy);
    return { far, near };
  }

  function leafShape(x, px, py, s, ang, col) {
    x.save();
    x.translate(px, py);
    x.rotate(ang);
    x.beginPath();
    x.moveTo(0, 0);
    x.bezierCurveTo(s * 0.15, -s * 0.2, s * 0.7, -s * 0.15, s * 0.55, s * 0.35);
    x.bezierCurveTo(s * 0.45, s * 0.6, s * 0.15, s * 0.8, 0, s * 1.3);
    x.bezierCurveTo(-s * 0.15, s * 0.8, -s * 0.45, s * 0.6, -s * 0.55, s * 0.35);
    x.bezierCurveTo(-s * 0.7, -s * 0.15, -s * 0.15, -s * 0.2, 0, 0);
    x.fillStyle = col;
    x.fill();
    x.restore();
  }

  function buildLand() {
    const g = renderGround(false), s = renderGround(true);
    land = { farG: g.far, nearG: g.near, farS: s.far, nearS: s.near };
    canopy = { G: renderCanopy(false), S: renderCanopy(true) };
  }

  /* ---------- Lotus pond ---------- */
  function setupPond() {
    const p = LY.pond, ts = LY.ts;
    pondLayer = layer(p.rx * 2 + 60, p.ry * 2 + 60);
    pondStones = [];
    const n = Math.round(p.rx / 7);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rand(-0.05, 0.05);
      pondStones.push({ x: p.cx + Math.cos(a) * p.rx * 1.01, y: p.cy + Math.sin(a) * p.ry * 1.05, r: rand(6, 12) * ts * (0.7 + 0.3 * (Math.sin(a) + 1)), sh: rand(-0.1, 0.1) });
    }
    pondStones.sort((a, b) => a.y - b.y);
    pads = []; lotuses = [];
    for (let i = 0; i < 10; i++) {
      const a = rand(0, TAU), d = Math.sqrt(Math.random()) * 0.78;
      const pad = { x: p.cx + Math.cos(a) * p.rx * d, y: p.cy + Math.sin(a) * p.ry * d, r: rand(9, 18) * ts, notch: rand(0, TAU), ph: rand(0, TAU) };
      pads.push(pad);
      if (i < 4) lotuses.push({ pad, s: rand(0.85, 1.2) * ts, col: pick(['#f4a9c6', '#ee8fb4', '#f7c6d8']) });
    }
    pads.sort((a, b) => a.y - b.y);
    ripples = [];
  }
  function inPond(x, y) {
    const p = LY.pond;
    return ((x - p.cx) / p.rx) ** 2 + ((y - p.cy) / p.ry) ** 2 < 1;
  }

  function drawPond(t, k, L) {
    const p = LY.pond, P = pondLayer.x, ts = LY.ts;
    const ox = p.cx - p.rx - 30, oy = p.cy - p.ry - 30, bw = p.rx * 2 + 60, bh = p.ry * 2 + 60;
    P.setTransform(dpr, 0, 0, dpr, -ox * dpr, -oy * dpr);
    P.globalCompositeOperation = 'source-over';
    P.clearRect(ox, oy, bw, bh);

    // ripples from rain, and the odd fish when it's calm
    const wet = clamp(cur.rain + cur.drizzle * 0.5, 0, 1) * (1 - cur.cover);
    if (Math.random() < (wet * 1.6 + 0.004) * k) {
      const a = rand(0, TAU), d = Math.sqrt(Math.random()) * 0.92;
      ripples.push({ x: p.cx + Math.cos(a) * p.rx * d, y: p.cy + Math.sin(a) * p.ry * d, life: 1, max: rand(8, wet > 0 ? 16 : 26) * ts });
    }

    P.save();
    P.beginPath(); P.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, TAU); P.clip();
    const [c0, c1, c2] = skyColors();
    const g = P.createLinearGradient(0, p.cy - p.ry, 0, p.cy + p.ry);
    g.addColorStop(0, rgb(lerp3(c2, [25, 45, 55], 0.4)));
    g.addColorStop(1, rgb(lerp3(c1, [10, 25, 35], 0.5)));
    P.fillStyle = g;
    P.fillRect(ox, oy, bw, bh);
    P.strokeStyle = 'rgba(255,255,255,0.13)'; P.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const yy = p.cy - p.ry * 0.75 + i * (p.ry * 1.5 / 8);
      const xx = p.cx + Math.sin(t * 0.6 + i * 1.7) * p.rx * 0.25;
      const half = p.rx * 0.25 * Math.sqrt(Math.max(0, 1 - ((yy - p.cy) / p.ry) ** 2));
      P.beginPath(); P.moveTo(xx - half, yy); P.lineTo(xx + half, yy); P.stroke();
    }
    P.lineWidth = 0.9;
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= 0.022 * k;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      const rr = (1 - r.life) * r.max;
      P.strokeStyle = `rgba(230,240,250,${0.5 * r.life})`;
      P.beginPath(); P.ellipse(r.x, r.y, rr, rr * 0.32, 0, 0, TAU); P.stroke();
      if (rr > 5) { P.beginPath(); P.ellipse(r.x, r.y, rr * 0.55, rr * 0.18, 0, 0, TAU); P.stroke(); }
    }
    if (cur.cover > 0.01) {
      P.fillStyle = `rgba(200,218,232,${0.9 * cur.cover})`;
      P.fillRect(ox, oy, bw, bh);
      P.strokeStyle = `rgba(160,180,200,${0.5 * cur.cover})`; P.lineWidth = 0.7;
      for (let i = 0; i < 6; i++) {
        const sx = p.cx + Math.cos(i * 1.1) * p.rx * 0.5, sy = p.cy + Math.sin(i * 2.3) * p.ry * 0.5;
        P.beginPath(); P.moveTo(sx, sy); P.lineTo(sx + 30 * Math.cos(i * 2), sy + 6 * Math.sin(i * 3)); P.lineTo(sx + 48 * Math.cos(i * 2 + 0.4), sy + 9 * Math.sin(i * 3 + 0.4)); P.stroke();
      }
    }
    P.restore();

    // lily pads and lotus flowers (hidden under ice)
    const padA = 1 - cur.cover;
    if (padA > 0.02) {
      P.globalAlpha = padA;
      for (const pd of pads) {
        const bob = Math.sin(t * 0.9 + pd.ph) * 0.6;
        P.save();
        P.translate(pd.x, pd.y + bob);
        P.scale(1, 0.38);
        const pg = P.createRadialGradient(-pd.r * 0.3, -pd.r * 0.3, 1, 0, 0, pd.r);
        pg.addColorStop(0, '#6aa848'); pg.addColorStop(1, '#2f6a2c');
        P.fillStyle = pg;
        P.beginPath(); P.moveTo(0, 0); P.arc(0, 0, pd.r, pd.notch + 0.22, pd.notch + TAU - 0.22); P.closePath(); P.fill();
        P.strokeStyle = 'rgba(20,50,20,0.35)'; P.lineWidth = 1;
        P.stroke();
        P.restore();
      }
      for (const l of lotuses) {
        const bob = Math.sin(t * 0.9 + l.pad.ph) * 0.6;
        const fx = l.pad.x + l.pad.r * 0.15, fy = l.pad.y + bob - 2 * l.s;
        for (let k2 = 0; k2 < 7; k2++) {
          const a = -Math.PI / 2 + (k2 - 3) * 0.38;
          const len = (k2 === 3 ? 12 : 10.5 - Math.abs(k2 - 3) * 0.8) * l.s;
          P.save();
          P.translate(fx, fy);
          P.rotate(a + Math.PI / 2);
          const lg = P.createLinearGradient(0, 0, 0, -len);
          lg.addColorStop(0, shade(l.col, -0.2)); lg.addColorStop(1, '#fff1f6');
          P.fillStyle = lg;
          P.beginPath(); P.moveTo(0, 0); P.quadraticCurveTo(3.4 * l.s, -len * 0.5, 0, -len); P.quadraticCurveTo(-3.4 * l.s, -len * 0.5, 0, 0); P.fill();
          P.strokeStyle = 'rgba(160,60,100,0.3)'; P.lineWidth = 0.5; P.stroke();
          P.restore();
        }
        P.fillStyle = '#f2c94c';
        P.beginPath(); P.ellipse(fx, fy - 2 * l.s, 2.4 * l.s, 1.3 * l.s, 0, 0, TAU); P.fill();
      }
      P.globalAlpha = 1;
    }

    // rim stones
    for (const s of pondStones) {
      const sg = P.createLinearGradient(s.x - s.r, s.y - s.r * 0.6, s.x + s.r, s.y + s.r * 0.6);
      sg.addColorStop(0, '#a9a397'); sg.addColorStop(1, '#5f5a50');
      P.fillStyle = sg;
      P.beginPath(); P.ellipse(s.x, s.y, s.r, s.r * 0.55, s.sh, 0, TAU); P.fill();
      if (cur.cover > 0.02) {
        P.fillStyle = `rgba(248,251,255,${0.95 * cur.cover})`;
        P.beginPath(); P.ellipse(s.x, s.y - s.r * 0.25, s.r * 0.85, s.r * 0.3, s.sh, 0, TAU); P.fill();
      }
    }

    // same light as the rest of the scene
    const tint = lerp3(hex('#1d252d'), hex('#040a1c'), cur.night);
    P.globalCompositeOperation = 'source-atop';
    P.fillStyle = rgb(tint, clamp(1 - L, 0, 0.9));
    P.fillRect(ox, oy, bw, bh);
    P.globalCompositeOperation = 'source-over';
    ctx.drawImage(pondLayer.c, ox, oy, bw, bh);

    // moon or sun glint on the water
    const glintA = (cur.night ? cur.night : (1 - cur.night)) * (1 - clamp(cur.cloud, 0, 1) * 0.8) * (1 - cur.cover);
    if (glintA > 0.05) {
      const gx = p.cx - p.rx * 0.35 + Math.sin(t * 0.5) * 3, gy = p.cy - p.ry * 0.2;
      const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 26 * ts);
      gg.addColorStop(0, `rgba(255,250,230,${0.4 * glintA})`); gg.addColorStop(1, 'rgba(255,250,230,0)');
      ctx.save(); ctx.translate(gx, gy); ctx.scale(1, 0.3); ctx.translate(-gx, -gy);
      ctx.fillStyle = gg; ctx.fillRect(gx - 30 * ts, gy - 30 * ts, 60 * ts, 60 * ts);
      ctx.restore();
    }
  }

  /* ---------- Sprites: moon, clouds, fog ---------- */
  function renderMoon() {
    const R = 120, c = document.createElement('canvas');
    c.width = c.height = R * 2 + 4;
    const x = c.getContext('2d');
    x.translate(R + 2, R + 2);
    x.beginPath(); x.arc(0, 0, R, 0, TAU); x.clip();
    const g = x.createRadialGradient(-R * 0.25, -R * 0.25, R * 0.1, 0, 0, R);
    g.addColorStop(0, '#fbf9ef'); g.addColorStop(0.7, '#e9e5d6'); g.addColorStop(1, '#bdb8a6');
    x.fillStyle = g; x.fillRect(-R, -R, R * 2, R * 2);
    x.filter = 'blur(6px)';
    for (const [mx, my, mr, a] of [[-30, -35, 38, 0.32], [20, -45, 26, 0.28], [35, 5, 32, 0.3], [-15, 20, 30, 0.25], [-55, 15, 20, 0.22], [10, 55, 22, 0.2]]) {
      x.fillStyle = `rgba(110,108,98,${a})`;
      x.beginPath(); x.arc(mx, my, mr, 0, TAU); x.fill();
    }
    x.filter = 'none';
    for (let i = 0; i < 40; i++) {
      x.strokeStyle = 'rgba(90,88,80,0.18)'; x.lineWidth = 1;
      x.beginPath(); x.arc(rand(-R, R), rand(-R, R), rand(2, 7), 0, TAU); x.stroke();
    }
    return c;
  }

  function renderCloud(seedN, dark) {
    const R = seeded(seedN);
    const cw = 420, ch = 200;
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const x = c.getContext('2d');
    const puffs = [];
    const n = 22 + Math.floor(R() * 12);
    for (let k = 0; k < n; k++) {
      const u = R() * 2 - 1;
      const px = cw / 2 + u * cw * 0.36;
      const r = (26 + R() * 34) * (1 - Math.abs(u) * 0.55);
      puffs.push([px, ch * 0.62 - R() * r * 0.9, r]);
    }
    x.filter = 'blur(4px)';
    x.fillStyle = dark ? '#4b535e' : '#ffffff';
    for (const [px, py, r] of puffs) { x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill(); }
    x.fillRect(cw * 0.2, ch * 0.55, cw * 0.6, ch * 0.08);
    x.filter = 'none';
    x.globalCompositeOperation = 'source-atop';
    const g = x.createLinearGradient(0, ch * 0.15, 0, ch * 0.75);
    if (dark) {
      g.addColorStop(0, 'rgba(140,150,162,0.6)'); g.addColorStop(0.5, 'rgba(90,98,110,0)'); g.addColorStop(1, 'rgba(25,30,38,0.55)');
    } else {
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.55, 'rgba(225,230,238,0.2)'); g.addColorStop(1, 'rgba(150,162,180,0.65)');
    }
    x.fillStyle = g;
    x.fillRect(0, 0, cw, ch);
    return c;
  }

  function renderFog(col) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 200;
    const x = c.getContext('2d');
    x.translate(256, 100);
    x.scale(2.4, 1);
    const g = x.createRadialGradient(0, 0, 0, 0, 0, 100);
    g.addColorStop(0, col + 'cc'); g.addColorStop(0.6, col + '55'); g.addColorStop(1, col + '00');
    x.fillStyle = g;
    x.beginPath(); x.arc(0, 0, 100, 0, TAU); x.fill();
    return c;
  }

  /* =========================================================
     Moving things
     ========================================================= */
  let clouds = [], stars = [], drops = [], splashes = [], flakes = [], leaves = [], fogBlobs = [], blades = [], smoke = [];
  const lightning = { timer: 2, flash: 0, bolt: null, second: 0 };

  function setupMovers() {
    clouds = [];
    const N = 16;
    const order = Array.from({ length: N }, (_, i) => i / N).sort(() => Math.random() - 0.5);
    for (let i = 0; i < N; i++) {
      clouds.push({ x: rand(-200, W + 200), y: rand(0.03, 0.4) * H, depth: rand(0.3, 1), sc: rand(0.7, 1.5), idx: i % cloudSprites.length, th: order[i] });
    }
    clouds.sort((a, b) => a.depth - b.depth);
    stars = [];
    for (let i = 0; i < Math.round(W * H / 5000); i++) stars.push({ x: rand(0, W), y: rand(0, H * 0.55), r: rand(0.5, 1.5), ph: rand(0, 6), sp: rand(0.8, 2.5) });
    drops = [];
    const maxDrops = Math.min(1100, Math.round(W * H / 900));
    for (let i = 0; i < maxDrops; i++) drops.push(newDrop(true));
    splashes = [];
    flakes = [];
    const maxFlakes = Math.min(700, Math.round(W * H / 1500));
    for (let i = 0; i < maxFlakes; i++) flakes.push({ x: rand(0, W), y: rand(-H, H), z: Math.pow(Math.random(), 1.4), ph: rand(0, TAU) });
    leaves = [];
    for (let i = 0; i < 34; i++) leaves.push(newLeaf(true));
    fogBlobs = [];
    for (let i = 0; i < 12; i++) fogBlobs.push({ x: rand(-300, W), y: rand(0.48, 1.0) * H, sc: rand(0.8, 1.8) * S, v: rand(0.1, 0.35), front: i % 3 === 0 });
    blades = [];
    for (let px = 0; px < W; px += rand(2.5, 6)) blades.push({ x: px, h: rand(14, 46) * S, w: rand(1.4, 3) * S, lean: rand(-0.35, 0.35), ph: rand(0, TAU), c: Math.floor(Math.random() * 3) });
    smoke = [];
  }

  function newDrop(initial) {
    const z = rand(0.35, 1);
    return { x: rand(-W * 0.2, W * 1.1), y: initial ? rand(-H, H) : rand(-120, -10), z, land: H * 0.74 + z * H * 0.26 };
  }
  function newLeaf(initial) {
    const top = LY.pivotY * 0.15, bottom = LY.pivotY * 0.95;
    const sy = rand(top, bottom);
    const floor = rand(H * 0.8, H * 0.99);
    return {
      x: LY.tx + (Math.random() - 0.5) * LY.spread * 2, y: initial ? rand(sy, floor) : sy, floor,
      z: rand(0.7, 1.3), vy: rand(0.45, 1.1), rot: rand(0, TAU), vr: rand(-0.06, 0.06), ph: rand(0, TAU),
      col: pick(['#6f9a3a', '#86a83c', '#c9a63a', '#a8b84a', '#5d8a34'])
    };
  }

  /* =========================================================
     Resize
     ========================================================= */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = clamp(W / 1200, 0.6, 1.1);
    LY = computeLayout();
    if (!moonSprite) moonSprite = renderMoon();
    if (!cloudSprites) {
      cloudSprites = [];
      for (let i = 0; i < 6; i++) cloudSprites.push({ light: renderCloud(101 + i * 17, false), dark: renderCloud(101 + i * 17, true) });
    }
    if (!fogSprites) fogSprites = { light: renderFog('#e4e9ed'), dark: renderFog('#2c3644') };
    scratch = layer();
    buildLand();
    buildStatue();
    setupPond();
    setupMovers();
  }

  /* =========================================================
     Drawing
     ========================================================= */
  const SKY = {
    dayClear:   [hex('#2f7fd6'), hex('#78b5ea'), hex('#d4ebf6')],
    dayOver:    [hex('#7d8894'), hex('#9ea8b1'), hex('#c6cbcf')],
    storm:      [hex('#2b3138'), hex('#3d454e'), hex('#5a636b')],
    nightClear: [hex('#02050f'), hex('#0a1634'), hex('#1e3156')],
    nightOver:  [hex('#0a0d13'), hex('#141a23'), hex('#222a35')]
  };
  function skyColors() {
    const ce = clamp(Math.max(cur.cloud, cur.fog * 0.85), 0, 1);
    const out = [];
    for (let i = 0; i < 3; i++) {
      let day = lerp3(SKY.dayClear[i], SKY.dayOver[i], ce);
      day = lerp3(day, SKY.storm[i], clamp(cur.storm * 0.85 + cur.rain * 0.3, 0, 1));
      let nt = lerp3(SKY.nightClear[i], SKY.nightOver[i], ce);
      nt = lerp3(nt, [6, 8, 12], cur.storm * 0.5);
      out.push(lerp3(day, nt, cur.night));
    }
    return out;
  }
  function sunMoonPos() { return W < 700 ? { x: 58, y: Math.max(80, H * 0.11) } : { x: Math.max(90, W * 0.12), y: Math.max(90, H * 0.15) }; }

  function drawSky(t) {
    const [c0, c1, c2] = skyColors();
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
    g.addColorStop(0, rgb(c0)); g.addColorStop(0.55, rgb(c1)); g.addColorStop(1, rgb(c2));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const ce = clamp(Math.max(cur.cloud, cur.fog), 0, 1);
    const starA = cur.night * Math.pow(1 - ce, 2);
    if (starA > 0.01) {
      for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,240,${starA * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)))})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
      }
    }
    const p = sunMoonPos();
    const veil = clamp(ce * 0.9 + cur.storm * 0.1, 0, 1);
    const sunA = (1 - cur.night) * (1 - veil * 0.92);
    if (sunA > 0.01) {
      const sy = p.y + cur.night * H * 0.4;
      const bloom = ctx.createRadialGradient(p.x, sy, 0, p.x, sy, 240 * S);
      bloom.addColorStop(0, `rgba(255,252,235,${0.85 * sunA})`);
      bloom.addColorStop(0.18, `rgba(255,244,205,${0.4 * sunA})`);
      bloom.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = bloom;
      ctx.fillRect(p.x - 250 * S, sy - 250 * S, 500 * S, 500 * S);
      ctx.fillStyle = `rgba(255,255,246,${sunA})`;
      ctx.beginPath(); ctx.arc(p.x, sy, 30 * S, 0, TAU); ctx.fill();
    }
    if ((1 - cur.night) * veil > 0.05 && cur.storm < 0.6) {
      const a = (1 - cur.night) * veil * (1 - cur.storm) * 0.35;
      const gl = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 200 * S);
      gl.addColorStop(0, `rgba(255,255,250,${a})`); gl.addColorStop(1, 'rgba(255,255,250,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(p.x - 210 * S, p.y - 210 * S, 420 * S, 420 * S);
    }
    const moonA = cur.night * (1 - veil * 0.85);
    if (moonA > 0.01) {
      const my = p.y - (1 - cur.night) * (p.y + 80);
      const glow = ctx.createRadialGradient(p.x, my, 0, p.x, my, 180 * S);
      glow.addColorStop(0, `rgba(210,220,255,${0.3 * moonA})`);
      glow.addColorStop(1, 'rgba(210,220,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(p.x - 190 * S, my - 190 * S, 380 * S, 380 * S);
      const R = 32 * S;
      ctx.globalAlpha = moonA;
      ctx.drawImage(moonSprite, p.x - R, my - R, R * 2, R * 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawClouds(k) {
    const ce = clamp(Math.max(cur.cloud, cur.fog * 0.6), 0, 1);
    const darkness = clamp(0.15 * cur.cloud + 0.85 * cur.storm + 0.15 * cur.rain + 0.15 * cur.snow, 0, 1);
    const nightDim = 1 - cur.night * 0.45;
    const blanket = clamp((ce - 0.6) * 2.5, 0, 1);
    if (blanket > 0) {
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
      const top = lerp3(lerp3(hex('#aab3bb'), hex('#3b434c'), cur.storm), hex('#161b22'), cur.night);
      g.addColorStop(0, rgb(top, 0.85 * blanket)); g.addColorStop(1, rgb(top, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H * 0.5);
    }
    const speed = (0.06 + cur.wind * 1.8) * k;
    for (const c of clouds) {
      c.x += speed * (0.35 + c.depth * 0.9);
      const sp = cloudSprites[c.idx];
      const w = 420 * c.sc * S * (1 + cur.storm * 0.4), h = 200 * c.sc * S * (1 + cur.storm * 0.4);
      if (c.x - w / 2 > W + 40) { c.x = -w / 2 - rand(20, 200); c.y = rand(0.03, 0.4) * H; }
      const vis = clamp((ce * 1.15 - c.th) * 5, 0, 1);
      if (vis <= 0.01) continue;
      const a = vis * (0.6 + 0.4 * c.depth) * nightDim * (1 - cur.fog * 0.65);
      const y = c.y + cur.storm * 20 * S;
      const dk = Math.max(darkness, cur.night * 0.9);
      ctx.globalAlpha = a * (1 - dk);
      ctx.drawImage(sp.light, c.x - w / 2, y - h / 2, w, h);
      ctx.globalAlpha = a * dk;
      ctx.drawImage(sp.dark, c.x - w / 2, y - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
  }

  function lightLevel() {
    const day = 1 - 0.3 * Math.max(cur.cloud, cur.fog * 0.6) - 0.36 * cur.storm - 0.2 * cur.rain - 0.08 * cur.drizzle - 0.06 * cur.snow;
    return clamp((1 - cur.night) * day + cur.night * (0.16 + cur.cover * 0.12), 0.08, 1);
  }

  function drawLand(t) {
    const X = scratch.x;
    X.globalCompositeOperation = 'source-over';
    X.clearRect(0, 0, W, H);
    const cv = cur.cover;
    if (cv < 1) X.drawImage(land.farG.c, 0, 0, W, H);
    if (cv > 0) { X.globalAlpha = cv; X.drawImage(land.farS.c, 0, 0, W, H); X.globalAlpha = 1; }
    const fogCol = lerp3(lerp3(hex('#dde3e8'), hex('#8b939b'), cur.storm * 0.6), hex('#273140'), cur.night);
    const farFog = clamp(cur.fog * 0.75 + cur.rain * 0.25 + cur.snow * 0.3 + cur.drizzle * 0.2, 0, 0.85);
    if (farFog > 0.01) {
      X.globalCompositeOperation = 'source-atop';
      X.fillStyle = rgb(fogCol, farFog);
      X.fillRect(0, 0, W, H);
      X.globalCompositeOperation = 'source-over';
    }
    if (cv < 1) X.drawImage(land.nearG.c, 0, 0, W, H);
    if (cv > 0) { X.globalAlpha = cv; X.drawImage(land.nearS.c, 0, 0, W, H); X.globalAlpha = 1; }
    if (statue) {
      const u = LY.fs, sx = LY.bx + SBOX.x0 * u, sy = LY.seatY + SBOX.y0 * u, sw = SBOX.w * u, sh = SBOX.h * u;
      if (cv < 1) X.drawImage(statue.day, sx, sy, sw, sh);
      if (cv > 0) { X.globalAlpha = cv; X.drawImage(statue.daySnow, sx, sy, sw, sh); X.globalAlpha = 1; }
    }
    if (photo) {
      const r = photoRect(), u = LY.fs;
      const cs = X.createRadialGradient(LY.bx, LY.seatY + 1.5 * u, 0, LY.bx, LY.seatY + 1.5 * u, 52 * u);
      cs.addColorStop(0, 'rgba(0,0,0,0.45)'); cs.addColorStop(1, 'rgba(0,0,0,0)');
      X.save(); X.translate(0, LY.seatY + 1.5 * u); X.scale(1, 0.09); X.translate(0, -(LY.seatY + 1.5 * u));
      X.fillStyle = cs; X.fillRect(LY.bx - 56 * u, LY.seatY + 1.5 * u - 56 * u, 112 * u, 112 * u);
      X.restore();
      if (cv < 1) X.drawImage(photo.day, r.x, r.y, r.w, r.h);
      if (cv > 0) { X.globalAlpha = cv; X.drawImage(photo.snow, r.x, r.y, r.w, r.h); X.globalAlpha = 1; }
    }

    // Bodhi canopy sways around the top of the trunk
    const { tx, pivotY } = LY;
    for (let i = 0; i < 3; i++) {
      const gustSway = reduceMotion ? 0 : Math.sin(t * (0.7 + cur.wind * 1.5) + i * 1.7) * (0.003 + cur.wind * 0.012);
      const sway = (cur.wind * 0.02 + gustSway) * (0.8 + i * 0.25);
      X.save();
      X.translate(tx, pivotY); X.rotate(sway); X.translate(-tx, -pivotY);
      const G = canopy.G, Sn = canopy.S;
      if (cv < 1) X.drawImage(G.L[i].c, G.x0, G.y0, G.w, G.h);
      if (cv > 0) { X.globalAlpha = cv; X.drawImage(Sn.L[i].c, Sn.x0, Sn.y0, Sn.w, Sn.h); X.globalAlpha = 1; }
      X.restore();
    }

    const L = lightLevel();
    const tint = lerp3(hex('#1d252d'), hex('#040a1c'), cur.night);
    X.globalCompositeOperation = 'source-atop';
    X.fillStyle = rgb(tint, clamp(1 - L, 0, 0.9));
    X.fillRect(0, 0, W, H);
    if (cur.night > 0.05) {
      X.fillStyle = `rgba(60,80,140,${0.06 * cur.night})`;
      X.fillRect(0, 0, W, H);
    }
    const wet = clamp(cur.rain + cur.drizzle * 0.5, 0, 1);
    if (wet > 0.05) {
      X.fillStyle = `rgba(10,20,30,${0.12 * wet})`;
      X.fillRect(0, H * 0.7, W, H * 0.3);
    }
    X.globalCompositeOperation = 'source-over';
    ctx.drawImage(scratch.c, 0, 0, W, H);
    return L;
  }

  // oil lamps, soft halo and warm light on the statue after dark
  function drawShrineLights(t, L) {
    const { fs: u, bx, seatY, head } = LY;
    const glow = clamp((0.62 - L) * 2, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (glow > 0.01 && statue && statue.lamp) {
      const sx = bx + SBOX.x0 * u, sy = seatY + SBOX.y0 * u, sw = SBOX.w * u, sh = SBOX.h * u;
      ctx.globalAlpha = glow * (1 - cur.cover);
      ctx.drawImage(statue.lamp, sx, sy, sw, sh);
      ctx.globalAlpha = glow * cur.cover;
      ctx.drawImage(statue.lampSnow, sx, sy, sw, sh);
      ctx.globalAlpha = 1;
      if (photo) {
        const r = photoRect();
        ctx.globalAlpha = glow * 0.42;
        ctx.drawImage(photo.lamp, r.x, r.y, r.w, r.h);
        ctx.globalAlpha = 1;
      }
    } else if (glow > 0.01) {
      const wg = ctx.createRadialGradient(bx, seatY - 40 * u, 0, bx, seatY - 40 * u, 120 * u);
      wg.addColorStop(0, `rgba(255,175,90,${0.3 * glow})`);
      wg.addColorStop(1, 'rgba(255,175,90,0)');
      ctx.fillStyle = wg;
      ctx.fillRect(bx - 150 * u, seatY - 180 * u, 300 * u, 300 * u);
    }
    LY.lamps.forEach((l, i) => {
      const fx = l.x + 8.5 * u, fy = l.y - 5.5 * u;
      const fl = reduceMotion ? 1 : 0.85 + 0.12 * Math.sin(t * 13 + i * 3) + 0.08 * Math.sin(t * 7.3 + i);
      const r = (8 + 18 * glow) * u * fl;
      const g = ctx.createRadialGradient(fx, fy - 3 * u, 0, fx, fy - 3 * u, r);
      g.addColorStop(0, `rgba(255,190,90,${0.3 + 0.35 * glow})`);
      g.addColorStop(1, 'rgba(255,170,70,0)');
      ctx.fillStyle = g;
      ctx.fillRect(fx - r, fy - 3 * u - r, r * 2, r * 2);
    });
    ctx.restore();
    LY.lamps.forEach((l, i) => {
      const fx = l.x + 8.5 * u, fy = l.y - 5.5 * u;
      const fl = reduceMotion ? 1 : 0.85 + 0.12 * Math.sin(t * 13 + i * 3) + 0.08 * Math.sin(t * 7.3 + i);
      const lean = cur.wind * 0.45 + (reduceMotion ? 0 : Math.sin(t * 5 + i) * 0.08);
      const fh = 8 * u * fl;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(lean);
      const g = ctx.createLinearGradient(0, 0, 0, -fh);
      g.addColorStop(0, '#ff9a2e'); g.addColorStop(0.5, '#ffd36a'); g.addColorStop(1, '#fff6d0');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -fh);
      ctx.bezierCurveTo(2.4 * u, -fh * 0.45, 2.2 * u, 0.6 * u, 0, 0.8 * u);
      ctx.bezierCurveTo(-2.2 * u, 0.6 * u, -2.4 * u, -fh * 0.45, 0, -fh);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,240,0.9)';
      ctx.beginPath(); ctx.ellipse(0, -fh * 0.3, 0.8 * u, 1.8 * u, 0, 0, TAU); ctx.fill();
      ctx.restore();
    });
  }

  function drawIncense(t, k, L) {
    const u = LY.fs;
    if (!reduceMotion && Math.random() < 0.9 * k) {
      const [sx, sy] = pick(LY.tips);
      smoke.push({ x: sx, y: sy, r: 0.8 * u, life: 1, ph: rand(0, TAU) });
    }
    const col = lerp3(hex('#eef0f2'), hex('#8a93a3'), clamp(1 - L, 0, 1));
    for (let i = smoke.length - 1; i >= 0; i--) {
      const s = smoke[i];
      s.life -= 0.0065 * k;
      if (s.life <= 0 || smoke.length > 400) { smoke.splice(i, 1); continue; }
      const age = 1 - s.life;
      s.x += (cur.wind * 1.6 * age + Math.sin(t * 1.6 + s.ph + age * 6) * 0.25 * age) * k;
      s.y -= (0.45 - cur.wind * 0.2) * u * 0.5 * k;
      s.r += 0.035 * u * k;
      ctx.fillStyle = rgb(col, 0.16 * s.life * Math.min(1, age * 6));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,90,40,0.9)';
    for (const [sx, sy] of LY.tips) { ctx.beginPath(); ctx.arc(sx, sy, 0.9 * u, 0, TAU); ctx.fill(); }
  }

  const BLADE_COLS = ['#4f8a2e', '#5f9a38', '#3f7a26'];
  function drawGrass(t, L) {
    const a = 1 - cur.cover * 0.85;
    if (a <= 0.02) return;
    const tint = lerp3(hex('#1d252d'), hex('#040a1c'), cur.night);
    const cols = BLADE_COLS.map(c => rgb(lerp3(hex(c), tint, clamp(1 - L, 0, 0.9)), a));
    const gust = cur.wind * (0.7 + 0.3 * Math.sin(t * 1.7));
    for (const b of blades) {
      const sway = Math.sin(t * (1.2 + cur.wind * 2) + b.ph + b.x * 0.01) * (0.08 + cur.wind * 0.12);
      const lean = b.lean + sway + gust * 0.9;
      const tx = b.x + lean * b.h, ty = H + 4 - b.h * (1 - Math.abs(lean) * 0.25);
      ctx.fillStyle = cols[b.c];
      ctx.beginPath();
      ctx.moveTo(b.x - b.w / 2, H + 4);
      ctx.quadraticCurveTo(b.x + lean * b.h * 0.3 - b.w * 0.3, H + 4 - b.h * 0.55, tx, ty);
      ctx.quadraticCurveTo(b.x + lean * b.h * 0.3 + b.w * 0.3, H + 4 - b.h * 0.55, b.x + b.w / 2, H + 4);
      ctx.fill();
    }
  }

  function drawFog(k) {
    const f = clamp(cur.fog, 0, 1);
    if (f < 0.01) return;
    const n = cur.night;
    for (const b of fogBlobs) {
      b.x += (b.v + cur.wind * 0.6) * k;
      const w = 512 * b.sc * 1.6, h = 200 * b.sc * 1.4;
      if (b.x > W + 50) b.x = -w - rand(0, 200);
      const a = f * (b.front ? 0.5 : 0.38);
      ctx.globalAlpha = a * (1 - n);
      ctx.drawImage(fogSprites.light, b.x, b.y - h / 2, w, h);
      ctx.globalAlpha = a * n;
      ctx.drawImage(fogSprites.dark, b.x, b.y - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
    const col = lerp3(hex('#dfe5ea'), hex('#222b38'), n);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(col, 0.2 * f));
    g.addColorStop(0.45, rgb(col, 0.32 * f));
    g.addColorStop(0.68, rgb(col, 0.5 * f));
    g.addColorStop(1, rgb(col, 0.3 * f));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawRain(k) {
    const heavy = cur.rain, light = cur.drizzle;
    const amount = clamp(heavy + light * 0.6, 0, 1);
    const active = Math.floor(drops.length * amount);
    if (active < 1 && !splashes.length) return;
    const drizzleMix = light / Math.max(0.001, heavy + light);
    const windX = (cur.wind * 7 + 0.6) * (1 + cur.storm * 0.5);
    const col = lerp3(hex('#cfdbe6'), hex('#8796a8'), cur.night);
    const alpha = (0.32 + heavy * 0.2) * (1 - cur.night * 0.35);
    ctx.strokeStyle = rgb(col, alpha);
    ctx.lineWidth = 0.9 + heavy * 0.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < active; i++) {
      const d = drops[i];
      const vy = (12 + 12 * d.z) * (1 - drizzleMix * 0.45);
      const vx = windX * d.z;
      d.x += vx * k; d.y += vy * k;
      if (d.y > d.land) {
        if (splashes.length < 260 && Math.random() < 0.6 && !inPond(d.x, d.land)) splashes.push({ x: d.x, y: d.land, z: d.z, life: 1 });
        Object.assign(d, newDrop(false));
        continue;
      }
      const len = (8 + 16 * d.z) * S * (1 - drizzleMix * 0.5);
      const m = len / Math.hypot(vx, vy);
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - vx * m, d.y - vy * m);
    }
    ctx.stroke();
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = rgb(col, 0.45 * (1 - cur.night * 0.4));
    ctx.beginPath();
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.life -= 0.09 * k;
      if (s.life <= 0) { splashes.splice(i, 1); continue; }
      const r = (1 - s.life) * 5 * s.z * S;
      ctx.moveTo(s.x + r, s.y);
      ctx.ellipse(s.x, s.y, r, r * 0.3, 0, 0, TAU);
    }
    ctx.stroke();
  }

  function drawSnow(t, k) {
    const active = Math.floor(flakes.length * clamp(cur.snow, 0, 1));
    if (active < 1) return;
    ctx.fillStyle = `rgba(255,255,255,${0.9 - cur.night * 0.3})`;
    ctx.beginPath();
    for (let i = 0; i < active; i++) {
      const f = flakes[i];
      f.y += (0.5 + 1.8 * f.z) * k;
      f.x += (cur.wind * 3.5 * (0.4 + f.z) + Math.sin(t * 1.2 + f.ph) * 0.5) * k;
      if (f.y > H + 6) { f.y = rand(-40, -5); f.x = rand(-W * 0.2, W); }
      if (f.x > W + 10) f.x = -10;
      const r = (0.7 + 2.8 * f.z) * S;
      ctx.moveTo(f.x + r, f.y);
      ctx.arc(f.x, f.y, r, 0, TAU);
    }
    ctx.fill();
  }

  // heart-shaped Bodhi leaves drifting down from the tree
  function drawLeaves(t, k, L) {
    const want = (0.12 + clamp((cur.wind - 0.25) * 1.4, 0, 1) * 0.88) * (1 - clamp(cur.rain * 1.2 + cur.snow, 0, 1));
    const active = Math.floor(leaves.length * want);
    if (active < 1) return;
    const tint = lerp3(hex('#1d252d'), hex('#040a1c'), cur.night);
    const ts = LY.ts;
    for (let i = 0; i < active; i++) {
      const l = leaves[i];
      l.x += (cur.wind * 4 * l.z + Math.sin(t * 1.5 + l.ph) * 0.8) * k;
      l.y += (l.vy + Math.cos(t * 2 + l.ph) * 0.3) * k;
      l.rot += (l.vr + Math.sin(t * 2.4 + l.ph) * 0.03) * k;
      if (l.y > l.floor || l.x > W + 30 || l.x < -30) Object.assign(l, newLeaf(false));
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.scale(Math.abs(Math.sin(t * 2.2 + l.ph)) * 0.8 + 0.2, 1);
      leafShape(ctx, 0, -4 * ts * l.z, 6 * ts * l.z, 0, rgb(lerp3(hex(l.col), tint, clamp(1 - L, 0, 0.85))));
      ctx.restore();
    }
  }

  function updateLightning(dt) {
    if (cur.storm > 0.4) {
      lightning.timer -= dt;
      if (lightning.timer <= 0) {
        lightning.flash = 1;
        lightning.second = Math.random() < 0.6 ? 0.12 : 0;
        lightning.timer = rand(2.5, 8) / cur.storm;
        if (Math.random() < 0.65) {
          const pts = [];
          let x = rand(W * 0.05, W * 0.45), y = H * rand(0.08, 0.2);
          const end = H * rand(0.5, 0.6);
          pts.push([x, y]);
          while (y < end) { y += rand(12, 30) * S; x += rand(-18, 18) * S; pts.push([x, y]); }
          const branch = [];
          const bi = Math.floor(pts.length * rand(0.3, 0.6));
          let [bx, by] = pts[bi];
          const dir = Math.random() < 0.5 ? -1 : 1;
          for (let j = 0; j < 5; j++) { bx += dir * rand(8, 20) * S; by += rand(10, 22) * S; branch.push([bx, by]); }
          lightning.bolt = { pts, branch: [pts[bi], ...branch], life: 1 };
        }
      }
    }
    if (lightning.second > 0) {
      lightning.second -= dt;
      if (lightning.second <= 0) lightning.flash = Math.max(lightning.flash, 0.8);
    }
    lightning.flash = Math.max(0, lightning.flash - dt * 3.2);
    if (lightning.bolt) { lightning.bolt.life -= dt * 3.5; if (lightning.bolt.life <= 0) lightning.bolt = null; }
  }

  function drawBolt() {
    const b = lightning.bolt;
    if (!b) return;
    const a = clamp(b.life, 0, 1);
    for (const [w, c] of [[8 * S, `rgba(170,190,255,${0.25 * a})`], [3 * S, `rgba(220,230,255,${0.6 * a})`], [1.2 * S, `rgba(255,255,255,${a})`]]) {
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round';
      for (const line of [b.pts, b.branch]) {
        ctx.beginPath();
        line.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        ctx.stroke();
      }
    }
  }

  /* =========================================================
     Main loop
     ========================================================= */
  let last = null, darkClass = null;
  function frame(now) {
    const dt = last == null ? 0.016 : Math.min(0.1, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    const k = reduceMotion ? 0 : dt * 60;

    const ease = Math.min(1, dt * 0.9);
    for (const key in cur) {
      if (tgt[key] === undefined) continue;
      const rate = key === 'cover' ? dt * 0.25 : ease;
      cur[key] += (tgt[key] - cur[key]) * Math.min(1, rate);
      if (Math.abs(tgt[key] - cur[key]) < 0.001) cur[key] = tgt[key];
    }

    if (!reduceMotion) updateLightning(dt);
    drawSky(t);
    drawClouds(k);
    drawBolt();
    const L = drawLand(t);
    drawPond(t, k, L);
    drawShrineLights(t, L);
    drawIncense(t, k, L);
    drawGrass(t, L);
    drawFog(k);
    drawLeaves(t, k, L);
    drawSnow(t, k);
    drawRain(k);

    if (lightning.flash > 0.01) {
      ctx.fillStyle = `rgba(225,232,255,${lightning.flash * 0.4})`;
      ctx.fillRect(0, 0, W, H);
    }
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${0.15 + 0.2 * (1 - L)})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    const dark = L < 0.5;
    if (dark !== darkClass) { document.body.classList.toggle('dark', dark); darkClass = dark; }
    requestAnimationFrame(frame);
  }

  /* =========================================================
     Weather data and controls
     ========================================================= */
  const $ = id => document.getElementById(id);
  const pill = $('wxPill'), panel = $('wxPanel'), input = $('cityInput'), results = $('results');
  const detailsEl = $('wxDetails'), statusEl = $('wxStatus'), previewSel = $('previewSel'), previewNight = $('previewNight');
  let place = null, live = null, preview = null;

  function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }

  async function getJSON(url) {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 10000);
    try {
      const r = await fetch(url, { signal: ac.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  }

  async function geocode(name, count = 5) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=${count}&language=en&format=json`;
    const j = await getJSON(url);
    return (j.results || []).map(r => ({
      name: r.name, region: [r.admin1, r.country].filter(Boolean).join(', '),
      lat: r.latitude, lon: r.longitude
    }));
  }

  function render() {
    let kind, label, night, temp = null;
    if (preview) {
      const d = describe(PRESETS[preview].code);
      kind = d.kind; label = d.label + ' (preview)'; night = previewNight.checked;
    } else if (live) {
      const d = describe(live.code);
      kind = d.kind; label = d.label; night = !live.isDay; temp = live.temp;
    } else {
      kind = 'clear'; label = ''; night = cur.night > 0.5;
    }
    if (preview === 'windy') label = 'Windy (preview)';
    $('wxIcon').innerHTML = iconSVG(kind, night);
    $('wxPlace').textContent = place ? place.name : 'Choose a place';
    $('wxTemp').textContent = temp == null ? '' : `${Math.round(temp)}°C`;
    pill.setAttribute('aria-label', `Weather: ${place ? place.name : 'no place'}${label ? ', ' + label : ''}${temp == null ? '' : ', ' + Math.round(temp) + ' degrees'}. Change location`);
    if (live && !preview) {
      const when = new Date(live.fetched).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      detailsEl.textContent = `${label} · Wind ${Math.round(live.wind)} km/h · Updated ${when}`;
    } else if (preview) {
      detailsEl.textContent = `Showing ${label.toLowerCase()}. Choose "Live weather" to go back.`;
    } else {
      detailsEl.textContent = '';
    }
  }

  function applyScene() {
    if (preview) {
      const p = PRESETS[preview];
      setTargets(sceneFor(p.code, !previewNight.checked, p.wind));
    } else if (live) {
      setTargets(sceneFor(live.code, live.isDay, live.wind));
    }
    render();
  }

  async function loadWeather() {
    if (!place) return;
    statusEl.textContent = 'Getting the weather…';
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}` +
        '&current=temperature_2m,weather_code,is_day,wind_speed_10m&timezone=auto';
      const j = await getJSON(url);
      const c = j.current;
      live = { code: c.weather_code, isDay: c.is_day === 1, temp: c.temperature_2m, wind: c.wind_speed_10m, fetched: Date.now() };
      statusEl.textContent = '';
    } catch (e) {
      statusEl.textContent = live ? 'Couldn’t refresh. Showing the last weather.' : 'Couldn’t get the weather right now. Showing a default scene.';
      if (!live && !preview) {
        const hr = new Date().getHours();
        setTargets(sceneFor(1, hr >= 6 && hr < 18, 8));
      }
    }
    applyScene();
  }

  function choosePlace(p) {
    place = p;
    store('wx-place', p);
    results.innerHTML = '';
    input.value = '';
    render();
    loadWeather();
  }

  // search box
  let searchTimer = null, lastQuery = '';
  input.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = input.value.trim();
    if (q.length < 2) { results.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      lastQuery = q;
      try {
        const list = await geocode(q);
        if (q !== lastQuery) return;
        results.innerHTML = '';
        if (!list.length) { results.innerHTML = '<li style="padding:6px 8px;opacity:.7">No places found</li>'; return; }
        for (const p of list) {
          const li = document.createElement('li');
          const b = document.createElement('button');
          b.type = 'button';
          b.innerHTML = '<span></span> <small></small>';
          b.firstChild.textContent = p.name;
          b.lastChild.textContent = p.region;
          b.addEventListener('click', () => choosePlace(p));
          li.appendChild(b);
          results.appendChild(li);
        }
      } catch (e) {
        results.innerHTML = '<li style="padding:6px 8px;opacity:.7">Search is unavailable right now</li>';
      }
    }, 300);
  });
  $('searchForm').addEventListener('submit', async e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    try {
      const list = await geocode(q, 1);
      if (list.length) choosePlace(list[0]);
      else statusEl.textContent = 'No places found.';
    } catch (err) { statusEl.textContent = 'Search is unavailable right now.'; }
  });

  // use my location
  $('locBtn').addEventListener('click', () => {
    if (!navigator.geolocation) { statusEl.textContent = 'This browser can’t share your location.'; return; }
    statusEl.textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(
      pos => choosePlace({ name: 'My location', region: '', lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3) }),
      () => { statusEl.textContent = 'Location permission was not given.'; },
      { timeout: 10000, maximumAge: 600000 }
    );
  });

  // open / close panel
  pill.addEventListener('click', () => {
    const open = panel.hidden;
    panel.hidden = !open;
    pill.setAttribute('aria-expanded', String(open));
    if (open) setTimeout(() => input.focus(), 0);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !panel.hidden) { panel.hidden = true; pill.setAttribute('aria-expanded', 'false'); pill.focus(); }
  });
  document.addEventListener('click', e => {
    if (!panel.hidden && !$('wx').contains(e.target)) { panel.hidden = true; pill.setAttribute('aria-expanded', 'false'); }
  });

  // preview controls
  previewSel.addEventListener('change', () => { preview = previewSel.value || null; applyScene(); });
  previewNight.addEventListener('change', () => { if (preview) applyScene(); });

  // a link like page.html#storm or page.html#snow,night opens straight into a preview
  function readHash() {
    const parts = location.hash.replace('#', '').toLowerCase().split(/[,&+ ]/).filter(Boolean);
    const p = parts.find(x => PRESETS[x]);
    if (p) {
      preview = p;
      previewSel.value = p;
      previewNight.checked = parts.includes('night');
      return true;
    }
    return false;
  }
  window.addEventListener('hashchange', () => { if (readHash()) applyScene(); });

  // Default place: Hyderabad, Telangana (used until a different place is chosen)
  const DEFAULT_PLACE = { name: 'Hyderabad', region: 'Telangana, India', lat: 17.385, lon: 78.4867 };

  async function defaultPlace() {
    const saved = load('wx-place');
    if (saved && typeof saved.lat === 'number') return saved;
    return DEFAULT_PLACE;
  }

  /* =========================================================
     Start
     ========================================================= */
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  const begin = () => {
    buildPhoto();
    resize();
    if (readHash()) applyScene();
    render();
    requestAnimationFrame(frame);
  };
  (statueImg.decode ? statueImg.decode() : Promise.resolve()).then(begin, begin);

  (async () => {
    place = await defaultPlace();
    render();
    await loadWeather();
  })();
  setInterval(loadWeather, 20 * 60 * 1000);   // refresh every 20 minutes
})();
</script>
</body>
</html>
