<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodhi Tree Weather</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #7fb3e3;
    overflow-x: hidden;
    color: #1f2d36;
    transition: color 1.5s ease;
  }
  body.dark { color: #eef3fa; background: #0b1222; }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  /* Your page content goes here, above the scene */
  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding: 14vh 16px 24px;
  }
  h1 {
    font-size: clamp(2.4rem, 7vw, 5rem);
    font-weight: normal;
    letter-spacing: 0.04em;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.85), 0 2px 18px rgba(255, 255, 255, 0.75);
    transition: text-shadow 1.5s ease;
  }
  p {
    margin-top: 12px;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    opacity: 0.9;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 1px 12px rgba(255, 255, 255, 0.8);
    transition: text-shadow 1.5s ease;
  }
  body.dark h1, body.dark p { text-shadow: 0 0 10px rgba(0, 0, 20, 0.8), 0 2px 18px rgba(0, 0, 20, 0.9); }

  /* ---------- Weather control ---------- */
  #wx {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1f2d36;
    transition: color 1.5s ease;
  }
  body.dark #wx { color: #eef3fa; }
  .glass {
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 1.5s ease, border-color 1.5s ease;
  }
  body.dark .glass {
    background: rgba(18, 26, 44, 0.6);
    border-color: rgba(200, 210, 255, 0.25);
  }
  #wxPill {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: calc(100vw - 32px);
    padding: 7px 14px 7px 10px;
    border-radius: 999px;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #wxPill:focus-visible, #wx input:focus-visible, #wx button:focus-visible, #wx select:focus-visible {
    outline: 2px solid #f5b800;
    outline-offset: 2px;
  }
  #wxIcon { width: 26px; height: 26px; flex: none; }
  #wxPlace { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  #wxTemp { font-weight: 600; }
  #wxPanel {
    margin-top: 8px;
    width: min(320px, calc(100vw - 32px));
    padding: 12px;
    border-radius: 14px;
  }
  #wxPanel[hidden] { display: none; }
  .row { display: flex; gap: 8px; }
  #cityInput {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(255, 255, 255, 0.85);
    color: #1f2d36;
    font: inherit;
  }
  body.dark #cityInput { background: rgba(10, 16, 30, 0.7); color: #eef3fa; border-color: rgba(255, 255, 255, 0.2); }
  .iconBtn {
    width: 38px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 8px;
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(255, 255, 255, 0.85);
    color: #1f2d36;
    cursor: pointer;
  }
  body.dark .iconBtn { background: rgba(10, 16, 30, 0.7); color: #eef3fa; border-color: rgba(255, 255, 255, 0.2); }
  .iconBtn svg { width: 18px; height: 18px; }
  #results { list-style: none; margin-top: 6px; }
  #results button {
    width: 100%;
    text-align: left;
    padding: 7px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #results button:hover { background: rgba(127, 127, 127, 0.18); }
  #results small { opacity: 0.7; }
  #wxDetails { margin-top: 10px; font-size: 13px; opacity: 0.85; }
  #wxStatus { margin-top: 4px; font-size: 12px; opacity: 0.75; min-height: 1em; }
  .preview {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(127, 127, 127, 0.3);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .preview select {
    flex: 1;
    min-width: 0;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(255, 255, 255, 0.85);
    color: #1f2d36;
    font: inherit;
  }
  body.dark .preview select { background: rgba(10, 16, 30, 0.7); color: #eef3fa; border-color: rgba(255, 255, 255, 0.2); }
  .preview label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="wx">
  <button id="wxPill" class="glass" type="button" aria-expanded="false" aria-controls="wxPanel">
    <span id="wxIcon" aria-hidden="true"></span>
    <span id="wxPlace">Loading…</span>
    <span id="wxTemp"></span>
  </button>
  <div id="wxPanel" class="glass" hidden>
    <form id="searchForm" class="row" autocomplete="off">
      <input id="cityInput" type="search" placeholder="Search a city" aria-label="Search a city">
      <button id="locBtn" class="iconBtn" type="button" title="Use my location" aria-label="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/>
        </svg>
      </button>
    </form>
    <ul id="results"></ul>
    <div id="wxDetails"></div>
    <div id="wxStatus" role="status"></div>
    <div class="preview">
      <span>Preview</span>
      <select id="previewSel" aria-label="Preview a weather scene">
        <option value="">Live weather</option>
        <option value="clear">Clear</option>
        <option value="partly">Partly cloudy</option>
        <option value="cloudy">Overcast</option>
        <option value="windy">Windy</option>
        <option value="fog">Fog</option>
        <option value="drizzle">Drizzle</option>
        <option value="rain">Rain</option>
        <option value="heavy">Heavy rain</option>
        <option value="storm">Thunderstorm</option>
        <option value="snow">Snow</option>
      </select>
      <label><input id="previewNight" type="checkbox"> Night</label>
    </div>
  </div>
</div>

<main>
  <h1>Welcome</h1>
  <p>Replace this with your own content.</p>
</main>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, S = 1;

  /* =========================================================
     Weather codes (WMO, as used by Open-Meteo)
     ========================================================= */
  function describe(code) {
    if (code === 0) return { label: 'Clear', kind: 'clear' };
    if (code === 1) return { label: 'Mainly clear', kind: 'clear' };
    if (code === 2) return { label: 'Partly cloudy', kind: 'partly' };
    if (code === 3) return { label: 'Overcast', kind: 'cloudy' };
    if (code === 45 || code === 48) return { label: 'Fog', kind: 'fog' };
    if (code >= 51 && code <= 57) return { label: code >= 56 ? 'Freezing drizzle' : 'Drizzle', kind: 'drizzle' };
    if (code >= 61 && code <= 67) return { label: code >= 66 ? 'Freezing rain' : code === 65 ? 'Heavy rain' : 'Rain', kind: 'rain' };
    if (code >= 71 && code <= 77) return { label: code === 77 ? 'Snow grains' : code === 75 ? 'Heavy snow' : 'Snow', kind: 'snow' };
    if (code >= 80 && code <= 82) return { label: code === 82 ? 'Violent showers' : 'Rain showers', kind: 'rain' };
    if (code === 85 || code === 86) return { label: 'Snow showers', kind: 'snow' };
    if (code >= 95) return { label: 'Thunderstorm', kind: 'storm' };
    return { label: 'Unknown', kind: 'cloudy' };
  }

  // Turn a weather report into scene targets (all 0..1)
  function sceneFor(code, isDay, windKmh) {
    const t = { cloud: 0.3, rain: 0, drizzle: 0, snow: 0, fog: 0, storm: 0, night: isDay ? 0 : 1, wind: clamp((windKmh - 8) / 42, 0, 1) };
    switch (true) {
      case code === 0: t.cloud = 0.04; break;
      case code === 1: t.cloud = 0.22; break;
      case code === 2: t.cloud = 0.5; break;
      case code === 3: t.cloud = 0.95; break;
      case code === 45 || code === 48: t.cloud = 0.75; t.fog = 1; break;
      case code >= 51 && code <= 57: t.cloud = 0.9; t.drizzle = code === 51 ? 0.5 : code === 55 || code === 57 ? 1 : 0.75; break;
      case code === 61: t.cloud = 0.9; t.rain = 0.45; break;
      case code === 63 || code === 66: t.cloud = 0.95; t.rain = 0.7; break;
      case code === 65 || code === 67: t.cloud = 1; t.rain = 1; break;
      case code === 71 || code === 77: t.cloud = 0.9; t.snow = 0.45; break;
      case code === 73: t.cloud = 0.95; t.snow = 0.7; break;
      case code === 75: t.cloud = 1; t.snow = 1; break;
      case code === 80: t.cloud = 0.8; t.rain = 0.55; break;
      case code === 81: t.cloud = 0.9; t.rain = 0.8; break;
      case code === 82: t.cloud = 1; t.rain = 1; break;
      case code === 85: t.cloud = 0.9; t.snow = 0.65; break;
      case code === 86: t.cloud = 1; t.snow = 0.95; break;
      case code >= 95: t.cloud = 1; t.storm = 1; t.rain = code === 95 ? 0.8 : 1; break;
    }
    return t;
  }

  const PRESETS = {
    clear:   { code: 0,  wind: 6 },
    partly:  { code: 2,  wind: 12 },
    cloudy:  { code: 3,  wind: 14 },
    windy:   { code: 1,  wind: 55 },
    fog:     { code: 45, wind: 3 },
    drizzle: { code: 53, wind: 10 },
    rain:    { code: 63, wind: 18 },
    heavy:   { code: 65, wind: 30 },
    storm:   { code: 95, wind: 38 },
    snow:    { code: 73, wind: 12 }
  };

  /* =========================================================
     Small weather icons for the control
     ========================================================= */
  function iconSVG(kind, night) {
    const sun = '<circle cx="12" cy="12" r="5" fill="#ffc93c"/><g stroke="#ffb300" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g>';
    const moon = '<path d="M19 14.5A8 8 0 0 1 9.5 5a8 8 0 1 0 9.5 9.5z" fill="#f2eecf"/>';
    const cloud = (fill, y = 0) => `<path transform="translate(0 ${y})" d="M7 19h10.5a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6-1.3A4.7 4.7 0 0 0 7 19z" fill="${fill}"/>`;
    const small = night ? '<g transform="translate(-3 -4) scale(.75)">' + moon + '</g>' : '<g transform="translate(-3 -4) scale(.75)">' + sun + '</g>';
    switch (kind) {
      case 'clear': return `<svg viewBox="0 0 24 24">${night ? moon : sun}</svg>`;
      case 'partly': return `<svg viewBox="0 0 24 24">${small}${cloud('#e9eef3', 1)}</svg>`;
      case 'cloudy': return `<svg viewBox="0 0 24 24">${cloud('#b9c3cc', -3)}${cloud('#e4e9ee', 1)}</svg>`;
      case 'fog': return `<svg viewBox="0 0 24 24">${cloud('#cfd6dd', -4)}<g stroke="#aab4bd" stroke-width="2" stroke-linecap="round"><path d="M4 17h16M6 21h12"/></g></svg>`;
      case 'drizzle':
      case 'rain': return `<svg viewBox="0 0 24 24">${cloud('#c3ccd5', -4)}<g stroke="#4f9be8" stroke-width="2" stroke-linecap="round"><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></g></svg>`;
      case 'storm': return `<svg viewBox="0 0 24 24">${cloud('#8c97a3', -4)}<path d="M12.5 14l-3 5h3l-1.5 4 4.5-6h-3l1.5-3z" fill="#ffd23f"/></svg>`;
      case 'snow': return `<svg viewBox="0 0 24 24">${cloud('#d5dde4', -4)}<g fill="#ffffff" stroke="#9fb3c6" stroke-width=".6"><circle cx="8" cy="19" r="1.4"/><circle cx="12" cy="21" r="1.4"/><circle cx="16" cy="19" r="1.4"/></g></svg>`;
    }
    return '';
  }

  /* =========================================================
     Helpers
     ========================================================= */
  function layer(w = W, h = H) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * dpr));
    c.height = Math.max(1, Math.round(h * dpr));
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c, x };
  }
  const hex = h => { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
  const lerp3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  const rgb = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
  const shade = (h, k) => {
    const [r, g, b] = hex(h);
    const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  };
  function seeded(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* =========================================================
     Scene state: current values ease toward targets
     ========================================================= */
  const cur = { cloud: 0.2, rain: 0, drizzle: 0, snow: 0, fog: 0, storm: 0, night: 0, wind: 0.1, cover: 0 };
  let tgt = { ...cur };
  {
    const hr = new Date().getHours();
    cur.night = tgt.night = (hr < 6 || hr >= 18) ? 1 : 0;
  }
  let firstScene = true;
  function setTargets(t) {
    tgt = { ...t, cover: t.snow > 0.2 ? clamp(t.snow + 0.35, 0, 1) : 0 };
    if (firstScene) { Object.assign(cur, tgt); firstScene = false; }
  }

  /* =========================================================
     Scene layout: Bodhi tree, Buddha, lotus pond
     ========================================================= */
  let seed = Math.floor(Math.random() * 1e9);
  let LY = null;        // layout
  let land = null;      // { farG, farS, nearG, nearS }
  let canopy = null;    // { G, S } each { L: [3 layers], x0, y0, w, h }
  let scratch, pondLayer, moonSprite, cloudSprites, fogSprites;
  let pondStones = [], pads = [], lotuses = [], ripples = [];

  function computeLayout() {
    const narrow = W < 700;
    const fs = clamp(H / 760, 0.65, 1.5) * (narrow ? 1.25 : 1.7);   // statue scale (px per unit)
    const ts = clamp(H / 760, 0.7, 1.5) * (narrow ? 0.85 : 1);       // tree scale
    const bx = narrow ? W * 0.46 : W * 0.66;
    const groundY = H * 0.865;
    const tx = narrow ? bx + W * 0.2 : bx + Math.min(W * 0.05, 70 * ts);
    const pivotY = H * 0.37;
    const spread = narrow ? W * 0.42 : Math.min(W * 0.28, H * 0.56);
    const pond = narrow
      ? { cx: W * 0.4, cy: H * 0.966, rx: W * 0.34, ry: H * 0.026 }
      : { cx: W * 0.24, cy: H * 0.895, rx: Math.min(W * 0.21, 330), ry: H * 0.062 };
    const seatY = groundY - 30 * fs;
    const inc = { x: bx - 92 * fs, y: groundY + 3 * fs };
    return {
      narrow, fs, ts, bx, groundY, tx, pivotY, spread, pond, seatY,
      lamps: [{ x: bx - 66 * fs, y: groundY + 2 * fs }, { x: bx + 62 * fs, y: groundY + 2 * fs }],
      incense: inc,
      tips: [[inc.x - 4 * fs, inc.y - 34 * fs], [inc.x + 0.5 * fs, inc.y - 36 * fs], [inc.x + 4.5 * fs, inc.y - 33 * fs]],
      head: { x: bx, y: seatY - 82 * fs }
    };
  }

  function hills(R) {
    const o = [R() * 10, R() * 10, R() * 10, R() * 10, R() * 10];
    return {
      far: x => H * 0.55 - (Math.sin(x * 0.0042 + o[0]) * 0.035 + Math.sin(x * 0.011 + o[1]) * 0.014) * H,
      mid: x => H * 0.64 - (Math.sin(x * 0.0031 + o[2]) * 0.04 + Math.sin(x * 0.0095 + o[3]) * 0.012) * H,
      meadow: x => H * 0.75 - Math.sin(x * 0.0024 + o[4]) * 0.018 * H
    };
  }

  const cubic = (a, b, c, d, t) => {
    const v = 1 - t;
    return v * v * v * a + 3 * v * v * t * b + 3 * v * t * t * c + t * t * t * d;
  };

  function roundRect(x, l, t, w, h, r) {
    x.beginPath();
    x.moveTo(l + r, t);
    x.lineTo(l + w - r, t); x.quadraticCurveTo(l + w, t, l + w, t + r);
    x.lineTo(l + w, t + h - r); x.quadraticCurveTo(l + w, t + h, l + w - r, t + h);
    x.lineTo(l + r, t + h); x.quadraticCurveTo(l, t + h, l, t + h - r);
    x.lineTo(l, t + r); x.quadraticCurveTo(l, t, l + r, t);
    x.closePath();
  }

  // a tapered, curved limb (used for trunk strands, roots and branches)
  function taper(x, p0, p1, p2, p3, w0, w1, fill, edge) {
    const A = [], B = [], N = 24;
    const at = t => [cubic(p0[0], p1[0], p2[0], p3[0], t), cubic(p0[1], p1[1], p2[1], p3[1], t)];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const [px, py] = at(t);
      const [ax, ay] = at(Math.max(0, t - 0.01)), [bx, by] = at(Math.min(1, t + 0.01));
      const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
      const w = (w0 + (w1 - w0) * t) / 2;
      A.push([px - dy / len * w, py + dx / len * w]);
      B.push([px + dy / len * w, py - dx / len * w]);
    }
    x.beginPath();
    A.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b));
    for (let i = B.length - 1; i >= 0; i--) x.lineTo(B[i][0], B[i][1]);
    x.closePath();
    x.fillStyle = fill; x.fill();
    if (edge) { x.strokeStyle = edge; x.lineWidth = 1; x.stroke(); }
  }

  function drawRoundTree(x, bx, by, h, snowy, R) {
    const tw = Math.max(1.5, h * 0.07);
    x.fillStyle = '#4a3524';
    x.fillRect(bx - tw / 2, by - h * 0.45, tw, h * 0.45 + 2);
    const r = h * 0.3, cy = by - h * 0.62;
    const blobs = [];
    for (let k = 0; k < 9; k++) blobs.push([bx + (R() - 0.5) * r * 1.3, cy + (R() - 0.5) * r * 1.1, r * (0.5 + R() * 0.35)]);
    for (const [px, py, pr] of blobs) {
      const g = x.createRadialGradient(px - pr * 0.35, py - pr * 0.4, pr * 0.1, px, py, pr);
      g.addColorStop(0, snowy ? '#5d7a62' : '#7fb35a');
      g.addColorStop(1, snowy ? '#2f4536' : '#3c6e2b');
      x.fillStyle = g;
      x.beginPath(); x.arc(px, py, pr, 0, TAU); x.fill();
    }
    if (snowy) {
      x.fillStyle = 'rgba(248,251,255,0.95)';
      for (const [px, py, pr] of blobs) { x.beginPath(); x.ellipse(px, py - pr * 0.55, pr * 0.75, pr * 0.38, 0, Math.PI, TAU); x.fill(); }
    }
  }

  function drawConifer(x, bx, by, h, snowy) {
    x.fillStyle = '#3b2a1c';
    x.fillRect(bx - h * 0.03, by - h * 0.15, h * 0.06, h * 0.15 + 2);
    for (let k = 0; k < 4; k++) {
      const ty = by - h * 0.12 - k * h * 0.2, tw = h * (0.34 - k * 0.07);
      const g = x.createLinearGradient(bx - tw, 0, bx + tw, 0);
      g.addColorStop(0, snowy ? '#1f3a2c' : '#24502f');
      g.addColorStop(0.55, snowy ? '#2f5440' : '#346b3c');
      g.addColorStop(1, snowy ? '#1a3226' : '#1f4628');
      x.fillStyle = g;
      x.beginPath(); x.moveTo(bx - tw, ty); x.lineTo(bx, ty - h * 0.32); x.lineTo(bx + tw, ty); x.closePath(); x.fill();
      if (snowy) {
        x.fillStyle = 'rgba(250,252,255,0.95)';
        x.beginPath(); x.moveTo(bx - tw * 0.85, ty - 1); x.lineTo(bx, ty - h * 0.3); x.lineTo(bx + tw * 0.85, ty - 1);
        x.quadraticCurveTo(bx, ty - h * 0.12, bx - tw * 0.85, ty - 1); x.fill();
      }
    }
  }

  /* ---------- Bodhi tree trunk: fluted bark with texture and shading ---------- */
  function taperPath(P, p0, p1, p2, p3, w0, w1) {
    const A = [], B = [], C = [], N = 28;
    const at = t => [cubic(p0[0], p1[0], p2[0], p3[0], t), cubic(p0[1], p1[1], p2[1], p3[1], t)];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const [px, py] = at(t);
      const [ax, ay] = at(Math.max(0, t - 0.01)), [bx, by] = at(Math.min(1, t + 0.01));
      const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
      const w = (w0 + (w1 - w0) * t) / 2;
      A.push([px - dy / len * w, py + dx / len * w]);
      B.push([px + dy / len * w, py - dx / len * w]);
      C.push([px, py, w, -dy / len, dx / len]);
    }
    A.forEach(([a, b], i) => i ? P.lineTo(a, b) : P.moveTo(a, b));
    for (let i = B.length - 1; i >= 0; i--) P.lineTo(B[i][0], B[i][1]);
    P.closePath();
    return { A, B, C };
  }
  const poly = (x, pts) => { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); };

  function drawTrunk(x, R, snowy) {
    const { tx, groundY, pivotY, ts } = LY;
    const base = groundY - 6 * ts;
    const P = new Path2D();
    const parts = [];
    for (const [dir, reach, drop, w] of [[-1, 175, 10, 30], [-1, 110, 16, 26], [-1, 60, 18, 22], [1, 70, 17, 22], [1, 125, 14, 26], [1, 190, 8, 30]]) {
      const sx = tx + dir * 22 * ts, sy = base - 40 * ts;
      const ex = tx + dir * reach * ts, ey = groundY + drop * ts * 0.5;
      parts.push(taperPath(P, [sx, sy], [sx + dir * reach * 0.25 * ts, sy + 20 * ts], [ex - dir * reach * 0.35 * ts, ey - 6 * ts], [ex, ey], w * ts, 2 * ts));
    }
    for (let i = 0; i < 6; i++) {
      const o = (i / 5) * 2 - 1;
      const bxp = tx + o * 58 * ts, txp = tx + o * 26 * ts + (R() - 0.5) * 8 * ts;
      const tw = (R() - 0.5) * 40 * ts;
      parts.push(taperPath(P, [bxp, base], [bxp + tw, base - (base - pivotY) * 0.35], [txp - tw, pivotY + (base - pivotY) * 0.3], [txp, pivotY - 12 * ts],
        (34 + R() * 8) * ts, (16 + R() * 5) * ts));
    }
    const left = tx - 220 * ts, top = pivotY - 30 * ts, wdt = 440 * ts, hgt = groundY - pivotY + 60 * ts;

    x.save();
    x.clip(P);
    // round, sun-from-the-left shading
    const g = x.createLinearGradient(tx - 85 * ts, 0, tx + 85 * ts, 0);
    g.addColorStop(0, '#2b2723'); g.addColorStop(0.2, '#655e54'); g.addColorStop(0.36, '#8e867a');
    g.addColorStop(0.55, '#6a6359'); g.addColorStop(0.8, '#433e38'); g.addColorStop(1, '#24211e');
    x.fillStyle = g;
    x.fillRect(left, top, wdt, hgt);
    // each fluted strand: dark crevices at its edges, a soft highlight on its crest
    x.lineCap = 'round'; x.lineJoin = 'round';
    for (const pt of parts) {
      x.save();
      x.filter = `blur(${2.5 * ts}px)`;
      x.strokeStyle = 'rgba(205,195,175,0.22)';
      x.lineWidth = Math.max(2, pt.C[8][2] * 0.5);
      poly(x, pt.C.map(([cx, cy, w, nx, ny]) => [cx + nx * w * 0.3, cy + ny * w * 0.3])); x.stroke();
      x.strokeStyle = 'rgba(10,8,6,0.45)';
      x.lineWidth = Math.max(2, pt.C[8][2] * 0.35);
      poly(x, pt.C.map(([cx, cy, w, nx, ny]) => [cx - nx * w * 0.55, cy - ny * w * 0.55])); x.stroke();
      x.restore();
      x.strokeStyle = 'rgba(12,10,8,0.6)'; x.lineWidth = 1.6 * ts;
      poly(x, pt.A); x.stroke();
      poly(x, pt.B); x.stroke();
    }
    // bark: vertical fissures, pale flecks, lichen
    for (let i = 0; i < 1400; i++) {
      const px = left + R() * wdt, py = top + R() * hgt;
      const len = (5 + R() * 20) * ts;
      x.strokeStyle = R() < 0.6 ? `rgba(18,15,12,${0.14 + R() * 0.2})` : `rgba(205,196,178,${0.06 + R() * 0.1})`;
      x.lineWidth = (0.6 + R() * 1.2) * ts;
      x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + (R() - 0.5) * 3 * ts, py + len * 0.5, px + (R() - 0.5) * 2 * ts, py + len); x.stroke();
    }
    for (let i = 0; i < 18; i++) {
      const px = tx + (R() - 0.5) * 110 * ts, py = pivotY + R() * (groundY - pivotY);
      const r = (6 + R() * 16) * ts;
      const lg = x.createRadialGradient(px, py, 0, px, py, r);
      lg.addColorStop(0, `rgba(150,160,128,${0.2 + R() * 0.15})`); lg.addColorStop(1, 'rgba(150,160,128,0)');
      x.fillStyle = lg; x.fillRect(px - r, py - r, r * 2, r * 2);
    }
    // the crown shades the upper trunk; dampness and occlusion at the base
    let sg = x.createLinearGradient(0, pivotY - 20 * ts, 0, pivotY + (groundY - pivotY) * 0.45);
    sg.addColorStop(0, 'rgba(8,10,6,0.6)'); sg.addColorStop(1, 'rgba(8,10,6,0)');
    x.fillStyle = sg; x.fillRect(left, top, wdt, hgt);
    sg = x.createLinearGradient(0, groundY - 40 * ts, 0, groundY + 10 * ts);
    sg.addColorStop(0, 'rgba(10,9,6,0)'); sg.addColorStop(1, 'rgba(10,9,6,0.55)');
    x.fillStyle = sg; x.fillRect(left, top, wdt, hgt);
    // a few patches of light coming through the leaves
    for (let i = 0; i < 6; i++) {
      const px = tx - 40 * ts + R() * 60 * ts, py = pivotY + (0.3 + R() * 0.6) * (groundY - pivotY);
      const r = (5 + R() * 9) * ts;
      const lg = x.createRadialGradient(px, py, 0, px, py, r);
      lg.addColorStop(0, 'rgba(255,235,190,0.22)'); lg.addColorStop(1, 'rgba(255,235,190,0)');
      x.fillStyle = lg; x.fillRect(px - r, py - r, r * 2, r * 2);
    }
    x.restore();
    if (snowy) {
      x.strokeStyle = 'rgba(248,251,255,0.9)'; x.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const pt = parts[i];
        x.lineWidth = 2.4 * ts;
        poly(x, pt.B.slice(2).map(([a, b]) => [a, b + 1])); x.stroke();
      }
    }
  }

  /* ---------- Bodhi crown: a branching skeleton with thousands of lit leaves ---------- */
  const LEAF = (() => {
    const p = new Path2D();
    p.moveTo(0, 0);
    p.bezierCurveTo(0.15, -0.2, 0.7, -0.15, 0.55, 0.35);
    p.bezierCurveTo(0.45, 0.6, 0.15, 0.8, 0, 1.3);
    p.bezierCurveTo(-0.15, 0.8, -0.45, 0.6, -0.55, 0.35);
    p.bezierCurveTo(-0.7, -0.15, -0.15, -0.2, 0, 0);
    return p;
  })();
  const LEAF_RIB = (() => { const p = new Path2D(); p.moveTo(0, -0.05); p.quadraticCurveTo(0.03, 0.6, 0, 1.2); return p; })();
  const LEAF_STOPS = [[0, hex('#132510')], [0.3, hex('#264a1c')], [0.55, hex('#3f6d29')], [0.78, hex('#6a9a3c')], [0.95, hex('#9cc257')], [1.1, hex('#c4da78')]];
  function leafRGB(b) {
    for (let i = 1; i < LEAF_STOPS.length; i++) {
      if (b <= LEAF_STOPS[i][0]) {
        const [a0, c0] = LEAF_STOPS[i - 1], [a1, c1] = LEAF_STOPS[i];
        return lerp3(c0, c1, clamp((b - a0) / (a1 - a0), 0, 1));
      }
    }
    return LEAF_STOPS[LEAF_STOPS.length - 1][1];
  }

  function renderCanopy(snowy) {
    const R = seeded(seed + 99);
    const { tx, pivotY, spread, ts } = LY;
    const x0 = Math.floor(tx - spread * 1.45), y0 = -70;
    const w = Math.ceil(spread * 2.9), h = Math.ceil(pivotY + 90 * ts + 70);
    const cd = Math.min(dpr, 1.5);
    const mk = () => {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * cd)); c.height = Math.max(1, Math.round(h * cd));
      const x = c.getContext('2d');
      x.setTransform(cd, 0, 0, cd, -x0 * cd, -y0 * cd);
      return { c, x };
    };
    const L = [mk(), mk(), mk()];
    const dCx = tx + spread * 0.1, dCy = pivotY * 0.56, drx = spread * 1.06, dry = pivotY * 0.5;

    // branching skeleton
    const segs = [], tips = [];
    const ph1 = R() * 6, ph2 = R() * 6, ph3 = R() * 6;
    const lobe = a => 1 + 0.13 * Math.sin(3 * a + ph1) + 0.08 * Math.sin(5 * a + ph2) + 0.05 * Math.sin(11 * a + ph3);
    const inCrown = (px, py) => {
      const ex = (px - dCx) / drx, ey = (py - dCy) / dry;
      const l = lobe(Math.atan2(ey, ex));
      return (ex * ex + ey * ey) / (l * l);
    };
    function grow(ax, ay, ang, len, wd, depth) {
      let bx = ax + Math.cos(ang) * len, by = ay + Math.sin(ang) * len;
      for (let k = 0; k < 6 && inCrown(bx, by) > 0.92; k++) {
        len *= 0.8;
        bx = ax + Math.cos(ang) * len; by = ay + Math.sin(ang) * len;
      }
      const bend = (R() - 0.5) * len * 0.35;
      const cx = (ax + bx) / 2 + Math.cos(ang + Math.PI / 2) * bend, cy = (ay + by) / 2 + Math.sin(ang + Math.PI / 2) * bend + len * 0.05 * depth;
      segs.push({ ax, ay, cx, cy, bx, by, w0: wd, w1: wd * 0.7, depth });
      if (depth >= 2) tips.push({ x: bx, y: by, z: R() * 2 - 1 });
      if (depth >= 5 || len < 8 * ts || inCrown(bx, by) > 0.8) { tips.push({ x: bx, y: by, z: R() * 2 - 1 }); return; }
      const n = depth < 2 ? 3 : 2 + (R() < 0.3 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        let na = ang + (k - (n - 1) / 2) * (0.45 + R() * 0.35) + (R() - 0.5) * 0.3;
        na = na * 0.9 + (-Math.PI / 2) * 0.1;
        grow(bx, by, na, len * (0.66 + R() * 0.14), wd * 0.64, depth + 1);
      }
    }
    const L0 = Math.min(spread, pivotY * 1.4) * 0.36;
    for (let i = 0; i < 6; i++) {
      const ang = -Math.PI / 2 + (i - 2.5) * 0.46 + (R() - 0.5) * 0.14;
      grow(tx + (i - 2.5) * 6 * ts, pivotY - 8 * ts, ang, L0 * (0.9 + R() * 0.25), 15 * ts, 0);
    }
    // foliage fills the outer shell of the crown (seen from the front it covers the whole crown)
    const extra = Math.round(drx * dry / 58);
    for (let i = 0; i < extra; i++) {
      let dx, dy, dz;
      do { dx = R() * 2 - 1; dy = R() * 2 - 1; dz = R() * 2 - 1; } while (dx * dx + dy * dy + dz * dz > 1 || dx * dx + dy * dy + dz * dz < 0.05);
      const m = Math.hypot(dx, dy, dz);
      dx /= m; dy /= m; dz /= m;
      const rr = (0.8 + 0.2 * R()) * lobe(Math.atan2(dy, dx));
      const px = dCx + dx * drx * rr, py = dCy + dy * dry * rr;
      if (py > pivotY - 14 * ts || py < y0 + 24) continue;
      tips.push({ x: px, y: py, z: dz });
    }

    // leaves around every twig, lit as one rounded crown
    const lx = -0.5, ly = -0.68, lz = 0.53;
    const leaves = [];
    for (const tp of tips) {
      const n = Math.round((18 + R() * 20) * Math.min(1.3, ts));
      const rr = (7 + R() * 10) * ts;
      for (let k = 0; k < n; k++) {
        let dx, dy, dz;
        do { dx = R() * 2 - 1; dy = R() * 2 - 1; dz = R() * 2 - 1; } while (dx * dx + dy * dy + dz * dz > 1);
        const px = tp.x + dx * rr, py = tp.y + dy * rr * 0.85;
        const nx = (px - dCx) / drx, ny = (py - dCy) / dry;
        const rim = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
        const z = clamp(tp.z * rim + dz * 0.25, -1, 1);
        const len = Math.hypot(nx, ny, z) || 1;
        const lam = Math.max(0, (nx * lx + ny * ly + z * lz) / len);
        const occl = 0.42 + 0.58 * (z + 1) / 2;
        const outer = clamp(Math.hypot(nx, ny) * 1.1, 0, 1);
        let b = (0.18 + 0.9 * lam) * occl * (0.75 + 0.15 * outer) * (0.82 + 0.36 * R());
        if (outer > 0.85 && R() < 0.5) b += 0.12 + 0.12 * R();      // sun shining through thin edge leaves
        const glint = lam > 0.6 && z > 0.2 && R() < 0.12;
        leaves.push({ x: px, y: py, z, b, ny: ny / len, s: (3.4 + R() * 3.4) * ts, a: Math.PI * 0.05 + (R() - 0.5) * 2.4, sq: 0.35 + R() * 0.65, rib: R() < 0.4, glint });
      }
    }
    leaves.sort((a, b) => a.z - b.z);

    const drawLeaves = (x, list) => {
      for (const l of list) {
        let c = leafRGB(l.b);
        if (snowy) {
          const snow = clamp((-l.ny - 0.15) * 1.6, 0, 1) * clamp((l.z + 0.4) * 1.5, 0, 1);
          if (snow > 0) c = lerp3(c, [238, 243, 248], snow * 0.9);
        }
        const ca = Math.cos(l.a), sa = Math.sin(l.a), s = l.s;
        x.setTransform(cd * s * ca * l.sq, cd * s * sa * l.sq, -cd * s * sa, cd * s * ca, cd * (l.x - x0), cd * (l.y - y0));
        x.fillStyle = rgb(c);
        x.fill(LEAF);
        if (l.glint) {
          x.fillStyle = 'rgba(236,246,214,0.55)';
          x.beginPath(); x.ellipse(-0.12, 0.45, 0.13, 0.32, 0.2, 0, TAU); x.fill();
        }
        if (l.rib && s > 4.5) {
          x.strokeStyle = rgb(lerp3(c, [10, 20, 8], 0.35), 0.7);
          x.lineWidth = 0.07;
          x.stroke(LEAF_RIB);
        }
      }
      x.setTransform(cd, 0, 0, cd, -x0 * cd, -y0 * cd);
    };

    // back leaves, then the branches, then the middle and front leaves
    {
      const tmp = mk();
      drawLeaves(tmp.x, leaves.filter(l => l.z < -0.3));
      L[0].x.save();
      L[0].x.setTransform(1, 0, 0, 1, 0, 0);
      L[0].x.filter = `blur(${0.8 * cd}px) brightness(0.9)`;
      L[0].x.drawImage(tmp.c, 0, 0);
      L[0].x.restore();
    }
    const back = L[0].x;
    segs.sort((a, b) => b.depth - a.depth);
    for (const sgm of segs) {
      const P = new Path2D();
      const pt = taperPath(P, [sgm.ax, sgm.ay], [sgm.cx, sgm.cy], [sgm.cx, sgm.cy], [sgm.bx, sgm.by], sgm.w0, sgm.w1);
      const shadeK = clamp(sgm.depth * 0.12, 0, 0.5);
      back.fillStyle = rgb(lerp3(hex('#4a443b'), [18, 16, 12], shadeK));
      back.fill(P);
      if (sgm.w0 > 4 * ts) {
        back.strokeStyle = 'rgba(190,180,160,0.13)';
        back.lineWidth = sgm.w0 * 0.25;
        poly(back, pt.C.map(([cx, cy, wv, nx, ny]) => [cx + nx * wv * 0.35, cy + ny * wv * 0.35]));
        back.stroke();
        back.strokeStyle = 'rgba(10,8,6,0.35)';
        back.lineWidth = sgm.w0 * 0.2;
        poly(back, pt.C.map(([cx, cy, wv, nx, ny]) => [cx - nx * wv * 0.5, cy - ny * wv * 0.5]));
        back.stroke();
      }
      if (snowy && sgm.w0 > 2.5 * ts) {
        back.strokeStyle = 'rgba(245,249,253,0.85)';
        back.lineWidth = Math.max(1.2, sgm.w0 * 0.3);
        poly(back, pt.B.map(([a, b2]) => [a, b2])); back.stroke();
      }
    }
    back.lineCap = 'round';
    for (const sgm of segs.filter(q => q.depth <= 1)) {
      for (let k = 0; k < 2; k++) {
        if (R() < 0.35) continue;
        const t2 = 0.3 + R() * 0.6;
        const rx0 = sgm.ax + (sgm.bx - sgm.ax) * t2, ry0 = sgm.ay + (sgm.by - sgm.ay) * t2;
        const len = (30 + R() * 80) * ts;
        back.strokeStyle = `rgba(78,70,58,${0.55 + R() * 0.3})`;
        back.lineWidth = (0.7 + R() * 0.9) * ts;
        back.beginPath(); back.moveTo(rx0, ry0);
        back.bezierCurveTo(rx0 + (R() - 0.5) * 6 * ts, ry0 + len * 0.4, rx0 + (R() - 0.5) * 8 * ts, ry0 + len * 0.7, rx0 + (R() - 0.5) * 4 * ts, ry0 + len);
        back.stroke();
      }
    }
    drawLeaves(L[1].x, leaves.filter(l => l.z >= -0.3 && l.z < 0.35));
    drawLeaves(L[2].x, leaves.filter(l => l.z >= 0.35));
    return { L, x0, y0, w, h, dCx };
  }

  /* ---------- Buddha on a lotus pedestal, lamps and incense ---------- */
  function bronze(x, x0, x1, dark = 0) {
    const g = x.createLinearGradient(x0, 0, x1, 0);
    const c = h => shade(h, -dark);
    g.addColorStop(0, c('#4a4843'));
    g.addColorStop(0.28, c('#8f8b82'));
    g.addColorStop(0.42, c('#b3aea3'));
    g.addColorStop(0.62, c('#88847b'));
    g.addColorStop(1, c('#3f3d39'));
    return g;
  }

  // the drawn statue (fallback only, in statue units)
  function drawStatueUnits(x, snowy) {
    const line = 'rgba(30,28,24,0.55)';
    x.save();
    x.lineJoin = 'round'; x.lineCap = 'round';
    // stone lotus pedestal
    const stone = () => {
      const g = x.createLinearGradient(-70, 0, 70, 0);
      g.addColorStop(0, '#6f6a60'); g.addColorStop(0.35, '#cbc5b7'); g.addColorStop(0.6, '#a39d90'); g.addColorStop(1, '#5d594f');
      return g;
    };
    x.fillStyle = stone(); roundRect(x, -68, 23, 136, 8, 2); x.fill();
    x.fillStyle = stone(); roundRect(x, -61, 13, 122, 11, 3); x.fill();
    x.strokeStyle = 'rgba(40,36,30,0.35)'; x.lineWidth = 0.6;
    x.beginPath(); x.moveTo(-61, 18.5); x.lineTo(61, 18.5); x.stroke();
    x.fillStyle = stone(); x.fillRect(-55, 3, 110, 11);
    for (let i = -5; i <= 5; i++) {
      const cx = i * 10.4;
      const pg = x.createLinearGradient(0, 1, 0, 14);
      pg.addColorStop(0, '#ddd7c9'); pg.addColorStop(1, '#8f897d');
      x.fillStyle = pg;
      x.beginPath(); x.moveTo(cx - 5.6, 14); x.quadraticCurveTo(cx - 6, 5, cx, 0.5); x.quadraticCurveTo(cx + 6, 5, cx + 5.6, 14); x.closePath();
      x.fill(); x.strokeStyle = 'rgba(40,36,30,0.4)'; x.stroke();
    }
    x.fillStyle = '#b9b3a5';
    x.beginPath(); x.ellipse(0, 2, 56, 4.5, 0, 0, TAU); x.fill();
    if (snowy) {
      x.fillStyle = 'rgba(248,251,255,0.95)';
      x.beginPath(); x.ellipse(0, 1.5, 58, 4.5, 0, 0, TAU); x.fill();
      x.beginPath(); x.ellipse(0, 13, 62, 2.2, 0, 0, TAU); x.fill();
      x.beginPath(); x.ellipse(0, 23, 69, 2.2, 0, 0, TAU); x.fill();
    }

    x.restore();
  }

  function drawShrine(x, snowy) {
    const { bx, seatY, fs: u } = LY;
    const line = 'rgba(30,28,24,0.55)';
    x.save();
    x.translate(bx, seatY);
    x.scale(u, u);
    x.lineJoin = 'round'; x.lineCap = 'round';

    x.fillStyle = 'rgba(0,0,0,0.25)';
    x.beginPath(); x.ellipse(0, 31, 80, 6, 0, 0, TAU); x.fill();

    x.restore();

    // clay oil lamps
    for (const l of LY.lamps) {
      x.save(); x.translate(l.x, l.y); x.scale(u, u);
      const g = x.createLinearGradient(-9, 0, 11, 0);
      g.addColorStop(0, '#6e3418'); g.addColorStop(0.4, '#c0673a'); g.addColorStop(1, '#5a2a12');
      x.fillStyle = g;
      x.beginPath(); x.moveTo(-9, -4); x.quadraticCurveTo(-8, 2, 0, 2.5); x.quadraticCurveTo(8, 2, 11, -5); x.quadraticCurveTo(4, -3, -9, -4); x.fill();
      x.fillStyle = '#3a1a0a';
      x.beginPath(); x.ellipse(0, -3.8, 8, 1.5, 0, 0, TAU); x.fill();
      x.restore();
    }
    // incense holder
    {
      const inc = LY.incense;
      x.save(); x.translate(inc.x, inc.y); x.scale(u, u);
      x.fillStyle = '#7a6a55';
      x.beginPath(); x.ellipse(0, -3, 8, 4, 0, 0, TAU); x.fill();
      x.fillStyle = snowy ? '#eef3f7' : '#9c8a70';
      x.beginPath(); x.ellipse(0, -6, 8, 1.6, 0, 0, TAU); x.fill();
      x.strokeStyle = '#6b3d1e'; x.lineWidth = 0.7;
      for (const [a, b] of [[-1.5, -4], [0, 0.5], [1.5, 4.5]]) {
        x.beginPath(); x.moveTo(a, -6); x.lineTo(b, b === -4 ? -34 : b === 0.5 ? -36 : -33); x.stroke();
      }
      x.restore();
    }
  }

  /* ---------- Sculpted statue: rendered in 3D with WebGL ---------- */
  // Box (in statue units, y downward, origin at the top of the pedestal seat)
  const SBOX = { x0: -76, y0: -113, w: 152, h: 154 };
  let statue = null;     // { day, daySnow, lamp, lampSnow }

  const STATUE_FS = `
precision highp float;
uniform vec2 uRes;
uniform vec4 uBox;
uniform float uMode;
uniform float uSnow;
uniform float uBody;
uniform vec3 uLamp1;
uniform vec3 uLamp2;

float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float sdE(vec3 p, vec3 r) { float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-4); }
float sdCap(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdRC(vec3 p, vec3 a, vec3 b, float r1, float r2) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - mix(r1, r2, h); }
float sdCyl(vec3 p, float r, float y0, float y1, float rr) {
  vec2 d = vec2(length(p.xz) - r, abs(p.y - (y0 + y1) * 0.5) - (y1 - y0) * 0.5);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - rr;
}
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float body(vec3 p) {
  // folded legs in the lotus position
  float d = sdE(p - vec3(0.0, 8.0, 3.0), vec3(45.0, 9.0, 21.0));
  d = smin(d, sdCap(p, vec3(-38.0, 8.0, -2.0), vec3(18.0, 12.0, -12.0), 8.0), 5.0);
  d = smin(d, sdCap(p, vec3(38.0, 8.5, 0.0), vec3(-17.0, 13.5, -10.0), 7.5), 5.0);
  d = smin(d, sdE(p - vec3(-39.0, 8.5, -3.0), vec3(10.0, 8.5, 11.0)), 4.0);
  d = smin(d, sdE(p - vec3(39.0, 8.5, -3.0), vec3(10.0, 8.5, 11.0)), 4.0);
  d = smin(d, sdE(p - vec3(-17.0, 16.8, -13.0), vec3(8.5, 3.0, 4.5)), 1.6);
  d = smin(d, sdE(p - vec3(17.0, 17.6, -12.0), vec3(8.5, 3.0, 4.5)), 1.6);
  // slim waist, broad calm chest, sloping shoulders
  float t = sdE(p - vec3(0.0, 31.0, 0.0), vec3(15.5, 12.0, 11.0));
  t = smin(t, sdE(p - vec3(0.0, 48.0, 0.5), vec3(19.0, 13.0, 11.0)), 7.0);
  t = smin(t, sdE(p - vec3(-18.5, 56.5, 0.0), vec3(7.0, 5.5, 7.0)), 5.0);
  t = smin(t, sdE(p - vec3(18.5, 56.5, 0.0), vec3(7.0, 5.5, 7.0)), 5.0);
  d = smin(d, t, 5.0);
  // slender arms close to the body
  float a = sdRC(p, vec3(-21.0, 56.0, 0.0), vec3(-26.5, 38.0, -3.0), 5.4, 4.8);
  a = smin(a, sdRC(p, vec3(-26.5, 38.0, -3.0), vec3(-9.0, 23.5, -12.5), 4.8, 4.0), 2.5);
  float b = sdRC(p, vec3(21.0, 56.0, 0.0), vec3(26.5, 38.0, -3.0), 5.4, 4.8);
  b = smin(b, sdRC(p, vec3(26.5, 38.0, -3.0), vec3(9.0, 23.5, -12.5), 4.8, 4.0), 2.5);
  d = smin(d, min(a, b), 2.2);

  d = smin(d, sdCap(p, vec3(-4.0, 25.6, -16.0), vec3(4.0, 25.6, -16.0), 1.5), 1.2);
  // neck and head
  d = smin(d, sdCap(p, vec3(0.0, 57.0, 0.0), vec3(0.0, 67.0, 0.3), 5.2), 3.0);
  float h = sdE(p - vec3(0.0, 79.5, -1.0), vec3(12.0, 14.5, 12.8));
  h = smin(h, sdE(p - vec3(0.0, 68.5, -7.5), vec3(5.0, 3.0, 4.5)), 3.0);
  h = smin(h, sdE(p - vec3(0.0, 95.5, 0.0), vec3(7.0, 6.0, 7.0)), 3.5);
  h = smin(h, sdE(p - vec3(-11.8, 76.0, 1.5), vec3(2.0, 9.0, 3.4)), 1.5);
  h = smin(h, sdE(p - vec3(11.8, 76.0, 1.5), vec3(2.0, 9.0, 3.4)), 1.5);
  h = smin(h, sdCap(p, vec3(-1.0, 84.5, -12.6), vec3(-9.0, 84.0, -9.3), 0.9), 1.1);
  h = smin(h, sdCap(p, vec3(1.0, 84.5, -12.6), vec3(9.0, 84.0, -9.3), 0.9), 1.1);
  h = smin(h, sdRC(p, vec3(0.0, 83.0, -13.0), vec3(0.0, 76.6, -14.3), 1.2, 1.9), 1.8);
  h = smin(h, sdE(p - vec3(-5.0, 81.0, -11.6), vec3(3.4, 1.7, 1.8)), 0.8);
  h = smin(h, sdE(p - vec3(5.0, 81.0, -11.6), vec3(3.4, 1.7, 1.8)), 0.8);
  h = smin(h, sdE(p - vec3(0.0, 72.6, -12.3), vec3(3.8, 1.1, 1.4)), 0.8);
  h = smin(h, sdE(p - vec3(0.0, 71.3, -11.9), vec3(3.1, 1.1, 1.4)), 0.8);
  h = max(h, -sdCap(p, vec3(-7.8, 80.6, -12.5), vec3(-2.3, 80.4, -13.3), 0.32));
  h = max(h, -sdCap(p, vec3(7.8, 80.6, -12.5), vec3(2.3, 80.4, -13.3), 0.32));
  h = max(h, -sdCap(p, vec3(-3.5, 71.9, -13.5), vec3(3.5, 71.9, -13.5), 0.28));
  // small snail-shell curls of hair
  float hm = smoothstep(84.0, 86.5, p.y + 0.025 * p.x * p.x + max(0.0, p.z) * 0.3);
  h -= 0.42 * hm * sin(p.x * 1.9) * sin(p.y * 1.9) * sin(p.z * 1.9);
  d = smin(d, h, 3.0);
  // neck folds
  float nk = step(length(p.xz), 8.0);
  d += 0.3 * smoothstep(1.0, 0.0, abs(p.y - 63.5)) * nk;
  d += 0.3 * smoothstep(1.0, 0.0, abs(p.y - 61.0)) * nk;
  // robe: a thin layer of cloth over the left shoulder with fine diagonal folds
  float cr = (28.0 * (p.y - 24.0) - 36.0 * (p.x + 14.0)) / 45.6;
  float robe = smoothstep(-0.8, 0.8, -cr) * smoothstep(18.0, 22.0, p.y) * (1.0 - smoothstep(60.0, 64.0, p.y));
  d -= robe * (0.55 + 0.22 * sin((36.0 * p.x - 28.0 * p.y) / 45.6 * 1.1));
  float lap = 1.0 - smoothstep(15.0, 20.0, p.y);
  d -= lap * 0.3 * sin(p.x * 0.42 + p.z * 0.15) * smoothstep(-2.0, 6.0, p.y);
  d -= 0.16 * noise(p * 1.4) + 0.06 * noise(p * 4.0);
  return d;
}

float pedestal(vec3 p) {
  vec3 q = p; q.z *= 1.55;
  float d = sdCyl(q, 64.0, -30.0, -24.5, 1.2);
  d = min(d, sdCyl(q, 58.5, -24.5, -15.0, 1.2));
  float ang = atan(q.x, -q.z);
  float s = abs(sin(ang * 11.0));
  float yy = clamp((q.y + 15.0) / 13.0, 0.0, 1.0);
  float r = 50.0 + 4.5 * sqrt(s) * sin(yy * 2.6 + 0.3) + 2.0 * yy;
  vec2 e = vec2(length(q.xz) - r, abs(q.y + 8.5) - 6.5);
  d = min(d, min(max(e.x, e.y), 0.0) + length(max(e, 0.0)));
  d = min(d, sdCyl(q, 54.5, -2.2, 0.0, 0.8));
  d -= 0.3 * noise(q * 0.6) + 0.12 * noise(q * 2.5);
  return d * 0.62;
}

vec2 map(vec3 p) {
  float b = uBody > 0.5 ? body(p) * 0.85 : 1e4;
  float s = pedestal(p);
  return b < s ? vec2(b, 0.0) : vec2(s, 1.0);
}

vec3 calcNormal(vec3 p) {
  const vec2 k = vec2(1.0, -1.0);
  float e = 0.06;
  return normalize(k.xyy * map(p + k.xyy * e).x + k.yyx * map(p + k.yyx * e).x + k.yxy * map(p + k.yxy * e).x + k.xxx * map(p + k.xxx * e).x);
}
float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 6; i++) {
    float hh = 0.5 + 1.6 * float(i);
    occ += (hh - map(p + n * hh).x) * sca;
    sca *= 0.72;
  }
  return clamp(1.0 - 0.09 * occ, 0.0, 1.0);
}
float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.6;
  for (int i = 0; i < 40; i++) {
    float hh = map(ro + rd * t).x;
    res = min(res, 9.0 * hh / t);
    t += clamp(hh, 0.4, 8.0);
    if (res < 0.01 || t > 160.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float X = uBox.x + uv.x * uBox.z;
  float Y = -(uBox.y + (1.0 - uv.y) * uBox.w);
  float pitch = 0.14;
  vec3 fw = vec3(0.0, -sin(pitch), cos(pitch));
  vec3 up = vec3(0.0, cos(pitch), sin(pitch));
  vec3 ro = vec3(X, 0.0, 0.0) + up * Y - fw * 220.0;
  vec3 rd = fw;

  float t = 150.0, hit = 0.0;
  vec2 m = vec2(0.0);
  for (int i = 0; i < 140; i++) {
    m = map(ro + rd * t);
    if (m.x < 0.015) { hit = 1.0; break; }
    t += m.x;
    if (t > 300.0) break;
  }
  if (hit < 0.5) { gl_FragColor = vec4(0.0); return; }

  vec3 p = ro + rd * t;
  vec3 n = calcNormal(p);
  float ao = calcAO(p, n);
  vec3 v = -rd;
  float nz = noise(p * 0.35), nz2 = noise(p * 1.7);
  bool stone = m.y > 0.5;

  // material: weathered carved stone (the statue slightly lighter and finer than the pedestal)
  vec3 alb; float metal = 0.0, rough = 0.9;
  float grain = noise(p * 2.3) * 0.6 + noise(p * 5.1) * 0.4;
  float streak = noise(vec3(p.x * 0.7, p.y * 0.05, p.z * 0.7));
  if (stone) {
    alb = mix(vec3(0.44, 0.42, 0.38), vec3(0.60, 0.57, 0.51), nz);
  } else {
    alb = mix(vec3(0.46, 0.44, 0.40), vec3(0.60, 0.57, 0.51), nz);
  }
  alb *= 0.74 + 0.42 * grain;
  alb *= 0.86 + 0.22 * streak;
  // dark grime collects in the carved hollows, moss on sheltered damp parts
  alb = mix(alb, vec3(0.17, 0.17, 0.14), smoothstep(0.85, 0.3, ao) * 0.75);
  float moss = smoothstep(0.62, 0.78, noise(p * 0.22 + 3.0)) * smoothstep(0.85, 0.4, ao + 0.15 * n.y);
  alb = mix(alb, vec3(0.27, 0.34, 0.18), moss * (stone ? 0.75 : 0.45));
  // pale lichen spots
  float lichen = smoothstep(0.78, 0.86, noise(p * 0.9 + 7.0));
  alb = mix(alb, vec3(0.70, 0.71, 0.62), lichen * 0.35);
  float snow = uSnow * smoothstep(0.45, 0.8, n.y + (nz2 - 0.5) * 0.35);
  alb = mix(alb, vec3(0.93, 0.95, 0.98), snow);
  metal *= 1.0 - snow; rough = mix(rough, 0.9, snow);

  vec3 col = vec3(0.0);
  vec3 spec0 = mix(vec3(0.04), alb * 1.25, metal);
  if (uMode < 0.5) {
    // daylight from the upper left, sky above, warm bounce from the ground
    vec3 L = normalize(vec3(-0.55, 0.75, -0.55));
    vec3 Hh = normalize(L + v);
    float dif = max(dot(n, L), 0.0) * softShadow(p + n * 0.2, L);
    float sh = pow(max(dot(n, Hh), 0.0), mix(90.0, 8.0, rough)) * dif;
    float fres = pow(1.0 - max(dot(n, v), 0.0), 5.0);
    vec3 sky = vec3(0.55, 0.66, 0.82), ground = vec3(0.32, 0.30, 0.20);
    vec3 refl = reflect(rd, n);
    vec3 env = mix(ground, sky, smoothstep(-0.3, 0.6, refl.y)) * (0.6 + 0.4 * smoothstep(0.2, 0.9, refl.y));
    vec3 amb = mix(ground, sky, 0.5 + 0.5 * n.y) * ao;
    col += alb * (1.0 - metal) * (dif * vec3(1.7, 1.6, 1.42) + amb * 0.48) * (0.45 + 0.55 * ao);
    col += alb * metal * (dif * vec3(0.7, 0.64, 0.56) + amb * 0.3) * (0.4 + 0.6 * ao);
    col += spec0 * sh * vec3(2.2, 2.0, 1.7) * 0.5;
    col += mix(spec0, vec3(1.0), fres * 0.6) * env * ao * (0.42 * metal + 0.06);
  } else {
    // only the warm light of the two oil lamps in front, low down
    for (int i = 0; i < 2; i++) {
      vec3 lp = i == 0 ? uLamp1 : uLamp2;
      vec3 ld = lp - p;
      float dist = length(ld);
      vec3 L = ld / dist;
      float att = 1.0 / (1.0 + dist * dist / 1600.0);
      float dif = max(dot(n, L), 0.0);
      vec3 Hh = normalize(L + v);
      float sh = pow(max(dot(n, Hh), 0.0), mix(90.0, 8.0, rough)) * dif;
      vec3 lc = vec3(1.0, 0.6, 0.26) * 2.4 * att;
      col += lc * (alb * (1.0 - metal * 0.6) * dif * ao + spec0 * sh * 2.2);
    }
  }
  col = col / (1.0 + col * 0.35);
  col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));
  gl_FragColor = vec4(col, 1.0);
}`;

  function renderStatueGL() {
    const u = LY.fs;
    const scale = Math.min(5, u * dpr * 1.6);
    const pw = Math.round(SBOX.w * scale), ph = Math.round(SBOX.h * scale);
    const glc = document.createElement('canvas');
    glc.width = pw; glc.height = ph;
    let gl = null;
    try { gl = glc.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false }); } catch (e) {}
    if (!gl) return null;
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    const vs = sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }');
    const fs = sh(gl.FRAGMENT_SHADER, STATUE_FS);
    if (!vs || !fs) return null;
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
    gl.useProgram(pr);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.viewport(0, 0, pw, ph);
    const U = name => gl.getUniformLocation(pr, name);
    gl.uniform2f(U('uRes'), pw, ph);
    gl.uniform4f(U('uBox'), SBOX.x0, SBOX.y0, SBOX.w, SBOX.h);
    // lamp flames in statue space (x right, y up, z toward the viewer is negative)
    const lampPos = LY.lamps.map(l => [(l.x + 8.5 * u - LY.bx) / u, -((l.y - 8 * u - LY.seatY) / u), -50]);
    gl.uniform3f(U('uLamp1'), ...lampPos[0]);
    gl.uniform3f(U('uLamp2'), ...lampPos[1]);
    const shot = (mode, snow) => {
      gl.uniform1f(U('uMode'), mode);
      gl.uniform1f(U('uSnow'), snow);
      gl.uniform1f(U('uBody'), 0);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      const out = document.createElement('canvas');
      out.width = pw; out.height = ph;
      out.getContext('2d').drawImage(glc, 0, 0);
      return out;
    };
    const res = { day: shot(0, 0), daySnow: shot(0, 1), lamp: shot(1, 0), lampSnow: shot(1, 1) };
    if (gl.getError() !== gl.NO_ERROR) return null;
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    return res;
  }

  // simple drawn version, used only if WebGL is not available
  function renderStatueFallback() {
    const u = LY.fs, scale = u * dpr;
    const mk = snowy => {
      const c = document.createElement('canvas');
      c.width = Math.round(SBOX.w * scale); c.height = Math.round(SBOX.h * scale);
      const x = c.getContext('2d');
      x.scale(scale, scale);
      x.translate(-SBOX.x0, -SBOX.y0);
      drawStatueUnits(x, snowy);
      return c;
    };
    return { day: mk(false), daySnow: mk(true), lamp: null, lampSnow: null };
  }

  // Render the stone statue before it is shown, so its colour never switches.
  // The drawn version is used only if this browser has no 3D graphics.
  function buildStatue() {
    let s = null;
    try { s = renderStatueGL(); } catch (e) { console.warn(e); }
    statue = s || renderStatueFallback();
