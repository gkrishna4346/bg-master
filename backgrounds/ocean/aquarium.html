<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Aquarium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #12505c;
    overflow-x: hidden;
    color: #f2fbff;
  }
  body.night { background: #04121e; }
  #tank {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  /* Your page content goes here, above the aquarium */
  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding: 15vh 16px 24px;
  }
  h1 {
    font-size: clamp(2.4rem, 7vw, 5rem);
    font-weight: normal;
    letter-spacing: 0.04em;
    text-shadow: 0 0 12px rgba(0, 30, 45, 0.7), 0 2px 20px rgba(0, 30, 45, 0.8);
  }
  p {
    margin-top: 12px;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    opacity: 0.92;
    text-shadow: 0 0 10px rgba(0, 30, 45, 0.8), 0 1px 12px rgba(0, 30, 45, 0.8);
  }

  /* Light switch: shows the icon of the mode you will switch TO */
  #themeToggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 2;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 1.5s ease, border-color 1.5s ease, transform 0.2s ease;
  }
  #themeToggle:hover { transform: scale(1.08); }
  #themeToggle:focus-visible { outline: 2px solid #f5b800; outline-offset: 3px; }
  #themeToggle svg { width: 24px; height: 24px; }
  #themeToggle .sun { display: none; }
  body.night #themeToggle { background: rgba(20, 30, 60, 0.55); border-color: rgba(200, 210, 255, 0.35); }
  body.night #themeToggle .sun { display: block; }
  body.night #themeToggle .moon { display: none; }
</style>
</head>
<body>
<canvas id="tank"></canvas>

<button id="themeToggle" type="button" aria-label="Switch to night light" title="Switch to night light">
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#2c3d6e"/>
  </svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="#ffc83d" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.5" fill="#ffd23f"/>
    <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
  </svg>
</button>

<main>
  <h1>Welcome</h1>
  <p>Replace this with your own content.</p>
</main>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('tank');
  const ctx = canvas.getContext('2d');
  const toggle = document.getElementById('themeToggle');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, S = 1;

  /* =========================================================
     Light on (day) / moonlight (night)
     ========================================================= */
  let night;
  {
    const hash = location.hash.toLowerCase();
    if (hash === '#night') night = true;
    else if (hash === '#day') night = false;
    else {
      let saved = null;
      try { saved = localStorage.getItem('aquarium-theme'); } catch (e) {}
      if (saved) night = saved === 'night';
      else { const hr = new Date().getHours(); night = hr < 6 || hr >= 19; }
    }
  }
  let n = night ? 1 : 0;
  function applyThemeUI() {
    document.body.classList.toggle('night', night);
    const label = night ? 'Switch to day light' : 'Switch to night light';
    toggle.setAttribute('aria-label', label);
    toggle.title = label;
  }
  toggle.addEventListener('click', () => {
    night = !night;
    try { localStorage.setItem('aquarium-theme', night ? 'night' : 'day'); } catch (e) {}
    applyThemeUI();
  });
  applyThemeUI();

  /* =========================================================
     Helpers
     ========================================================= */
  function layer(w = W, h = H) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * dpr));
    c.height = Math.max(1, Math.round(h * dpr));
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c, x };
  }
  const hex = h => { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
  const lerp3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  const rgb = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
  const shade = (h, k) => {
    const [r, g, b] = hex(h);
    const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  };
  function seeded(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const cubic = (a, b, c, d, t) => { const v = 1 - t; return v * v * v * a + 3 * v * v * t * b + 3 * v * t * t * c + t * t * t * d; };
  function taper(x, p0, p1, p2, p3, w0, w1) {
    const A = [], B = [], N = 22;
    const at = t => [cubic(p0[0], p1[0], p2[0], p3[0], t), cubic(p0[1], p1[1], p2[1], p3[1], t)];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const [px, py] = at(t), [ax, ay] = at(Math.max(0, t - 0.01)), [bx, by] = at(Math.min(1, t + 0.01));
      const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, w = (w0 + (w1 - w0) * t) / 2;
      A.push([px - dy / len * w, py + dx / len * w]);
      B.push([px + dy / len * w, py - dx / len * w]);
    }
    x.beginPath();
    A.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b));
    for (let i = B.length - 1; i >= 0; i--) x.lineTo(B[i][0], B[i][1]);
    x.closePath();
  }

  /* =========================================================
     Layout
     ========================================================= */
  let seed = Math.floor(Math.random() * 1e9);
  let LY = null;
  const groundY = x => H * (0.745 + 0.018 * Math.sin(x * 0.0042 + 1.3) + 0.01 * Math.sin(x * 0.011));
  function computeLayout() {
    const narrow = W < 700;
    return {
      narrow,
      lidH: H * 0.028,
      surfY: H * 0.062,
      rocks: narrow
        ? [{ x: W * 0.16, y: H * 0.8, w: W * 0.3, h: H * 0.11 }, { x: W * 0.86, y: H * 0.79, w: W * 0.26, h: H * 0.09 }]
        : [{ x: W * 0.15, y: H * 0.785, w: W * 0.17, h: H * 0.17 }, { x: W * 0.255, y: H * 0.81, w: W * 0.1, h: H * 0.09 }, { x: W * 0.84, y: H * 0.79, w: W * 0.14, h: H * 0.12 }],
      wood: { x: narrow ? W * 0.62 : W * 0.66, y: H * 0.82 },
      swords: narrow ? [{ x: W * 0.38, y: H * 0.86, s: 0.85 }] : [{ x: W * 0.44, y: H * 0.84, s: 1 }, { x: W * 0.95, y: H * 0.87, s: 0.85 }],
      stems: narrow ? [{ x: W * 0.72, n: 5 }] : [{ x: W * 0.56, n: 7 }, { x: W * 0.06, n: 5 }],
      airstone: { x: narrow ? W * 0.3 : W * 0.34, y: H * 0.8 }
    };
  }

  /* =========================================================
     Static layers: water & back wall, then hardscape & gravel
     ========================================================= */
  let back, hard, mask, causticTile, causticL, moonGlow;

  function renderBack() {
    const L = layer(), x = L.x;
    const g = x.createLinearGradient(0, LY.surfY, 0, H);
    g.addColorStop(0, '#2f8796');
    g.addColorStop(0.35, '#1b6472');
    g.addColorStop(0.75, '#0f4250');
    g.addColorStop(1, '#0a2f3a');
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);
    // soft light from the lamp
    const lg = x.createRadialGradient(W * 0.5, LY.surfY, 0, W * 0.5, LY.surfY, Math.max(W, H) * 0.7);
    lg.addColorStop(0, 'rgba(190,240,240,0.28)');
    lg.addColorStop(1, 'rgba(190,240,240,0)');
    x.fillStyle = lg;
    x.fillRect(0, 0, W, H);
    // distant, blurred background plants behind the glass
    const R = seeded(seed + 5);
    x.save();
    x.filter = `blur(${4 * S}px)`;
    for (let i = 0; i < W / 9; i++) {
      const bx = R() * W, bh = (0.15 + R() * 0.35) * H, bw = (4 + R() * 8) * S;
      const by = groundY(bx) + 6;
      x.fillStyle = `rgba(${20 + R() * 20},${70 + R() * 40},${50 + R() * 25},${0.35 + R() * 0.3})`;
      x.beginPath();
      x.moveTo(bx - bw, by);
      x.quadraticCurveTo(bx - bw * 0.2 + (R() - 0.5) * 30, by - bh * 0.6, bx + (R() - 0.5) * 40 * S, by - bh);
      x.quadraticCurveTo(bx + bw * 0.4, by - bh * 0.5, bx + bw, by);
      x.fill();
    }
    x.restore();
    // depth haze at the back
    const hz = x.createLinearGradient(0, H * 0.4, 0, H * 0.8);
    hz.addColorStop(0, 'rgba(20,90,100,0)'); hz.addColorStop(1, 'rgba(20,80,95,0.35)');
    x.fillStyle = hz; x.fillRect(0, 0, W, H);
    return L;
  }

  function rockShape(R, r) {
    const p1 = R() * 6, p2 = R() * 6, p3 = R() * 6;
    const pts = [];
    const N = 48;
    for (let i = 0; i <= N; i++) {
      const a = Math.PI + (i / N) * Math.PI;
      const k = 1 + 0.1 * Math.sin(2 * a + p1) + 0.07 * Math.sin(3 * a + p2) + 0.035 * Math.sin(7 * a + p3) + 0.015 * Math.sin(15 * a);
      pts.push([r.x + Math.cos(a) * r.w * 0.5 * k, r.y + Math.sin(a) * r.h * k]);
    }
    pts.push([r.x + r.w * 0.5, r.y + r.h * 0.1], [r.x - r.w * 0.5, r.y + r.h * 0.1]);
    return pts;
  }
  function drawRock(x, R, r, m) {
    const pts = rockShape(R, r);
    const path = new Path2D();
    pts.forEach(([a, b], i) => i ? path.lineTo(a, b) : path.moveTo(a, b));
    path.closePath();
    x.save();
    x.fillStyle = 'rgba(10,20,20,0.5)';
    x.filter = `blur(${8 * S}px)`;
    x.beginPath(); x.ellipse(r.x + r.w * 0.05, r.y + r.h * 0.05, r.w * 0.58, r.h * 0.14, 0, 0, TAU); x.fill();
    x.restore();
    x.save();
    x.clip(path);
    // rounded form: light from above-left, darker toward the rim and the base
    const g = x.createRadialGradient(r.x - r.w * 0.18, r.y - r.h * 0.75, r.h * 0.05, r.x, r.y - r.h * 0.35, Math.max(r.w * 0.62, r.h * 1.1));
    g.addColorStop(0, '#b9bdb6'); g.addColorStop(0.35, '#8b908a'); g.addColorStop(0.75, '#555a55'); g.addColorStop(1, '#262a28');
    x.fillStyle = g;
    x.fillRect(r.x - r.w, r.y - r.h * 1.3, r.w * 2, r.h * 1.6);
    // layered strata following the rock's shape, with pale veins
    for (let i = 0; i < 22; i++) {
      const f = R();
      const yy = r.y - r.h * f;
      const half = r.w * 0.5 * Math.sqrt(Math.max(0, 1 - f * f)) * 1.1;
      x.strokeStyle = R() < 0.45 ? `rgba(230,234,226,${0.1 + R() * 0.22})` : `rgba(18,22,20,${0.15 + R() * 0.25})`;
      x.lineWidth = (0.7 + R() * 2.4) * S;
      x.beginPath();
      x.moveTo(r.x - half, yy + r.h * 0.05);
      x.bezierCurveTo(r.x - half * 0.4, yy - r.h * (0.04 + R() * 0.06), r.x + half * 0.4, yy - r.h * (0.02 + R() * 0.06), r.x + half, yy + r.h * 0.04);
      x.stroke();
    }
    for (let i = 0; i < r.w * r.h * 0.03; i++) {
      x.fillStyle = R() < 0.5 ? 'rgba(255,255,250,0.13)' : 'rgba(0,0,0,0.16)';
      x.fillRect(r.x + (R() - 0.5) * r.w, r.y - R() * r.h * 1.1, (0.8 + R()) * S, (0.8 + R()) * S);
    }
    // patches of soft green algae on the lit top
    for (let i = 0; i < 6; i++) {
      const ax = r.x + (R() - 0.6) * r.w * 0.6, ay = r.y - r.h * (0.7 + R() * 0.35), ar = r.w * (0.08 + R() * 0.1);
      const ag = x.createRadialGradient(ax, ay, 0, ax, ay, ar);
      ag.addColorStop(0, 'rgba(95,135,60,0.35)'); ag.addColorStop(1, 'rgba(95,135,60,0)');
      x.fillStyle = ag; x.fillRect(ax - ar, ay - ar, ar * 2, ar * 2);
    }
    // occlusion where it sits in the gravel
    const sg = x.createLinearGradient(0, r.y - r.h * 0.35, 0, r.y + r.h * 0.1);
    sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,10,10,0.6)');
    x.fillStyle = sg; x.fillRect(r.x - r.w, r.y - r.h * 1.3, r.w * 2, r.h * 1.6);
    x.restore();
    m.save(); m.fillStyle = '#fff'; m.fill(path); m.restore();
  }
  // pebbles heaped against the base of rocks and wood so they sit in the gravel
  function pebbleBand(x, R, x0, x1, yTop, yBot) {
    const cols = ['#b9a98c', '#9c8b70', '#7d6f5a', '#c8bfae', '#6e6656', '#a39a8a', '#8b7d64', '#d6cdbb'];
    const cnt = Math.round((x1 - x0) * (yBot - yTop) * 0.06);
    const list = [];
    for (let i = 0; i < cnt; i++) {
      const px = x0 + R() * (x1 - x0), py = yTop + Math.pow(R(), 0.7) * (yBot - yTop);
      const gy = groundY(px), depth = clamp((py - gy) / (H - gy), 0, 1);
      list.push({ px, py, r: (1.4 + depth * 6 + R() * 2) * S, c: pick(cols), rot: R() * 3 });
    }
    list.sort((a, b) => a.py - b.py);
    for (const p of list) {
      x.fillStyle = 'rgba(15,12,8,0.45)';
      x.beginPath(); x.ellipse(p.px + p.r * 0.15, p.py + p.r * 0.25, p.r, p.r * 0.62, p.rot, 0, TAU); x.fill();
      const pg = x.createRadialGradient(p.px - p.r * 0.35, p.py - p.r * 0.35, p.r * 0.1, p.px, p.py, p.r);
      pg.addColorStop(0, shade(p.c, 0.2)); pg.addColorStop(1, shade(p.c, -0.35));
      x.fillStyle = pg;
      x.beginPath(); x.ellipse(p.px, p.py, p.r, p.r * 0.62, p.rot, 0, TAU); x.fill();
    }
  }

  function fernLeaf(x, px, py, len, ang, R) {
    x.save();
    x.translate(px, py);
    x.rotate(ang);
    const w = len * 0.16;
    const g = x.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, '#1f4a1e'); g.addColorStop(0.6, '#2f6a2a'); g.addColorStop(1, '#4f8a3a');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(0, 0);
    x.bezierCurveTo(len * 0.3, -w, len * 0.75, -w * 0.9, len, 0);
    x.bezierCurveTo(len * 0.75, w * 0.8, len * 0.3, w, 0, 0);
    x.fill();
    x.strokeStyle = 'rgba(160,200,120,0.45)'; x.lineWidth = 0.9 * S;
    x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(len * 0.5, -w * 0.1, len * 0.98, 0); x.stroke();
    x.strokeStyle = 'rgba(10,30,10,0.3)'; x.lineWidth = 0.5 * S;
    for (let k = 1; k < 8; k++) {
      const u = k / 8 * len;
      x.beginPath(); x.moveTo(u, 0); x.lineTo(u + w * 0.6, -w * 0.6); x.moveTo(u, 0); x.lineTo(u + w * 0.6, w * 0.6); x.stroke();
    }
    x.restore();
  }

  function drawWood(x, R, m) {
    const { x: wx, y: wy } = LY.wood;
    const s = Math.min(W, H * 1.4) / 1100;
    const branches = [
      [[wx - 160 * s, wy + 10 * s], [wx - 60 * s, wy - 10 * s], [wx + 10 * s, wy - 60 * s], [wx + 50 * s, wy - 190 * s], 34 * s, 16 * s],
      [[wx + 40 * s, wy - 150 * s], [wx + 70 * s, wy - 220 * s], [wx + 110 * s, wy - 260 * s], [wx + 170 * s, wy - 300 * s], 16 * s, 5 * s],
      [[wx + 45 * s, wy - 175 * s], [wx + 30 * s, wy - 240 * s], [wx + 5 * s, wy - 290 * s], [wx - 30 * s, wy - 330 * s], 13 * s, 4 * s],
      [[wx - 20 * s, wy - 40 * s], [wx - 80 * s, wy - 90 * s], [wx - 120 * s, wy - 120 * s], [wx - 180 * s, wy - 135 * s], 14 * s, 4 * s],
      [[wx - 60 * s, wy], [wx + 40 * s, wy + 10 * s], [wx + 120 * s, wy - 10 * s], [wx + 200 * s, wy - 40 * s], 22 * s, 8 * s]
    ];
    x.save();
    x.fillStyle = 'rgba(10,20,15,0.45)';
    x.filter = `blur(${7 * S}px)`;
    x.beginPath(); x.ellipse(wx, wy + 12 * s, 200 * s, 18 * s, 0, 0, TAU); x.fill();
    x.restore();
    for (const [p0, p1, p2, p3, w0, w1] of branches) {
      taper(x, p0, p1, p2, p3, w0, w1);
      const g = x.createLinearGradient(p0[0] - 60 * s, p0[1] - 60 * s, p0[0] + 60 * s, p0[1] + 60 * s);
      g.addColorStop(0, '#8a6a46'); g.addColorStop(0.5, '#5b4129'); g.addColorStop(1, '#2e2016');
      x.fillStyle = g;
      x.fill();
      m.save(); m.fillStyle = 'rgba(255,255,255,0.7)'; taper(m, p0, p1, p2, p3, w0, w1); m.fill(); m.restore();
      x.save();
      taper(x, p0, p1, p2, p3, w0, w1);
      x.clip();
      for (let i = 0; i < 40; i++) {
        const t = R(), off = (R() - 0.5) * 0.8;
        const px = cubic(p0[0], p1[0], p2[0], p3[0], t), py = cubic(p0[1], p1[1], p2[1], p3[1], t);
        x.strokeStyle = R() < 0.6 ? 'rgba(25,15,8,0.4)' : 'rgba(200,170,130,0.22)';
        x.lineWidth = (0.6 + R()) * S;
        x.beginPath();
        x.moveTo(px - 40 * s, py + off * w0);
        x.quadraticCurveTo(px, py + off * w0 + (R() - 0.5) * 4, px + 40 * s, py + off * w0);
        x.stroke();
      }
      x.restore();
    }
    // java fern growing on the wood
    const spots = [[wx + 30 * s, wy - 120 * s], [wx - 100 * s, wy - 100 * s], [wx + 120 * s, wy - 20 * s], [wx - 10 * s, wy - 40 * s]];
    for (const [fx, fy] of spots) {
      const cnt = 6 + Math.floor(R() * 5);
      for (let k = 0; k < cnt; k++) {
        const ang = -Math.PI / 2 + (R() - 0.5) * 2.2;
        fernLeaf(x, fx + (R() - 0.5) * 14 * s, fy, (55 + R() * 60) * s, ang, R);
      }
    }
  }

  function drawGravel(x, R, m) {
    // base bed
    const g = x.createLinearGradient(0, H * 0.72, 0, H);
    g.addColorStop(0, '#6e6250'); g.addColorStop(1, '#3d342a');
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 8) x.lineTo(px, groundY(px));
    x.lineTo(W, H); x.closePath(); x.fill();
    m.save(); m.fillStyle = 'rgba(255,255,255,0.85)';
    m.beginPath(); m.moveTo(0, H);
    for (let px = 0; px <= W; px += 8) m.lineTo(px, groundY(px));
    m.lineTo(W, H); m.closePath(); m.fill(); m.restore();
    // pebbles, larger toward the front glass
    const cols = ['#b9a98c', '#9c8b70', '#7d6f5a', '#c8bfae', '#6e6656', '#a39a8a', '#8b7d64', '#d6cdbb', '#5e5446'];
    const count = Math.round(W * (H - H * 0.74) * 0.09);
    const peb = [];
    for (let i = 0; i < count; i++) {
      const px = R() * W, gy = groundY(px), py = gy + Math.pow(R(), 0.8) * (H - gy + 6);
      const depth = clamp((py - gy) / (H - gy), 0, 1);
      peb.push({ px, py, r: (1.2 + depth * 6.5 + R() * 2) * S, c: pick(cols), rot: R() * 3 });
    }
    peb.sort((a, b) => a.py - b.py);
    for (const p of peb) {
      x.fillStyle = 'rgba(15,12,8,0.45)';
      x.beginPath(); x.ellipse(p.px + p.r * 0.15, p.py + p.r * 0.25, p.r, p.r * 0.62, p.rot, 0, TAU); x.fill();
      const pg = x.createRadialGradient(p.px - p.r * 0.35, p.py - p.r * 0.35, p.r * 0.1, p.px, p.py, p.r);
      pg.addColorStop(0, shade(p.c, 0.25)); pg.addColorStop(1, shade(p.c, -0.3));
      x.fillStyle = pg;
      x.beginPath(); x.ellipse(p.px, p.py, p.r, p.r * 0.62, p.rot, 0, TAU); x.fill();
    }
    // the front strip of gravel is a little darker (in shadow of the tank frame)
    const fg = x.createLinearGradient(0, H * 0.93, 0, H);
    fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,10,10,0.35)');
    x.fillStyle = fg; x.fillRect(0, H * 0.9, W, H * 0.1);
  }

  function drawCarpet(x, R) {
    // low carpet plants (tiny round leaves) in a few patches
    const patches = LY.narrow ? [[W * 0.55, 0.2]] : [[W * 0.52, 0.16], [W * 0.36, 0.1], [W * 0.76, 0.1]];
    for (const [cx, wf] of patches) {
      const pw = W * wf;
      for (let i = 0; i < pw * 3; i++) {
        const px = cx + (R() - 0.5) * pw * (0.6 + R() * 0.4);
        const gy = groundY(px), py = gy + R() * H * 0.06 * (1 - Math.abs(px - cx) / pw);
        const r = (1.6 + R() * 2.2) * S;
        const c = lerp3(hex('#3e8a2e'), hex('#9ad35a'), R());
        x.fillStyle = rgb(lerp3(c, [10, 30, 10], 0.25));
        x.beginPath(); x.ellipse(px + 0.6, py + 0.8, r, r * 0.6, R(), 0, TAU); x.fill();
        x.fillStyle = rgb(c);
        x.beginPath(); x.ellipse(px, py, r, r * 0.6, R(), 0, TAU); x.fill();
      }
    }
  }

  function drawAirstone(x, m) {
    const a = LY.airstone;
    // airline tubing up the back glass
    x.strokeStyle = 'rgba(200,230,230,0.25)'; x.lineWidth = 3 * S;
    x.beginPath(); x.moveTo(a.x, a.y - 8 * S); x.bezierCurveTo(a.x - 6 * S, H * 0.5, a.x - 12 * S, H * 0.3, a.x - 14 * S, LY.surfY - 4); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,0.18)'; x.lineWidth = 1 * S;
    x.beginPath(); x.moveTo(a.x - 1, a.y - 8 * S); x.bezierCurveTo(a.x - 7 * S, H * 0.5, a.x - 13 * S, H * 0.3, a.x - 15 * S, LY.surfY - 4); x.stroke();
    const g = x.createLinearGradient(a.x - 10 * S, 0, a.x + 10 * S, 0);
    g.addColorStop(0, '#5b6f7a'); g.addColorStop(0.4, '#9fb2bb'); g.addColorStop(1, '#3d4a52');
    x.fillStyle = g;
    x.beginPath(); x.ellipse(a.x, a.y, 11 * S, 6 * S, 0, 0, TAU); x.fill();
    x.fillRect(a.x - 11 * S, a.y - 12 * S, 22 * S, 12 * S);
    x.fillStyle = '#b8c8cf';
    x.beginPath(); x.ellipse(a.x, a.y - 12 * S, 11 * S, 4 * S, 0, 0, TAU); x.fill();
  }

  function renderHard() {
    const L = layer(), M = layer();
    const R = seeded(seed);
    drawGravel(L.x, R, M.x);
    drawCarpet(L.x, R);
    for (const r of LY.rocks) drawRock(L.x, R, r, M.x);
    drawWood(L.x, R, M.x);
    for (const r of LY.rocks) pebbleBand(L.x, R, r.x - r.w * 0.6, r.x + r.w * 0.6, r.y - r.h * 0.06, r.y + r.h * 0.28);
    { const s2 = Math.min(W, H * 1.4) / 1100, w0 = LY.wood; pebbleBand(L.x, R, w0.x - 190 * s2, w0.x + 210 * s2, w0.y - 4 * s2, w0.y + 30 * s2); }
    drawAirstone(L.x, M.x);
    // fade the caustic mask toward the front (less light reaches it)
    M.x.globalCompositeOperation = 'destination-in';
    const mg = M.x.createLinearGradient(0, H * 0.45, 0, H);
    mg.addColorStop(0, 'rgba(0,0,0,1)'); mg.addColorStop(1, 'rgba(0,0,0,0.45)');
    M.x.fillStyle = mg; M.x.fillRect(0, 0, W, H);
    return { L, M };
  }

  // a tileable caustic pattern (bright network of light focused by the rippling surface)
  function makeCausticTile(size = 256, cells = 16) {
    const R = seeded(11);
    const pts = [];
    for (let i = 0; i < cells; i++) pts.push([R() * size, R() * size]);
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const img = x.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      for (let xx = 0; xx < size; xx++) {
        let f1 = 1e9, f2 = 1e9;
        for (const [px, py] of pts) {
          let dx = Math.abs(xx - px), dy = Math.abs(y - py);
          if (dx > size / 2) dx = size - dx;
          if (dy > size / 2) dy = size - dy;
          const d = dx * dx + dy * dy;
          if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
        }
        const e = Math.sqrt(f2) - Math.sqrt(f1);
        let v = 1 - clamp(e / (size * 0.045), 0, 1);
        v = v * v * v;
        const i = (y * size + xx) * 4;
        img.data[i] = 225; img.data[i + 1] = 250; img.data[i + 2] = 255; img.data[i + 3] = Math.round(v * 255);
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  /* =========================================================
     Plants that move with the water
     ========================================================= */
  let vals = [], swords = [], stems = [];
  function setupPlants() {
    vals = [];
    const clumps = LY.narrow ? [[0, W * 0.25], [W * 0.82, W * 1.0]] : [[0, W * 0.12], [W * 0.27, W * 0.33], [W * 0.88, W * 1.0], [W * 0.72, W * 0.78]];
    for (const [a, b] of clumps) {
      const cnt = Math.round((b - a) / (3.2 * S));
      for (let i = 0; i < cnt; i++) {
        const x = rand(a, b);
        vals.push({
          x, base: groundY(x) + rand(4, 16) * S, h: rand(0.45, 0.68) * H, w: rand(5, 9) * S,
          ph: rand(0, TAU), lean: rand(-0.25, 0.25), sp: rand(0.6, 1.0),
          col: lerp3(hex('#3f7a2c'), hex('#7fb850'), Math.random()), z: Math.random()
        });
      }
    }
    vals.sort((a, b) => a.z - b.z);
    swords = LY.swords.map(sw => {
      const leaves = [];
      const cnt = 11;
      for (let i = 0; i < cnt; i++) {
        const a = -Math.PI / 2 + (i / (cnt - 1) - 0.5) * 2.3 + rand(-0.12, 0.12);
        leaves.push({ a, len: rand(110, 175) * S * sw.s * (1 - Math.abs(a + Math.PI / 2) * 0.22), w: rand(16, 24) * S * sw.s, ph: rand(0, TAU), stalk: rand(0.25, 0.4), shade: Math.random() });
      }
      leaves.sort((a, b) => a.shade - b.shade);
      return { x: sw.x, y: sw.y, leaves };
    });
    stems = [];
    for (const st of LY.stems) {
      for (let i = 0; i < st.n; i++) {
        const x = st.x + rand(-28, 28) * S;
        stems.push({ x, base: groundY(x) + rand(6, 14) * S, h: rand(0.3, 0.46) * H, ph: rand(0, TAU), lean: rand(-0.12, 0.12), nodes: Math.round(rand(14, 20)) });
      }
    }
  }

  let current = 0;
  function drawVal(v, t) {
    const pts = [];
    const N = 22;
    for (let j = 0; j <= N; j++) {
      const f = j / N;
      const sway = Math.sin(t * 0.8 * v.sp + v.ph - f * 2.4) * 16 * S * Math.pow(f, 1.4) + current * v.h * 0.07 * f * f;
      const tw = 0.4 + 0.6 * Math.abs(Math.cos(f * 4 + v.ph + t * 0.4));
      pts.push([v.x + v.lean * v.h * 0.25 * f + sway, v.base - v.h * f, v.w * (1 - f * 0.35) * tw * 0.5]);
    }
    const g = ctx.createLinearGradient(0, v.base, 0, v.base - v.h);
    g.addColorStop(0, rgb(lerp3(v.col, [20, 40, 20], 0.5)));
    g.addColorStop(0.6, rgb(v.col));
    g.addColorStop(1, rgb(lerp3(v.col, [190, 230, 140], 0.35), 0.85));
    ctx.fillStyle = g;
    ctx.beginPath();
    pts.forEach(([x, y, w], i) => i ? ctx.lineTo(x - w, y) : ctx.moveTo(x - w, y));
    for (let j = pts.length - 1; j >= 0; j--) ctx.lineTo(pts[j][0] + pts[j][2], pts[j][1]);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,255,200,0.15)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  }

  function drawSword(sw, t) {
    for (const l of sw.leaves) {
      const sway = Math.sin(t * 0.7 + l.ph) * 0.05 + current * 0.04;
      const a = l.a + sway;
      ctx.save();
      ctx.translate(sw.x, sw.y);
      ctx.rotate(a + Math.PI / 2);
      const len = l.len, w = l.w, st = len * l.stalk;
      // stalk
      ctx.strokeStyle = '#3d6e2a'; ctx.lineWidth = 2.2 * S; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(w * 0.1, -st * 0.5, 0, -st); ctx.stroke();
      // blade, curving gently under its own weight
      const bend = Math.sign(Math.sin(l.a + Math.PI / 2)) * len * 0.08;
      const tipX = bend, tipY = -len;
      const g = ctx.createLinearGradient(-w, 0, w, 0);
      const base = lerp3(hex('#2e6a24'), hex('#5ea33c'), l.shade);
      g.addColorStop(0, rgb(lerp3(base, [10, 30, 10], 0.35)));
      g.addColorStop(0.5, rgb(base));
      g.addColorStop(1, rgb(lerp3(base, [170, 220, 120], 0.25)));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -st);
      ctx.bezierCurveTo(w, -st - (len - st) * 0.2, w * 0.9 + bend * 0.5, -st - (len - st) * 0.75, tipX, tipY);
      ctx.bezierCurveTo(-w * 0.9 + bend * 0.5, -st - (len - st) * 0.75, -w, -st - (len - st) * 0.2, 0, -st);
      ctx.fill();
      // midrib and curved side veins
      ctx.strokeStyle = 'rgba(200,240,170,0.45)'; ctx.lineWidth = 1.2 * S;
      ctx.beginPath(); ctx.moveTo(0, -st); ctx.quadraticCurveTo(bend * 0.4, -st - (len - st) * 0.5, tipX, tipY); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,240,170,0.18)'; ctx.lineWidth = 0.7 * S;
      for (const side of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(0, -st - 2);
        ctx.bezierCurveTo(side * w * 0.6, -st - (len - st) * 0.3, side * w * 0.45 + bend * 0.4, -st - (len - st) * 0.7, tipX * 0.9, tipY * 0.97);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawStem(s0, t) {
    const pts = [];
    for (let j = 0; j <= s0.nodes; j++) {
      const f = j / s0.nodes;
      const sway = Math.sin(t * 0.7 + s0.ph - f * 1.6) * 7 * S * f * f + current * s0.h * 0.04 * f * f;
      pts.push([s0.x + s0.lean * s0.h * f + sway, s0.base - s0.h * f]);
    }
    ctx.strokeStyle = '#6a4a3a'; ctx.lineWidth = 1.8 * S; ctx.lineCap = 'round';
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    for (let j = 1; j <= s0.nodes; j++) {
      const f = j / s0.nodes;
      const [x, y] = pts[j];
      const col = lerp3(hex('#4f8a36'), hex('#d0483c'), clamp((f - 0.35) * 1.6, 0, 1));
      const len = (11 + 5 * Math.sin(f * 3)) * S * (1 - f * 0.25);
      for (const side of [-1, 1]) {
        const a = side * (0.95 + 0.25 * Math.sin(t * 0.9 + j + s0.ph)) - Math.PI / 2 + side * f * 0.2;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(a + Math.PI / 2);
        const g = ctx.createLinearGradient(0, 0, 0, -len);
        g.addColorStop(0, rgb(lerp3(col, [30, 20, 15], 0.3)));
        g.addColorStop(1, rgb(lerp3(col, [255, 200, 180], 0.15)));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0, -len * 0.5, len * 0.22, len * 0.5, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,220,200,0.25)'; ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len * 0.95); ctx.stroke();
        ctx.restore();
      }
    }
  }

  /* =========================================================
     Fish and the turtle
     ========================================================= */
  const SP = {
    neon:  { len: 36, speed: [1.2, 1.9], turn: 0.18 },
    angel: { len: 78, speed: [0.35, 0.6], turn: 0.05 },
    guppy: { len: 42, speed: [0.9, 1.5], turn: 0.12 },
    cory:  { len: 62, speed: [0.5, 0.9], turn: 0.1 },
    turtle:{ len: 150, speed: [0.45, 0.7], turn: 0.025 }
  };
  let creatures = [], bubbles = [], specks = [], rays = [], school = { tx: 0, ty: 0, timer: 0 };

  const swimTop = () => LY.surfY + H * 0.05;
  const swimBottom = x => groundY(x) - 12 * S;

  function makeCreature(kind, extra = {}) {
    const sp = SP[kind];
    const z = extra.z != null ? extra.z : rand(0.3, 1);
    const c = {
      kind, z, x: rand(W * 0.1, W * 0.9), y: rand(H * 0.2, H * 0.6), vx: rand(-1, 1), vy: 0,
      size: sp.len * S * (0.65 + 0.45 * z) * rand(0.9, 1.1), speed: rand(...sp.speed) * Math.max(0.7, S),
      theta: Math.random() < 0.5 ? 0 : Math.PI, phase: rand(0, TAU), tx: 0, ty: 0, wait: 0, mode: 'swim', timer: rand(4, 10),
      ...extra
    };
    if (kind === 'guppy') { c.variant = Math.random() < 0.5 ? 0 : 1; c.palette = c.variant ? ['#3aa0ff', '#6a3aff', '#2ee0ff'] : ['#ff7a1a', '#ff2e3a', '#ffd04a']; }
    if (kind === 'cory') { c.y = rand(groundY(c.x) + 10 * S, H - 30 * S); c.z = clamp((c.y - groundY(c.x)) / (H - groundY(c.x)), 0, 1) * 0.5 + 0.5; }
    pickTarget(c);
    return c;
  }
  function pickTarget(c) {
    if (c.kind === 'cory') {
      c.tx = clamp(c.x + rand(-W * 0.3, W * 0.3), 30, W - 30);
      c.ty = clamp(rand(groundY(c.tx) + 8 * S, H - 24 * S), 0, H);
    } else {
      c.tx = rand(W * 0.06, W * 0.94);
      c.ty = rand(swimTop() + c.size * 0.3, swimBottom(c.tx) - c.size * 0.4);
    }
  }

  function setupCreatures() {
    creatures = [];
    const neons = LY.narrow ? 14 : 22;
    const sz = rand(0.5, 0.85);
    for (let i = 0; i < neons; i++) creatures.push(makeCreature('neon', { z: clamp(sz + rand(-0.12, 0.12), 0.3, 1), x: W * 0.5 + rand(-60, 60), y: H * 0.45 + rand(-40, 40) }));
    for (let i = 0; i < 2; i++) creatures.push(makeCreature('angel', { z: rand(0.55, 0.95) }));
    for (let i = 0; i < (LY.narrow ? 3 : 5); i++) creatures.push(makeCreature('guppy'));
    for (let i = 0; i < 3; i++) creatures.push(makeCreature('cory'));
    creatures.push(makeCreature('turtle', { z: 0.95, y: H * 0.5 }));
    school.tx = W * 0.5; school.ty = H * 0.45; school.timer = 0;
  }

  function steerTo(c, tx, ty, sp, k, ease = 0.03) {
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy) || 1;
    const arrive = Math.min(1, d / 60);
    c.vx += (dx / d * sp * arrive - c.vx) * ease * k;
    c.vy += (dy / d * sp * arrive * 0.6 - c.vy) * ease * k;
    return d;
  }

  function updateCreature(c, k, t, dt) {
    const sp = SP[c.kind];
    if (c.kind === 'neon') {
      // schooling: stay together, keep a little space, swim the same way
      let cx = 0, cy = 0, ax = 0, ay = 0, sx = 0, sy = 0, cnt = 0;
      for (const o of creatures) {
        if (o === c || o.kind !== 'neon') continue;
        const dx = o.x - c.x, dy = o.y - c.y, d = Math.hypot(dx, dy);
        if (d < 120 * S) { cx += o.x; cy += o.y; ax += o.vx; ay += o.vy; cnt++; }
        if (d < 16 * S && d > 0) { sx -= dx / d; sy -= dy / d; }
      }
      let dvx = 0, dvy = 0;
      if (cnt) { dvx += ((cx / cnt) - c.x) * 0.004 + (ax / cnt - c.vx) * 0.06; dvy += ((cy / cnt) - c.y) * 0.004 + (ay / cnt - c.vy) * 0.06; }
      const tdx = school.tx - c.x, tdy = school.ty - c.y, td = Math.hypot(tdx, tdy) || 1;
      dvx += tdx / td * 0.05 + sx * 0.12 + rand(-0.03, 0.03);
      dvy += tdy / td * 0.035 + sy * 0.12 + rand(-0.03, 0.03);
      c.vx += dvx * k; c.vy += dvy * k;
      const s = Math.hypot(c.vx, c.vy), max = c.speed, min = c.speed * 0.45;
      if (s > max) { c.vx *= max / s; c.vy *= max / s; }
      if (s < min && s > 0) { c.vx *= min / s; c.vy *= min / s; }
    } else if (c.kind === 'turtle') {
      c.timer -= dt;
      if (c.mode === 'swim') {
        const d = steerTo(c, c.tx, c.ty, c.speed, k, 0.015);
        if (d < 30) pickTarget(c);
        if (c.timer <= 0) {
          const r = Math.random();
          c.mode = r < 0.4 ? 'air' : r < 0.75 ? 'rest' : 'swim';
          c.timer = rand(8, 16);
          if (c.mode === 'air') { c.tx = clamp(c.x + rand(-200, 200), W * 0.1, W * 0.9); c.ty = LY.surfY + c.size * 0.12; }
          if (c.mode === 'rest') { c.tx = clamp(c.x + rand(-250, 250), W * 0.1, W * 0.9); c.ty = groundY(c.tx) - c.size * 0.12; }
          if (c.mode === 'swim') pickTarget(c);
        }
      } else {
        const d = steerTo(c, c.tx, c.ty, c.speed * 0.9, k, 0.015);
        if (d < 12) { c.vx *= Math.pow(0.9, k); c.vy *= Math.pow(0.9, k); c.still = Math.min(1, (c.still || 0) + dt * 0.8); }
        if (c.timer <= 0) { c.mode = 'swim'; c.still = 0; c.timer = rand(10, 20); pickTarget(c); }
      }
      if (c.mode !== 'rest' && c.mode !== 'air') c.still = Math.max(0, (c.still || 0) - dt);
    } else {
      if (c.wait > 0) {
        c.wait -= dt;
        c.vx *= Math.pow(0.95, k); c.vy *= Math.pow(0.95, k);
      } else {
        const d = steerTo(c, c.tx, c.ty, c.speed, k, c.kind === 'angel' ? 0.012 : 0.04);
        if (d < 14) {
          c.wait = c.kind === 'angel' ? rand(1.5, 5) : c.kind === 'cory' ? rand(1.5, 4) : rand(0.2, 1.2);
          pickTarget(c);
        }
      }
    }
    c.x += c.vx * k; c.y += c.vy * k;
    // keep inside the tank
    const top = c.kind === 'turtle' && c.mode === 'air' ? LY.surfY + c.size * 0.1 : swimTop();
    const bottom = c.kind === 'cory' ? H - 18 * S : swimBottom(c.x) - (c.kind === 'turtle' ? c.size * 0.1 : 0);
    if (c.y < top) { c.y = top; c.vy = Math.abs(c.vy) * 0.3; }
    if (c.y > bottom) { c.y = bottom; c.vy = -Math.abs(c.vy) * 0.3; }
    if (c.x < 20) { c.x = 20; c.vx = Math.abs(c.vx); }
    if (c.x > W - 20) { c.x = W - 20; c.vx = -Math.abs(c.vx); }
    // turn around smoothly (passes through a head-on view instead of flipping flat)
    if (c.vx > 0.08) c.thetaT = 0; else if (c.vx < -0.08) c.thetaT = Math.PI;
    if (c.thetaT != null) {
      const dTh = c.thetaT - c.theta;
      c.theta += Math.sign(dTh) * Math.min(Math.abs(dTh), sp.turn * k);
    }
    const sp2 = Math.hypot(c.vx, c.vy);
    c.phase += (c.kind === 'turtle' ? (0.05 + sp2 * 0.05) * (1 - (c.still || 0)) : 0.12 + sp2 * 0.22) * k;
  }

  /* ---------- drawing each species (local space: nose toward +x, length about 1) ---------- */
  function tailXform(x, px, phase, amt = 1) {
    x.translate(px, 0);
    x.transform(0.62 + 0.38 * Math.abs(Math.cos(phase)), Math.sin(phase) * 0.14 * amt, 0, 1, 0, 0);
  }

  // realistic skin detail inside a fish body: overlapping scales, a sheen along the flank, the gill cover

    x.save();

        const shift = (Math.round((o.x1 - px) / (d * 0.75)) % 2) * d * 0.5;
        for (let py = o.y0 + shift; py < o.y1; py += d) {

          const a0 = -Math.PI * 0.4;
          light.moveTo(px - d * 0.08 + Math.cos(a0) * d * 0.45, py + Math.sin(a0) * d * 0.45);
          light.arc(px - d * 0.08, py, d * 0.45, a0, Math.PI * 0.1, true);
        }

      x.lineWidth = d * 0.12;
      x.strokeStyle = 'rgba(0,0,0,0.16)'; x.stroke(dark);
      x.strokeStyle = 'rgba(255,255,255,0.12)'; x.stroke(light);
    }
    const sy = o.y0 + (o.y1 - o.y0) * 0.36;
    const sh = x.createLinearGradient(0, sy - d * 1.2, 0, sy + d * 1.2);
    sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, 'rgba(255,255,255,0.28)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = sh; x.fillRect(o.x0, sy - d * 1.2, o.x1 - o.x0 + 1, d * 2.4);
    const dg = x.createLinearGradient(0, o.y0, 0, o.y1);
    dg.addColorStop(0, 'rgba(0,0,0,0.3)'); dg.addColorStop(0.35, 'rgba(0,0,0,0)'); dg.addColorStop(0.8, 'rgba(255,255,255,0.08)'); dg.addColorStop(1, 'rgba(0,0,0,0.15)');
    x.fillStyle = dg; x.fillRect(o.x0 - 0.1, o.y0, o.x1 - o.x0 + 0.6, o.y1 - o.y0);

      x.beginPath(); x.arc(o.gill + 0.12, 0, 0.14 * (o.y1 - o.y0) / 0.3, Math.PI * 0.65, Math.PI * 1.35); x.stroke();

  function drawTurtle(x, c) {
    const still = c.still || 0;

    };

    leg(0.28, 0.06, 0.9 + Math.sin(ph) * 0.6 * paddle, 0.22, 0.09, true);

    x.fillStyle = '#3a4519';
    x.beginPath(); x.moveTo(-0.44, 0.02); x.quadraticCurveTo(-0.56, 0.06, -0.6, 0.1); x.quadraticCurveTo(-0.52, 0.08, -0.42, 0.07); x.fill();
    // neck and head
    const hx = 0.66, hy = -0.01 + Math.sin(ph * 0.5) * 0.008;
    x.fillStyle = skin;
    x.beginPath(); x.moveTo(0.38, -0.08); x.quadraticCurveTo(0.52, -0.08, hx - 0.06, hy - 0.06); x.lineTo(hx - 0.06, hy + 0.06); x.quadraticCurveTo(0.52, 0.09, 0.38, 0.1); x.closePath(); x.fill();
    x.save(); x.translate(0.4, 0.0); stripes(0.25, 0.14); x.restore();
    x.fillStyle = skin;
    x.beginPath(); x.ellipse(hx, hy, 0.11, 0.072, 0.05, 0, TAU); x.fill();
    const hg = x.createRadialGradient(hx - 0.02, hy - 0.04, 0.005, hx, hy, 0.11);

    for (let i = -2; i <= 2; i++) { x.beginPath(); x.moveTo(hx - 0.12, hy + i * 0.022); x.quadraticCurveTo(hx, hy + i * 0.024 - 0.005, hx + 0.12, hy + i * 0.012 + 0.01); x.stroke(); }
    x.fillStyle = '#c42f1c';

    x.beginPath(); x.moveTo(hx + 0.1, hy + 0.02); x.quadraticCurveTo(hx + 0.04, hy + 0.035, hx - 0.01, hy + 0.028); x.stroke();

  const DRAW = { neon: drawNeon, angel: drawAngel, guppy: drawGuppy, cory: drawCory, turtle: drawTurtle };

  /* =========================================================
     3D creatures: modelled and lit in WebGL, pre-rendered into
     sprite sheets (turning angles x swimming frames)
     ========================================================= */
  const NY = 9, NP = 8;   // turning angles (facing right ... head-on ... facing left), swim frames
  const MODELS = {
    neon:   { id: 0, w: 1.45, top: 0.36, h: 0.72 },
    angel:  { id: 1, w: 1.3, top: 1.08, h: 2.16 },
    guppy:  { id: 2, w: 1.45, top: 0.36, h: 0.72, vars: 2 },
    cory:   { id: 3, w: 1.3, top: 0.42, h: 0.8 },

  let atlas3D = null;

  const CREATURE_FS = `
precision highp float;
uniform vec2 uRes;
uniform vec4 uBox;
uniform float uSp;
uniform float uYaw;
uniform float uPh;
uniform float uVar;

float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float sdE(vec3 p, vec3 r) { float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-5); }
float sdCap(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdRC(vec3 p, vec3 a, vec3 b, float r1, float r2) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - mix(r1, r2, h); }
vec2 r2(vec2 v, float a) { float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

// fish body: elliptical cross-sections along its length, thickest just behind the head
float fishBody(vec3 p, float x0, float x1, float mh, float mw, float ped, float drop) {
  float s = clamp((p.x - x0) / (x1 - x0), 0.0, 1.0);
  float sp = pow(max(sin(3.14159 * pow(s, 1.12)), 0.0), 0.62);
  float hh = max(ped * (1.0 - s) + mh * sp, 0.012);
  float ww = max(ped * 0.6 * (1.0 - s) + mw * sp, 0.01);
  float yc = drop * sin(3.14159 * s);
  float d = (length(vec2((p.y - yc) / hh, p.z / ww)) - 1.0) * min(hh, ww);
  return max(d, max(x0 - p.x, p.x - x1));
}
// a thin fin: a flat ellipse in the fish's side plane, tilted by ang
float fin(vec3 p, vec3 c, float ang, vec2 r, float th) {
  vec3 q = p - c;
  q.xy = r2(q.xy, -ang);
  return sdE(q, vec3(r.x, r.y, th));
}

vec3 toLocal(vec3 w) {
  float c = cos(uYaw), s = sin(uYaw);
  return vec3(c * w.x - s * w.z, w.y, s * w.x + c * w.z);
}

// returns distance and material: 1 body, 2 fin, 3 eye, 4 shell, 5 skin, 6 filament
vec2 map(vec3 w) {
  vec3 p = toLocal(w);
  int sp = int(uSp + 0.5);
  if (sp == 4) {
    // ---- turtle ----
    float dome = sdE(p - vec3(0.0, -0.02, 0.0), vec3(0.5, 0.25, 0.38));
    dome = max(dome, -(p.y + 0.035));
    float plas = sdE(p - vec3(0.0, -0.045, 0.0), vec3(0.47, 0.07, 0.35));
    float shell = smin(dome, plas, 0.025);
    float skin = smin(sdE(p - vec3(0.67, 0.0, 0.0), vec3(0.11, 0.075, 0.08)), sdCap(p, vec3(0.38, -0.025, 0.0), vec3(0.6, -0.005, 0.0), 0.062), 0.04);
    for (int i = 0; i < 4; i++) {
      float fi = float(i);
      float side = mod(fi, 2.0) < 0.5 ? 1.0 : -1.0;
      bool front = i < 2;
      float a = sin(uPh + (front ? 0.0 : 3.14159) + (side > 0.0 ? 0.0 : 3.14159));
      vec3 sh = front ? vec3(0.27, -0.06, side * 0.27) : vec3(-0.3, -0.06, side * 0.25);
      vec3 ft = sh + (front ? vec3(0.07 + 0.11 * a, -0.05, side * 0.2) : vec3(-0.1 + 0.07 * a, -0.04, side * 0.15));
      float leg = sdRC(p, sh, ft, 0.055, 0.04);
      vec3 q = p - ft;
      q.xz = r2(q.xz, side * (front ? 0.5 : -0.3) + a * 0.4);
      leg = smin(leg, sdE(q, vec3(front ? 0.09 : 0.07, 0.018, 0.06)), 0.03);
      skin = smin(skin, leg, 0.02);
    }
    skin = smin(skin, sdCap(p, vec3(-0.45, -0.045, 0.0), vec3(-0.6, -0.07, 0.0), 0.022), 0.02);
    vec3 e = vec3(0.715, 0.018, 0.062);
    float eye = length(vec3(p.x, p.y, abs(p.z)) - e) - 0.018;
    vec2 r = shell < skin ? vec2(shell, 4.0) : vec2(skin, 5.0);
    if (eye < r.x) r = vec2(eye, 3.0);
    return r;
  }
  // ---- fish: the body bends from behind the head to the tail as it swims ----
  float xh = 0.15, xt = -0.6, amp = 0.06;
  if (sp == 1) { amp = 0.03; xt = -0.55; }
  if (sp == 2) amp = 0.075;
  if (sp == 3) amp = 0.045;
  float bw = clamp((xh - p.x) / (xh - xt), 0.0, 1.0);
  p.z -= amp * bw * bw * sin(uPh - 3.0 * bw);
  vec3 pa = vec3(p.x, p.y, abs(p.z));
  float body, fins, eye, fil = 1e3;
  if (sp == 0) {
    body = fishBody(p, -0.34, 0.5, 0.135, 0.068, 0.034, 0.0);
    fins = fin(p, vec3(-0.41, 0.04, 0.0), 0.45, vec2(0.11, 0.035), 0.006);
    fins = min(fins, fin(p, vec3(-0.41, -0.04, 0.0), -0.45, vec2(0.11, 0.035), 0.006));
    fins = min(fins, fin(p, vec3(-0.34, 0.0, 0.0), 0.0, vec2(0.05, 0.04), 0.006));
    fins = min(fins, fin(p, vec3(-0.04, 0.15, 0.0), 0.5, vec2(0.055, 0.04), 0.005));
    fins = min(fins, fin(p, vec3(-0.12, -0.12, 0.0), -0.35, vec2(0.11, 0.028), 0.005));
    fins = min(fins, fin(pa, vec3(0.25, -0.04, 0.07), 0.6, vec2(0.05, 0.018), 0.004));
    eye = length(pa - vec3(0.38, 0.012, 0.04)) - 0.038;
  } else if (sp == 1) {
    body = fishBody(p, -0.27, 0.35, 0.33, 0.055, 0.07, 0.0);
    fins = fin(p, vec3(-0.08, 0.46, 0.0), 0.52, vec2(0.15, 0.42), 0.006);
    fins = min(fins, fin(p, vec3(-0.18, 0.75, 0.0), 0.62, vec2(0.05, 0.3), 0.005));
    fins = min(fins, fin(p, vec3(-0.08, -0.48, 0.0), -0.52, vec2(0.15, 0.44), 0.006));
    fins = min(fins, fin(p, vec3(-0.18, -0.78, 0.0), -0.62, vec2(0.05, 0.3), 0.005));
    fins = min(fins, fin(p, vec3(-0.4, 0.0, 0.0), 0.0, vec2(0.14, 0.2), 0.006));
    fins = min(fins, fin(p, vec3(-0.52, 0.2, 0.0), 0.7, vec2(0.12, 0.02), 0.005));
    fins = min(fins, fin(p, vec3(-0.52, -0.2, 0.0), -0.7, vec2(0.12, 0.02), 0.005));
    fins = min(fins, fin(pa, vec3(0.12, -0.02, 0.05), 0.7, vec2(0.07, 0.025), 0.004));
    fil = sdCap(pa, vec3(0.11, -0.22, 0.012), vec3(-0.05 + 0.04 * sin(uPh * 0.5), -0.95, 0.02), 0.007);
    eye = length(pa - vec3(0.22, 0.06, 0.04)) - 0.042;
  } else if (sp == 2) {
    body = fishBody(p, -0.14, 0.42, 0.1, 0.052, 0.03, -0.01);
    fins = fin(p, vec3(-0.4, 0.0, 0.0), 0.0, vec2(0.22, 0.22), 0.006);
    fins = smin(fins, fin(p, vec3(-0.22, 0.0, 0.0), 0.0, vec2(0.12, 0.08), 0.006), 0.05);
    fins = min(fins, fin(p, vec3(-0.08, 0.13, 0.0), 0.55, vec2(0.13, 0.03), 0.005));
    fins = min(fins, fin(pa, vec3(0.22, -0.03, 0.05), 0.6, vec2(0.04, 0.015), 0.004));
    eye = length(pa - vec3(0.34, 0.015, 0.034)) - 0.032;
  } else {
    body = fishBody(p, -0.33, 0.48, 0.15, 0.1, 0.05, -0.02);
    body = smin(body, sdE(p - vec3(0.2, 0.05, 0.0), vec3(0.22, 0.12, 0.09)), 0.05);
    fins = fin(p, vec3(-0.42, 0.055, 0.0), 0.55, vec2(0.11, 0.035), 0.006);
    fins = min(fins, fin(p, vec3(-0.42, -0.055, 0.0), -0.55, vec2(0.11, 0.035), 0.006));
    fins = min(fins, fin(p, vec3(0.02, 0.19, 0.0), 0.35, vec2(0.08, 0.12), 0.006));
    fins = min(fins, fin(pa, vec3(0.22, -0.1, 0.09), 0.3, vec2(0.08, 0.02), 0.005));
    fil = sdCap(pa, vec3(0.46, -0.02, 0.02), vec3(0.47, -0.1, 0.04), 0.008);
    eye = length(pa - vec3(0.3, 0.07, 0.065)) - 0.04;
  }
  vec2 r = vec2(body, 1.0);
  if (fins < r.x) r = vec2(fins, 2.0);
  if (fil < r.x) r = vec2(fil, 6.0);
  if (eye < r.x) r = vec2(eye, 3.0);
  return r;
}

vec3 calcN(vec3 p) {
  const vec2 k = vec2(1.0, -1.0);
  float e = 0.0025;
  return normalize(k.xyy * map(p + k.xyy * e).x + k.yyx * map(p + k.yyx * e).x + k.yxy * map(p + k.yxy * e).x + k.xxx * map(p + k.xxx * e).x);
}

// colour and opacity of each surface, from the point in the animal's own space
vec4 surface(vec3 q, float m, vec3 n) {
  int sp = int(uSp + 0.5);
  float back = smoothstep(-0.05, 0.08, q.y);
  if (m > 2.5 && m < 3.5) {
    float ring = smoothstep(0.012, 0.02, length(q.xy - vec2(0.0)));
    if (sp == 1) return vec4(0.55, 0.08, 0.05, 1.0);
    if (sp == 4) return vec4(0.6, 0.5, 0.1, 1.0);
    return vec4(0.65, 0.68, 0.7, 1.0);
  }
  if (sp == 4) {
    if (m > 3.5 && m < 4.5) {
      if (q.y < -0.03) return vec4(0.72, 0.62, 0.28, 1.0) * (0.75 + 0.25 * noise(q * 30.0));
      float z = abs(q.z), x = q.x, sd = 1.0;
      if (z < 0.11) { sd = min(min(abs(x + 0.32), abs(x + 0.12)), min(abs(x - 0.08), abs(x - 0.28))); sd = min(sd, abs(z - 0.11)); }
      else if (z < 0.29 && q.y > 0.02) { sd = min(min(abs(x + 0.24), abs(x)), abs(x - 0.24)); sd = min(sd, min(abs(z - 0.11), abs(z - 0.29))); }
      else { sd = abs(mod(x + 0.5, 0.09) - 0.045); sd = 0.045 - sd; sd = min(sd, abs(z - 0.29)); }
      float seam = 1.0 - smoothstep(0.004, 0.012, sd);
      vec3 c = mix(vec3(0.24, 0.28, 0.1), vec3(0.36, 0.4, 0.16), noise(q * 9.0));
      float lines = smoothstep(0.82, 0.96, abs(sin(noise(q * 14.0) * 14.0)));
      c = mix(c, vec3(0.62, 0.58, 0.2), lines * 0.55);
      c = mix(c, vec3(0.06, 0.07, 0.03), seam);
      return vec4(c, 1.0);
    }
    vec3 c = mix(vec3(0.14, 0.2, 0.07), vec3(0.24, 0.3, 0.1), noise(q * 20.0));
    float st = smoothstep(0.55, 0.85, sin((q.y * 1.3 + abs(q.z) * 0.5) * 95.0));
    c = mix(c, vec3(0.72, 0.66, 0.2), st * 0.85);
    float ear = 1.0 - smoothstep(0.022, 0.034, length(vec2(q.x - 0.6, q.y - 0.005)));
    c = mix(c, vec3(0.72, 0.1, 0.05), ear * step(0.05, abs(q.z)));
    return vec4(c, 1.0);
  }
  if (m > 5.5) return vec4(0.92, 0.92, 0.9, 0.75);
  if (sp == 0) {
    vec3 c = mix(vec3(0.82, 0.85, 0.86), vec3(0.32, 0.37, 0.33), back);
    float sy = 0.012 + 0.03 * (q.x + 0.3) / 0.7;
    float blue = (1.0 - smoothstep(0.012, 0.024, abs(q.y - sy))) * step(-0.32, q.x) * (1.0 - step(0.42, q.x));
    float red = (1.0 - smoothstep(-0.015, 0.0, q.y - (sy - 0.022))) * (1.0 - smoothstep(0.03, 0.09, q.x));
    c = mix(c, vec3(0.92, 0.08, 0.1), red * 0.95);
    float fres = pow(1.0 - abs(n.z), 2.0);
    c = mix(c, mix(vec3(0.05, 0.55, 1.0), vec3(0.35, 1.0, 1.0), fres), blue);
    if (m > 1.5) return vec4(0.85, 0.9, 0.92, 0.45);
    return vec4(c, 1.0);
  }
  if (sp == 1) {
    vec3 c = mix(vec3(0.86, 0.87, 0.84), vec3(0.66, 0.64, 0.55), back * 0.6);
    float bands = 0.0;
    bands = max(bands, 1.0 - smoothstep(0.022, 0.04, abs(q.x - 0.22)));
    bands = max(bands, 1.0 - smoothstep(0.03, 0.05, abs(q.x - 0.0)));
    bands = max(bands, 1.0 - smoothstep(0.022, 0.04, abs(q.x + 0.2)));
    if (m > 1.5) {
      float a = 0.55 + bands * 0.3;
      return vec4(mix(vec3(0.82, 0.84, 0.85), vec3(0.1, 0.1, 0.11), bands * 0.7), a);
    }
    c = mix(c, vec3(0.05, 0.05, 0.06), bands * 0.9);
    return vec4(c, 1.0);
  }
  if (sp == 2) {
    vec3 t1 = uVar < 0.5 ? vec3(1.0, 0.5, 0.08) : vec3(0.2, 0.55, 1.0);
    vec3 t2 = uVar < 0.5 ? vec3(0.95, 0.12, 0.18) : vec3(0.5, 0.15, 0.95);
    if (m > 1.5) {
      float k = clamp((-q.x - 0.1) / 0.5, 0.0, 1.0);
      vec3 c = mix(t1, t2, k);
      float spots = smoothstep(0.74, 0.8, noise(q * 40.0 + uVar * 7.0));
      c = mix(c, vec3(0.05, 0.03, 0.06), spots * 0.8);
      if (q.x > -0.15 && q.y > 0.08) c = t1;
      return vec4(c, 0.82);
    }
    vec3 c = mix(vec3(0.85, 0.86, 0.8), vec3(0.5, 0.55, 0.45), back);
    float patch = 1.0 - smoothstep(0.03, 0.06, length(q.xy - vec2(0.02, 0.0)));
    c = mix(c, t1, patch * 0.7);
    float patch2 = 1.0 - smoothstep(0.02, 0.04, length(q.xy - vec2(0.14, 0.0)));
    c = mix(c, vec3(0.3, 0.8, 1.0), patch2 * 0.6);
    return vec4(c, 1.0);
  }
  // corydoras
  if (m > 1.5) {
    float dots = smoothstep(0.7, 0.8, noise(q * 40.0));
    return vec4(mix(vec3(0.85, 0.82, 0.72), vec3(0.2, 0.18, 0.12), dots), 0.42);
  }
  vec3 c = mix(vec3(0.86, 0.8, 0.66), vec3(0.34, 0.36, 0.25), back);
  c = mix(c, vec3(0.25, 0.5, 0.38), smoothstep(0.0, 0.06, q.y) * (1.0 - smoothstep(0.06, 0.12, q.y)) * 0.5);
  float spots = smoothstep(0.66, 0.76, noise(q * 28.0)) * back;
  c = mix(c, vec3(0.12, 0.11, 0.08), spots * 0.8);
  float plates = smoothstep(0.92, 0.99, abs(sin(q.x * 70.0 + q.y * 8.0))) * 0.25;
  return vec4(c * (1.0 - plates), 1.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 ro = vec3(uBox.x + uv.x * uBox.z, uBox.y - (1.0 - uv.y) * uBox.w, -3.0);
  vec3 rd = vec3(0.0, 0.0, 1.0);
  float t = 1.5, hit = 0.0;
  vec2 m = vec2(0.0);
  for (int i = 0; i < 110; i++) {
    m = map(ro + rd * t);
    if (m.x < 0.0012) { hit = 1.0; break; }
    t += m.x * 0.7;
    if (t > 4.6) break;
  }
  if (hit < 0.5) { gl_FragColor = vec4(0.0); return; }
  vec3 p = ro + rd * t;
  vec3 n = calcN(p);
  float c = cos(uYaw), s = sin(uYaw);
  vec3 q = vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z);
  vec4 sf = surface(q, m.y, n);
  vec3 L = normalize(vec3(-0.25, 1.0, -0.4));
  vec3 V = vec3(0.0, 0.0, -1.0);
  float ao = 1.0;
  for (int i = 1; i <= 3; i++) { float h = 0.015 * float(i); ao -= (h - map(p + n * h).x) * 4.0 / float(i); }
  ao = clamp(ao, 0.35, 1.0);
  float dif = clamp(dot(n, L) * 0.65 + 0.35, 0.0, 1.0);
  bool isFin = m.y > 1.5 && m.y < 2.5;
  if (isFin) dif = 0.75 + 0.25 * abs(dot(n, L));
  vec3 amb = mix(vec3(0.16, 0.3, 0.34), vec3(0.45, 0.62, 0.66), 0.5 + 0.5 * n.y);
  vec3 col = sf.rgb * (dif * vec3(1.05, 1.02, 0.95) + amb * 0.45) * ao;
  float specK = isFin ? 0.25 : (m.y > 2.5 && m.y < 3.5 ? 1.4 : (m.y > 3.5 ? 0.5 : 0.85));
  vec3 H = normalize(L + V);
  float sp = pow(max(dot(n, H), 0.0), m.y > 3.5 ? 30.0 : 60.0) * specK;
  float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);
  col += vec3(1.0, 1.0, 0.95) * sp + vec3(0.55, 0.75, 0.8) * fres * 0.25 * (isFin ? 0.3 : 1.0);
  col = mix(col, vec3(0.2, 0.45, 0.5), 0.06);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), sf.a);
}`;

  function buildCreatureAtlas() {
    const glc = document.createElement('canvas');
    let gl = null;
    try { gl = glc.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false }); } catch (e) {}
    if (!gl) return null;
    const mkS = (type, src) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(sh)); return null; }
      return sh;
    };
    const vs = mkS(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }');
    const fs = mkS(gl.FRAGMENT_SHADER, CREATURE_FS);
    if (!vs || !fs) return null;
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
    gl.useProgram(pr);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = name => gl.getUniformLocation(pr, name);
    const out = {};
    for (const kind in MODELS) {
      const md = MODELS[kind];
      const maxSize = SP[kind].len * S * 1.25;
      const ppu = Math.min(maxSize * dpr, kind === 'turtle' ? 340 : 240);   // pixels per body length in the sheet
      const cw = Math.max(8, Math.round(md.w * ppu)), ch = Math.max(8, Math.round(md.h * ppu));
      const ss = 1.5;   // render larger, then shrink: smooth edges
      glc.width = Math.round(cw * ss); glc.height = Math.round(ch * ss);
      gl.viewport(0, 0, glc.width, glc.height);
      gl.uniform2f(U('uRes'), glc.width, glc.height);
      gl.uniform4f(U('uBox'), -md.w / 2, md.top, md.w, md.h);
      gl.uniform1f(U('uSp'), md.id);
      const vars = md.vars || 1;
      out[kind] = [];
      for (let v = 0; v < vars; v++) {
        gl.uniform1f(U('uVar'), v);
        const sheet = document.createElement('canvas');
        sheet.width = cw * NP; sheet.height = ch * NY;
        const sx = sheet.getContext('2d');
        sx.imageSmoothingQuality = 'high';
        for (let yi = 0; yi < NY; yi++) {
          gl.uniform1f(U('uYaw'), (yi / (NY - 1)) * Math.PI);
          for (let pi = 0; pi < NP; pi++) {
            gl.uniform1f(U('uPh'), (pi / NP) * TAU);
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            sx.drawImage(glc, pi * cw, yi * ch, cw, ch);
          }
        }
        out[kind].push({ sheet, cw, ch });
      }
    }
    if (gl.getError() !== gl.NO_ERROR) return null;
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    return out;
  }

  function drawCreature3D(c) {
    const md = MODELS[c.kind], set = atlas3D[c.kind][c.variant || 0];
    const yi = Math.round(clamp(c.theta / Math.PI, 0, 1) * (NY - 1));
    const ph = ((c.phase % TAU) + TAU) % TAU;
    const pi = Math.floor(ph / TAU * NP) % NP;
    const facing = Math.cos(c.theta) >= 0 ? 1 : -1;
    const pitch = clamp(Math.atan2(c.vy, Math.abs(c.vx) + 0.3), -0.45, 0.45) * (c.kind === 'angel' || c.kind === 'turtle' ? 0.5 : 1);
    const w = md.w * c.size, h = md.h * c.size;
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4 * c.z;
    ctx.translate(c.x, c.y);
    const gy = groundY(c.x);
    if (c.kind !== 'cory' && gy - c.y < 120 * S) {
      const a = (1 - (gy - c.y) / (120 * S)) * 0.25;
      ctx.fillStyle = `rgba(10,20,15,${a})`;
      ctx.beginPath(); ctx.ellipse(0, gy - c.y + 6 * S, c.size * 0.35, c.size * 0.06, 0, 0, TAU); ctx.fill();
    }
    ctx.rotate(pitch * facing);
    ctx.drawImage(set.sheet, pi * set.cw, yi * set.ch, set.cw, set.ch, -w / 2, -md.top * c.size, w, h);
    ctx.restore();
  }


  function drawCreature(c) {
    if (atlas3D) { drawCreature3D(c); return; }
    const co = Math.cos(c.theta);
    const facing = co >= 0 ? 1 : -1;
    const sx = facing * Math.max(0.24, Math.abs(co));
    const pitch = clamp(Math.atan2(c.vy, Math.abs(c.vx) + 0.3), -0.45, 0.45) * (c.kind === 'angel' || c.kind === 'turtle' ? 0.5 : 1);
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.45 * c.z;
    ctx.translate(c.x, c.y);
    // soft shadow on the gravel for creatures near the bottom
    const gy = groundY(c.x);
    if (c.kind !== 'cory' && gy - c.y < 120 * S) {
      const a = (1 - (gy - c.y) / (120 * S)) * 0.25;
      ctx.fillStyle = `rgba(10,20,15,${a})`;
      ctx.beginPath(); ctx.ellipse(0, gy - c.y + 6 * S, c.size * 0.35, c.size * 0.06, 0, 0, TAU); ctx.fill();
    }
    ctx.rotate(pitch * facing);
    ctx.scale(sx * c.size, c.size);
    DRAW[c.kind](ctx, c);
    ctx.restore();
  }

  /* =========================================================
     Bubbles, particles, light
     ========================================================= */
  function setupFx() {
    bubbles = [];
    specks = [];
    for (let i = 0; i < 70; i++) specks.push({ x: rand(0, W), y: rand(LY.surfY, H * 0.9), r: rand(0.5, 1.8), vx: rand(-0.08, 0.08), vy: rand(-0.06, 0.04), a: rand(0.15, 0.5), ph: rand(0, TAU) });
    rays = [];
    for (let i = 0; i < 7; i++) rays.push({ x: rand(0, W), w: rand(40, 140) * S, skew: rand(-0.25, 0.25), ph: rand(0, 6), sp: rand(0.15, 0.4) });
  }

  function drawRays(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const col = lerp3([200, 245, 250], [90, 130, 255], n);
    for (const r of rays) {
      const a = (0.05 + 0.05 * (0.5 + 0.5 * Math.sin(t * r.sp + r.ph))) * (1 - n * 0.75);
      const sway = Math.sin(t * 0.25 + r.ph) * 30 * S;
      const len = H * 0.85;
      const g = ctx.createLinearGradient(0, LY.surfY, 0, LY.surfY + len);
      g.addColorStop(0, rgb(col, a)); g.addColorStop(1, rgb(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(r.x - r.w * 0.3 + sway, LY.surfY);
      ctx.lineTo(r.x + r.w * 0.3 + sway, LY.surfY);
      ctx.lineTo(r.x + r.w + r.skew * len, LY.surfY + len);
      ctx.lineTo(r.x - r.w + r.skew * len, LY.surfY + len);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawCaustics(t) {
    const C = causticL.x;
    C.globalCompositeOperation = 'source-over';
    C.clearRect(0, 0, W, H);
    const sc = 1.6 * S + 0.6;
    for (const [ox, oy, s2, a] of [[t * 9, t * 5, sc, 0.55], [-t * 7, t * 8, sc * 1.35, 0.45]]) {
      const pat = C.createPattern(causticTile, 'repeat');
      if (pat.setTransform) pat.setTransform(new DOMMatrix().translateSelf(ox, oy).scaleSelf(s2, s2 * 0.6));
      C.globalAlpha = a;
      C.fillStyle = pat;
      C.fillRect(0, H * 0.35, W, H * 0.65);
    }
    C.globalAlpha = 1;
    C.globalCompositeOperation = 'destination-in';
    C.drawImage(hard.M.c, 0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55 * (1 - n * 0.7);
    ctx.drawImage(causticL.c, 0, 0, W, H);
    ctx.restore();
  }

  function drawBubbles(t, k) {
    const a = LY.airstone;
    if (!reduceMotion && Math.random() < 0.55 * k) bubbles.push({ x: a.x + rand(-6, 6) * S, y: a.y - 14 * S, r: rand(1.2, 2.6) * S, vy: rand(1.2, 2.2), ph: rand(0, TAU) });
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y -= b.vy * k * S * 1.3;
      b.vy = Math.min(3.5, b.vy + 0.01 * k);
      b.x += Math.sin(t * 6 + b.ph + b.y * 0.03) * 0.5 * k + current * 0.25 * k;
      b.r = Math.min(b.r + 0.006 * k * S, 6 * S);
      if (b.y < LY.surfY + 3) { bubbles.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(230,250,255,0.6)'; ctx.lineWidth = 0.9;
      ctx.fillStyle = 'rgba(200,240,255,0.12)';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.r * 0.9, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25, 0, TAU); ctx.fill();
    }
  }

  function drawSpecks(t, k) {
    for (const p of specks) {
      p.x += (p.vx + current * 0.08) * k; p.y += (p.vy + Math.sin(t * 0.5 + p.ph) * 0.03) * k;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < LY.surfY) p.y = H * 0.85; if (p.y > H * 0.9) p.y = LY.surfY + 5;
      ctx.fillStyle = `rgba(230,245,240,${p.a * (1 - n * 0.5)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
  }

  // the underside of the water surface, the air gap and the lid with its light
  function drawTop(t) {
    const { lidH, surfY } = LY;
    // lid
    const lg = ctx.createLinearGradient(0, 0, 0, lidH);
    lg.addColorStop(0, '#0c0e10'); lg.addColorStop(1, '#22272b');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, lidH);
    // the lamp strip
    const led = lerp3([235, 250, 255], [90, 120, 255], n);
    ctx.fillStyle = rgb(led, 0.9);
    ctx.fillRect(W * 0.06, lidH - 2.5 * S, W * 0.88, 2.5 * S);
    const glow = ctx.createLinearGradient(0, lidH, 0, surfY + H * 0.04);
    glow.addColorStop(0, rgb(led, 0.35)); glow.addColorStop(1, rgb(led, 0));
    ctx.fillStyle = glow; ctx.fillRect(0, lidH, W, surfY + H * 0.04 - lidH);
    // air gap above the water
    const ag = ctx.createLinearGradient(0, lidH, 0, surfY);
    ag.addColorStop(0, 'rgba(40,70,80,0.75)'); ag.addColorStop(1, 'rgba(70,120,130,0.55)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.moveTo(0, lidH);
    ctx.lineTo(W, lidH);
    for (let px = W; px >= 0; px -= 12) ctx.lineTo(px, surfY + Math.sin(px * 0.03 + t * 2) * 1.5 * S);
    ctx.closePath(); ctx.fill();
    // silvery underside of the surface (total internal reflection), with moving ripples
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const band = H * 0.045;
    const sg = ctx.createLinearGradient(0, surfY, 0, surfY + band);
    sg.addColorStop(0, rgb(lerp3([220, 250, 255], [120, 150, 255], n), 0.4 * (1 - n * 0.5)));
    sg.addColorStop(1, 'rgba(200,240,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, surfY, W, band);
    ctx.strokeStyle = rgb(lerp3([235, 255, 255], [140, 170, 255], n), 0.35 * (1 - n * 0.5));
    ctx.lineWidth = 1.2 * S;
    for (let row = 0; row < 4; row++) {
      ctx.beginPath();
      const y0 = surfY + 3 + row * band * 0.22;
      for (let px = 0; px <= W; px += 10) {
        const y = y0 + Math.sin(px * 0.025 + t * (1.4 + row * 0.3) + row) * 2 * S + Math.sin(px * 0.07 - t * 2.1) * 0.8 * S;
        px ? ctx.lineTo(px, y) : ctx.moveTo(px, y);
      }
      ctx.stroke();
    }
    ctx.restore();
    // water line seen through the glass
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let px = 0; px <= W; px += 12) { const y = surfY + Math.sin(px * 0.03 + t * 2) * 1.5 * S; px ? ctx.lineTo(px, y) : ctx.moveTo(px, y); }
    ctx.stroke();
  }

  /* =========================================================
     Resize and main loop
     ========================================================= */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = clamp(Math.min(W, H * 1.6) / 1200, 0.55, 1.15);
    LY = computeLayout();
    back = renderBack();
    hard = renderHard();
    if (!causticTile) causticTile = makeCausticTile();
    causticL = layer();
    setupPlants();
    try { atlas3D = buildCreatureAtlas(); } catch (e) { console.warn(e); atlas3D = null; }
    setupCreatures();
    setupFx();
  }

  let last = null;
  function frame(now) {
    const dt = last == null ? 0.016 : Math.min(0.1, (now - last) / 1000);
    last = now;
    const t = reduceMotion ? 0 : now / 1000;
    const k = reduceMotion ? 0 : dt * 60;
    const target = night ? 1 : 0;
    if (n !== target) n = target > n ? Math.min(target, n + dt / 2) : Math.max(target, n - dt / 2);
    current = 0.5 + 0.3 * Math.sin(t * 0.21) + 0.15 * Math.sin(t * 0.07);

    // the school of neons wanders as one
    school.timer -= dt;
    if (school.timer <= 0) {
      school.timer = rand(4, 9);
      school.tx = rand(W * 0.12, W * 0.88);
      school.ty = rand(swimTop() + 40 * S, H * 0.62);
    }
    for (const c of creatures) updateCreature(c, k * (1 - n * 0.45), t, dt);

    ctx.globalAlpha = 1;
    ctx.drawImage(back.c, 0, 0, W, H);
    drawRays(t);
    const sorted = creatures.slice().sort((a, b) => a.z - b.z);
    for (const v of vals) if (v.z < 0.5) drawVal(v, t);
    for (const c of sorted) if (c.z < 0.55 && c.kind !== 'cory') drawCreature(c);
    ctx.drawImage(hard.L.c, 0, 0, W, H);
    drawCaustics(t);
    for (const s0 of stems) drawStem(s0, t);
    for (const sw of swords) drawSword(sw, t);
    for (const v of vals) if (v.z >= 0.5) drawVal(v, t);
    drawBubbles(t, k);
    for (const c of sorted) if (c.z >= 0.55 || c.kind === 'cory') drawCreature(c);
    drawSpecks(t, k);
    drawTop(t);

    // moonlight: dim blue light at night
    if (n > 0.001) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = rgb(lerp3([255, 255, 255], [45, 70, 140], n));
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    // faint reflection on the front glass, and a soft vignette
    const rg = ctx.createLinearGradient(W * 0.55, 0, W * 0.85, H);
    rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(0.5, `rgba(255,255,255,${0.035 * (1 - n * 0.6)})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,15,0.4)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
